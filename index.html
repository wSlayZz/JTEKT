// Normalise un nom de feuille ("JAN","JANV","SEPT","SEP"...) vers un index de mois 0-11. Retourne -1 si non reconnu.
function chokkoNormalizeMonthName(name){
  if(!name) return -1;
  var n = String(name).trim().toUpperCase().replace(/[^A-ZÉÛ]/g,'');
  var map = {
    JAN:0, JANV:0, JANVIER:0,
    FEV:1, FEVR:1, FEVRIER:1,
    MAR:2, MARS:2,
    AVR:3, AVRIL:3,
    MAI:4,
    JUIN:5,
    JUIL:6, JUILLET:6,
    AOU:7, AOUT:7, AOUT2:7,
    SEP:8, SEPT:8, SEPTEMBRE:8,
    OCT:9, OCTOBRE:9,
    NOV:10, NOVEMBRE:10,
    DEC:11, DECEMBRE:11
  };
  return map[n]!==undefined ? map[n] : -1;
}

function chokkoParseSheetAoa(aoa, ligne, year, monthIdx, summary){
  // Detecte la ligne d'entete par sa structure : au moins 4 cellules numeriques 1-31, globalement
  // croissantes, sur une ligne dont la colonne A n'est ni un poste (OPxxxx) ni une equipe (A/B/C ou D)
  // ni une ligne calculee (TOTAL.../CHOKKO...). Le premier jour n'est pas forcement 1 (ex: semaine
  // commencant un vendredi), donc on ne peut pas exiger que la colonne B contienne 1.
  var headerRow = -1;
  for(var r=0; r<Math.min(aoa.length, 45); r++){
    var row = aoa[r];
    if(!row) continue;
    var label0 = row[0]!==undefined && row[0]!==null ? String(row[0]).trim() : '';
    if(/^OP\w/i.test(label0) || /^[AB]$/i.test(label0) || /C\s*ou\s*D/i.test(label0) || /^TOTAL|^CHOKKO/i.test(label0)) continue;
    var count = 0, lastVal = -1, ascending = true;
    for(var c=1; c<row.length; c++){
      var v = row[c];
      if(typeof v==='number' && v>=1 && v<=31){
        if(v<lastVal) ascending = false;
        lastVal = v; count++;
      }
    }
    if(count>=4 && ascending){ headerRow = r; break; }
  }
  if(headerRow<0) return false; // feuille non reconnue (PDCA, etc.)

  var header = aoa[headerRow];
  var dayCols = []; // {col, day}
  for(var c=1; c<Math.max(header.length, 40); c++){
    var v = header[c];
    if(typeof v==='number' && v>=1 && v<=31){ dayCols.push({col:c, day:v}); }
    else if(typeof v==='string' && v.trim()!==''){ break; } // colonne TOTAL NC atteinte : fin de la plage de jours
    // cellule vide au milieu (ex: week-end non renseigne dans l'entete elle-meme) -> on continue sans s'arreter
  }
  if(!dayCols.length) return false;
  var actionsCol = dayCols[dayCols.length-1].col + 2; // TOTAL NC puis ACTIONS

  var nbImportedDefects = 0, nbImportedProd = 0, nbNotes = 0;
  var teamMap = {A:'A', B:'B'};
  var seenPostesInSheet = {};

  for(var r2=headerRow+1; r2<aoa.length; r2++){
    var row = aoa[r2];
    if(!row || row[0]===undefined || row[0]===null || String(row[0]).trim()==='') continue;
    var label = String(row[0]).trim();
    if(/^TOTAL|^CHOKKO/i.test(label)) continue; // lignes calculées, on ne les importe pas (recalcul auto)

    var posteMatch = label.match(/^([A-Z]{2}\d+[A-Za-z]?)\s*-/); // ex: "OP1010 - Emm Bague / Moteur"
    var isTeamRow = /^A$/i.test(label) || /^B$/i.test(label) || /C\s*ou\s*D/i.test(label);

    if(posteMatch){
      var posteId = posteMatch[1].toUpperCase();
      var posteFullLabel = label.slice(label.indexOf('-')+1).trim();

      // Certains fichiers reutilisent le meme code pour deux postes distincts selon la reference
      // (ex: MCU2 "OP1090" a la fois pour "Sertissage Capot 143X/144P" et "Vissages Capot 149X").
      // On desambiguise en reprenant les suffixes A/B deja utilises dans la configuration courante.
      // Certains fichiers reutilisent le meme code pour deux postes distincts selon la reference
      // (ex: MCU2 "OP1090" a la fois pour "Sertissage Capot 143X/144P" et "Vissages Capot 149X").
      // On desambiguise systematiquement via le libelle, meme sur la toute premiere occurrence,
      // pour que ca corresponde aux codes OP1090A/OP1090B deja utilises dans la configuration.
      if(/143X|144P/i.test(posteFullLabel)) posteId = posteId+'A';
      else if(/149X/i.test(posteFullLabel)) posteId = posteId+'B';
      else if(seenPostesInSheet[posteId]!==undefined){
        posteId = posteId+'_'+(++seenPostesInSheet[posteMatch[1].toUpperCase()]);
      }
      seenPostesInSheet[posteMatch[1].toUpperCase()] = seenPostesInSheet[posteMatch[1].toUpperCase()]||1;

      // Si ce code de poste n'existe pas dans la configuration actuelle de la ligne (ancienne
      // numerotation, poste renomme depuis), on memorise son libelle d'origine pour qu'il reste
      // visible dans le tableau au lieu de disparaitre silencieusement.
      var knownIds = (CHOKKO_CONFIG[ligne]||[]).map(function(p){return p[0];});
      if(knownIds.indexOf(posteId)<0){
        if(!DATA.chokkoPosteLabels[ligne]) DATA.chokkoPosteLabels[ligne] = {};
        if(!DATA.chokkoPosteLabels[ligne][posteId]) DATA.chokkoPosteLabels[ligne][posteId] = posteFullLabel;
      }

      var ateqLinked = posteId==='OP1120' && (ligne==='MCU1' || ligne==='MCU2');
      dayCols.forEach(function(dc){
        var val = row[dc.col];
        if(typeof val==='number'){
          var dateStr = year+'-'+String(monthIdx+1).padStart(2,'0')+'-'+String(dc.day).padStart(2,'0');
          if(dateStr>todayStr()){ summary.futureSkipped = (summary.futureSkipped||0)+1; return; }   // jamais de donnée dans le futur (mauvaise année)
          var e = chokkoGetOrCreate(ligne, dateStr);
          e.defects[posteId] = val;
          nbImportedDefects++;
          // Le defaut principal (nbDefauts) du controle ATEQ alimente aussi l'onglet ATEQ, comme en saisie manuelle.
          // Le 2nd passage (nb2nd) n'existe pas dans le fichier CHOKKO et n'est donc jamais touche ici.
          if(ateqLinked){
            var ae = DATA.ateq.find(function(a){ return a.date===dateStr && a.ligne===ligne; });
            if(ae){ ae.nbDefauts = val; } else { DATA.ateq.push({id:uid('ateq'), date:dateStr, ligne:ligne, nbDefauts:val, nb2nd:0}); }
            summary.ateqLinked = (summary.ateqLinked||0)+1;
          }
        }
      });
      var actionsText = row[actionsCol];
      if(actionsText && String(actionsText).trim()){
        var n = chokkoNote(ligne, posteId, year, monthIdx);
        if(!n){ n = {id:uid('chknote'), ligne:ligne, poste:posteId, annee:year, mois:monthIdx, texte:''}; DATA.chokkoNotes.push(n); }
        n.texte = String(actionsText).trim();
        nbNotes++;
      }
    } else if(isTeamRow){
      var teamId = /C\s*ou\s*D/i.test(label) ? 'CouD' : label.toUpperCase();
      dayCols.forEach(function(dc){
        var val = row[dc.col];
        if(typeof val==='number'){
          var dateStr2 = year+'-'+String(monthIdx+1).padStart(2,'0')+'-'+String(dc.day).padStart(2,'0');
          if(dateStr2>todayStr()){ summary.futureSkipped = (summary.futureSkipped||0)+1; return; }
          var e2 = chokkoGetOrCreate(ligne, dateStr2);
          e2.prod[teamId] = val;
          nbImportedProd++;
        }
      });
    }
  }
  summary.defects += nbImportedDefects;
  summary.prod += nbImportedProd;
  summary.notes += nbNotes;
  summary.sheets++;
  return true;
}

async function handleChokkoImportRun(){
  var fileInput = document.getElementById('ci-file');
  var file = fileInput.files && fileInput.files[0];
  if(!file){ toast('Choisissez un fichier Excel.', 'error'); return; }
  if(typeof XLSX==='undefined'){ toast('La librairie Excel n\'a pas pu être chargée.', 'error'); return; }
  var ligne = document.getElementById('ci-ligne').value;
  var year = Number(document.getElementById('ci-annee').value) || chokkoYear;
  var wipeFirst = document.getElementById('ci-wipe').checked;

  var nbWiped = 0;
  if(wipeFirst){
    var beforeCount = DATA.chokko.length;
    DATA.chokko = DATA.chokko.filter(function(e){ return e.ligne!==ligne; });
    nbWiped = beforeCount - DATA.chokko.length;
    DATA.chokkoNotes = DATA.chokkoNotes.filter(function(n){ return n.ligne!==ligne; });
    if(DATA.chokkoPosteLabels[ligne]) delete DATA.chokkoPosteLabels[ligne];
  }

  var buffer = new Uint8Array(await file.arrayBuffer());
  var wb = XLSX.read(buffer, {type:'array', cellDates:false});
  var summary = {sheets:0, defects:0, prod:0, notes:0, skipped:[], monthsImported:[]};

  // Le fichier peut etre un compteur glissant sur 12 mois (ex: SEP,OCT,NOV,DEC,JAN,...,AOUT,SEPT).
  // Regle : tout mois situe AVANT la premiere feuille "janvier" dans l'ordre du fichier appartient
  // a l'annee precedente ; a partir de janvier (inclus), on est sur l'annee saisie par l'utilisateur.
  var sheetMonths = wb.SheetNames.map(function(name){ return {name:name, monthIdx:chokkoNormalizeMonthName(name)}; });
  var janPos = sheetMonths.findIndex(function(s){ return s.monthIdx===0; });

  sheetMonths.forEach(function(s, i){
    if(s.monthIdx<0){ summary.skipped.push(s.name); return; }
    var ws = wb.Sheets[s.name];
    var aoa = XLSX.utils.sheet_to_json(ws, {header:1, raw:true, defval:null});
    var yearForSheet = (janPos>=0 && i<janPos) ? year-1 : year;
    if(yearForSheet!==year){
      summary.duplicateMonths = summary.duplicateMonths||[];
      summary.duplicateMonths.push(s.name+' → traitée comme '+yearForSheet);
    }
    var ok = chokkoParseSheetAoa(aoa, ligne, yearForSheet, s.monthIdx, summary);
    if(ok){
      summary.monthsImported.push(s.monthIdx);
      summary.periodsImported = summary.periodsImported||[];
      summary.periodsImported.push({year:yearForSheet, month:s.monthIdx});
    } else summary.skipped.push(s.name);
  });

  await save('chokko');
  await save('chokkoNotes');
  if(summary.ateqLinked) await save('ateq');
  await save('chokkoPosteLabels');
  logChange('CHOKKO', 'Import Excel', ligne+' '+year+' - '+summary.sheets+' feuille(s), '+summary.defects+' valeurs de défauts, '+summary.prod+' valeurs de production');

  chokkoImportSummary = (nbWiped? '🗑 '+nbWiped+' ancienne(s) entrée(s) de '+ligne+' effacée(s) avant import. ' : '')+
    summary.sheets+' feuille(s) importée(s) pour '+ligne+' ('+year+') : '+summary.defects+' valeurs de défauts, '+summary.prod+' valeurs de production, '+summary.notes+' note(s).'+
    (summary.ateqLinked? ' '+summary.ateqLinked+' valeur(s) liée(s) automatiquement à l\'onglet ATEQ (OP1120).' : '')+
    (summary.duplicateMonths&&summary.duplicateMonths.length? ' Mois en double détecté(s) : '+summary.duplicateMonths.join(', ')+'.' : '')+
    (summary.futureSkipped? ' ⚠ '+summary.futureSkipped+' valeur(s) ignorée(s) car datées dans le futur : vérifiez l\'« Année des données ».' : '')+
    (summary.skipped.length? ' Feuilles ignorées (non reconnues) : '+summary.skipped.join(', ')+'.' : '');
  chokkoLigne = ligne;
  chokkoYear = year;
  if(summary.periodsImported && summary.periodsImported.length){
    var earliest = summary.periodsImported.reduce(function(a,b){ return (a.year*12+a.month) <= (b.year*12+b.month) ? a : b; });
    chokkoMonth = earliest.month;
    chokkoYear = earliest.year;
  }
  toast(summary.sheets+' feuille(s) importée(s) avec succès.');
  render();
}

function chokkoWizardSequence(ligne){
  // Retourne la séquence complète : d'abord les postes (défauts), puis les équipes (production)
  var postes = chokkoPostes(ligne).map(function(p){ return {kind:'poste', id:p[0], label:p[1]}; });

  return postes.concat(teams);
}

function chokkoLastEntryDate(ligne){
  var entries = DATA.chokko.filter(function(e){ return e.ligne===ligne && (Object.keys(e.defects||{}).length || Object.keys(e.prod||{}).length); });
  if(!entries.length) return null;
  return entries.map(function(e){return e.date;}).sort().pop();
}
function chokkoSaisieDelay(ligne){
  var last = chokkoLastEntryDate(ligne);
  if(!last) return null;
  return daysBetween(last, todayStr());
}

// Palette "standard" façon Excel + mémoire des couleurs récemment utilisées
var CHOKKO_PRESET_COLORS = ['#C00000','#FF0000','#FFC000','#FFFF00','#92D050','#00B050','#00B0F0','#0070C0','#002060','#7030A0','#FFFFFF','#000000'];
function contrastTextColor(hex){
  if(!hex || hex.charAt(0)!=='#') return '#1C1B18';
  var h = hex.slice(1);
  if(h.length===3) h = h.split('').map(function(c){return c+c;}).join('');
  var r = parseInt(h.slice(0,2),16), g = parseInt(h.slice(2,4),16), b = parseInt(h.slice(4,6),16);
  // Luminance relative (formule standard W3C)
  var lum = (0.299*r + 0.587*g + 0.114*b)/255;
  return lum < 0.55 ? '#FFFFFF' : '#1C1B18';
}

function secteurConformiteStats(){
  var today = new Date();
  var y = today.getFullYear(), m = today.getMonth();
  var lignes = ['MCU1','MCU2','MCU3'];
  var totalProd = 0, totalNC = 0;
  lignes.forEach(function(l){
    var nb = daysInMonth(y, m);
    for(var d=1; d<=nb; d++){
      var dateStr = y+'-'+String(m+1).padStart(2,'0')+'-'+String(d).padStart(2,'0');
      var t = chokkoDayTotals(l, dateStr);
      totalProd += t.totalProd; totalNC += t.totalNC;
    }
  });
  var bon = Math.max(0, totalProd-totalNC);
  var pct = totalProd>0 ? (bon/totalProd*100) : null;
  return {totalProd:totalProd, totalNC:totalNC, bon:bon, pct:pct};
}

function refreshChokkoTotals(ligne, excludeElId){
  var days = chokkoMonthDays(ligne, chokkoYear, chokkoMonth);
  days.forEach(function(d){
    var prodElId = 'chokko-total-prod-'+d.date;
    var prodEl = document.getElementById(prodElId);
    var ncEl = document.getElementById('chokko-total-nc-'+d.date);
    var pctEl = document.getElementById('chokko-total-pct-'+d.date);
    if(prodEl && prodElId!==excludeElId) prodEl.value = d.totals.totalProd||'';
    if(ncEl) ncEl.textContent = d.totals.totalNC||'-';
    if(pctEl) pctEl.textContent = d.totals.pct!==null ? pct1(d.totals.pct) : '-';
  });
  chokkoPostes(ligne).forEach(function(poste){
    var totalPoste = days.reduce(function(s,d){ var e=chokkoEntry(ligne,d.date); return s+(e?Number(e.defects[poste[0]]||0):0); },0);
    var el = document.getElementById('chokko-poste-total-'+poste[0]);
    if(el) el.textContent = totalPoste;
  });
  var weeks = chokkoWeekGroups(days);
  weeks.forEach(function(w, wi){
    var el = document.getElementById('chokko-week-'+wi);
    if(el) el.textContent = w.avg!==null? pct1(w.avg) : '-';
  });
  var monthAvg = chokkoMonthAverage(ligne, chokkoYear, chokkoMonth);
  var monthRowEl = document.getElementById('chokko-month-row');
  if(monthRowEl) monthRowEl.textContent = monthAvg!==null? pct1(monthAvg) : '-';
  var avgEl = document.getElementById('chokko-month-avg');
  if(avgEl){
    avgEl.textContent = monthAvg!==null? pct1(monthAvg)+'%' : '-';
    avgEl.style.color = 'var(--'+chokkoLevelVsObjectif(monthAvg, ligne)+')';
  }
  if(chokkoView==='saisie') renderChokkoPostesChart();
}
async function handleChokkoDefectChange(ligne, date, poste, val){
  var e = chokkoGetOrCreate(ligne, date);
  var num = parseInt(val,10);
  if(val==='' || !num){ delete e.defects[poste]; } else { e.defects[poste] = Math.max(0, num); }
  await save('chokko');
  refreshChokkoTotals(ligne);
  // Le poste OP1120 "Contrôle ATEQ" alimente directement l'onglet ATEQ (évite une double saisie).
  // Limité à MCU1/MCU2 : l'onglet ATEQ ne couvre pas MCU3 aujourd'hui.
  if(poste==='OP1120' && (ligne==='MCU1' || ligne==='MCU2') && date<=todayStr()){
    var nbDefauts = val===''? 0 : Math.max(0, parseInt(val,10)||0);
    var ateqEntry = DATA.ateq.find(function(a){ return a.date===date && a.ligne===ligne; });
    if(ateqEntry){ ateqEntry.nbDefauts = nbDefauts; }
    else { DATA.ateq.push({id:uid('ateq'), date:date, ligne:ligne, nbDefauts:nbDefauts, nb2nd:0}); }
    await save('ateq');
  }
}
async function handleChokkoProdChange(ligne, date, team, val){
  var e = chokkoGetOrCreate(ligne, date);
  if(val===''){ delete e.prod[team]; } else { e.prod[team] = Math.max(0, parseInt(val,10)||0); }
  await save('chokko');
  refreshChokkoTotals(ligne);
}
async function handleChokkoProdTotalChange(ligne, date, val){
  var e = chokkoGetOrCreate(ligne, date);
  var autoSum = 0;
  CHOKKO_TEAMS.forEach(function(t){ autoSum += Number(e.prod[t[0]]||0); });
  var keepAsIs = false; // true si on garde exactement la saisie (évite un saut de curseur pendant la frappe)
  if(val===''){
    delete e.prodOverride;
  } else {
    var num = Math.max(0, parseInt(val,10)||0);
    if(num===autoSum){ delete e.prodOverride; } else { e.prodOverride = num; keepAsIs = true; }
  }
  await save('chokko');
  refreshChokkoTotals(ligne, keepAsIs ? 'chokko-total-prod-'+date : undefined);
}

// ---------- Export Excel (ExcelJS) — copie conforme du fichier CHOKKO d\'origine ----------
function excelColLetter(n){ // n = 1 -> A, 2 -> B, 27 -> AA ...
  var s = '';
  while(n>0){ var m = (n-1)%26; s = String.fromCharCode(65+m)+s; n = Math.floor((n-1)/26); }
  return s;
}
function chokkoWorkingDays(ligne, year, monthIdx){
  // Reproduit le calendrier reel du fichier source : uniquement les jours ouvres (dimanche exclu)
  return chokkoMonthDays(ligne, year, monthIdx).filter(function(d){
    var dow = new Date(d.date+'T00:00:00').getDay(); // 0 = dimanche
    return dow!==0;
  });
}
function downloadBlob(blob, filename){
  var url = URL.createObjectURL(blob);
  var a = document.createElement('a');
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  setTimeout(function(){ URL.revokeObjectURL(url); }, 1000);
}
async function handleExportChokkoExcel(){
  if(typeof ExcelJS==='undefined'){ uiAlert('La librairie Excel n\'a pas pu être chargée (connexion internet requise). Réessayez.'); return; }
  var ligne = chokkoLigne;
  var postes = chokkoPostes(ligne);
  var wb = new ExcelJS.Workbook();
  var anyMonth = false;

  // Styles réutilisables (repris du fichier source : gris clair pour l\'entete, vert pour les totaux)
  var thinBorder = {top:{style:'thin',color:{argb:'FFB7B7B7'}}, left:{style:'thin',color:{argb:'FFB7B7B7'}}, bottom:{style:'thin',color:{argb:'FFB7B7B7'}}, right:{style:'thin',color:{argb:'FFB7B7B7'}}};
  var headerFill = {type:'pattern', pattern:'solid', fgColor:{argb:'FFD9D9D9'}}; // Blanc, Arrière-plan 1, Plus sombre 15%
  var chokkoFill = {type:'pattern', pattern:'solid', fgColor:{argb:'FFE2EFDA'}}; // Vert, Accentuation 6, Plus clair 80%
  var greenFont = {color:{argb:'FF548235'}, bold:true, name:'Calibri', size:11}; // Vert, Accentuation 6, Plus sombre 25%
  var normalFont = {name:'Calibri', size:11};
  var boldFont = {name:'Calibri', size:11, bold:true};
  var headerFont = {name:'Calibri', size:11, bold:true};

  for(var m=0; m<12; m++){
    var allDays = chokkoMonthDays(ligne, chokkoYear, m);
    var hasData = allDays.some(function(d){ return d.totals.totalProd>0 || d.totals.totalNC>0; });
    if(!hasData) continue;
    anyMonth = true;
    var days = chokkoWorkingDays(ligne, chokkoYear, m); // jours ouvres uniquement (dimanche exclu), comme le fichier source
    var nbDays = days.length;

    var ws = wb.addWorksheet(CHOKKO_MONTH_ABBR[m].slice(0,31));

    // Largeurs de colonnes (colonne A large pour les libelles, jours etroits)
    ws.getColumn(1).width = 34;
    for(var c=0; c<nbDays; c++){ ws.getColumn(2+c).width = 5.5; }
    ws.getColumn(2+nbDays).width = 9;
    ws.getColumn(3+nbDays).width = 42;

    var HEADER_ROW = 22; // meme position que dans le fichier source
    var firstPosteRow = HEADER_ROW+1;

    // ----- Ligne d'entete -----
    var hRow = ws.getRow(HEADER_ROW);
    hRow.getCell(1).value = 'DEFAUTS / JOURS';
    days.forEach(function(d, i){ hRow.getCell(2+i).value = d.day; });
    hRow.getCell(2+nbDays).value = 'TOTAL NC';
    hRow.getCell(3+nbDays).value = 'ACTIONS : ';
    for(var c=1; c<=3+nbDays; c++){

      cell.alignment = {horizontal: c===1||c===3+nbDays ? 'left' : 'center', vertical:'middle'};
    }

    // ----- Lignes postes -----
    var posteRowByCol = {}; // posteId -> numero de ligne (pour les formules TOTAL NC en bas)
    postes.forEach(function(poste, pi){
      var r = firstPosteRow+pi;
      posteRowByCol[poste[0]] = r;
      var row = ws.getRow(r);
      row.getCell(1).value = poste[0]+' - '+poste[1];
      days.forEach(function(d, i){

        row.getCell(2+i).value = v;
      });
      var lastColLetter = excelColLetter(1+nbDays);
      row.getCell(2+nbDays).value = {formula: 'SUM(B'+r+':'+lastColLetter+r+')'};
      var note = chokkoNote(ligne, poste[0], chokkoYear, m);
      row.getCell(3+nbDays).value = note ? note.texte : '';
      for(var c=1; c<=3+nbDays; c++){
        var cell = row.getCell(c);
        cell.font = normalFont; cell.border = thinBorder;
        cell.alignment = {horizontal: (c===1||c===3+nbDays) ? 'left' : 'center', vertical:'middle', wrapText:c===3+nbDays};
      }
    });

    // ----- Lignes equipes A / B / C ou D -----
    var teamRows = {};
    CHOKKO_TEAMS.forEach(function(team, ti){
      var r = firstPosteRow + postes.length + ti;
      teamRows[team[0]] = r;
      var row = ws.getRow(r);
      row.getCell(1).value = team[0];
      days.forEach(function(d, i){
        var e = chokkoEntry(ligne, d.date);
        var v = e && e.prod[team[0]]!==undefined ? Number(e.prod[team[0]]) : null;
        row.getCell(2+i).value = v;
      });
      for(var c=1; c<=1+nbDays; c++){
        var cell = row.getCell(c);
        cell.font = boldFont; cell.border = thinBorder;
        cell.alignment = {horizontal: c===1?'left':'center', vertical:'middle'};
      }
    });

    var totalProdRow = firstPosteRow + postes.length + CHOKKO_TEAMS.length;
    var totalNcRow = totalProdRow+1;
    var chokkoJourRow = totalNcRow+1;
    var chokkoSemaineRow = chokkoJourRow+1;
    var chokkoMoisRow = chokkoSemaineRow+1;

    // ----- TOTAL PROD (formule = somme des equipes, ou valeur forcee si l'utilisateur l'a modifiee) -----
    var rowTP = ws.getRow(totalProdRow);
    rowTP.getCell(1).value = 'TOTAL PROD';
    days.forEach(function(d, i){
      var e = chokkoEntry(ligne, d.date);
      var col = excelColLetter(2+i);
      if(e && e.prodOverride!==undefined && e.prodOverride!==null){
        rowTP.getCell(2+i).value = Number(e.prodOverride);
      } else {
        var teamRefs = CHOKKO_TEAMS.map(function(t){ return col+teamRows[t[0]]; }).join('+');
        rowTP.getCell(2+i).value = {formula: teamRefs};
      }
    });
    // ----- TOTAL NC (formule = somme des postes ce jour) -----
    var rowTN = ws.getRow(totalNcRow);
    rowTN.getCell(1).value = 'TOTAL NC';
    days.forEach(function(d, i){
      var col = excelColLetter(2+i);
      var firstP = firstPosteRow, lastP = firstPosteRow+postes.length-1;
      rowTN.getCell(2+i).value = {formula: 'SUM('+col+firstP+':'+col+lastP+')'};
    });
    // ----- CHOKKO DU JOUR (formule) -----
    var rowCJ = ws.getRow(chokkoJourRow);
    rowCJ.getCell(1).value = 'CHOKKO DU JOUR';
    days.forEach(function(d, i){
      var col = excelColLetter(2+i);
      rowCJ.getCell(2+i).value = {formula: 'IFERROR(('+col+totalProdRow+'-'+col+totalNcRow+')/'+col+totalProdRow+'*100,0)'};
    });
    [rowTP, rowTN].forEach(function(row){
      for(var c=1; c<=1+nbDays; c++){
        var cell = row.getCell(c);
        cell.font = greenFont; cell.border = thinBorder;
        cell.alignment = {horizontal: c===1?'left':'center', vertical:'middle'};
      }
    });
    for(var c=1; c<=1+nbDays; c++){
      var cell = rowCJ.getCell(c);
      cell.fill = chokkoFill; cell.font = greenFont; cell.border = thinBorder;
      cell.alignment = {horizontal: c===1?'left':'center', vertical:'middle'};
      if(c>1) cell.numFmt = '0.0';
    }

    // ----- CHOKKO DE LA SEMAINE (une valeur par semaine, cellules fusionnees) -----
    var weekGroups = chokkoWeekGroups(days);
    var rowCS = ws.getRow(chokkoSemaineRow);
    rowCS.getCell(1).value = 'CHOKKO DE LA SEMAINE';
    rowCS.getCell(1).font = greenFont; rowCS.getCell(1).fill = chokkoFill; rowCS.getCell(1).border = thinBorder;
    weekGroups.forEach(function(w){
      var startCol = 2+w.startIdx, endCol = 2+w.startIdx+w.span-1;
      var startL = excelColLetter(startCol), endL = excelColLetter(endCol);
      if(w.span>1) ws.mergeCells(chokkoSemaineRow, startCol, chokkoSemaineRow, endCol);
      var cell = ws.getCell(chokkoSemaineRow, startCol);
      cell.value = {formula: 'AVERAGE('+startL+chokkoJourRow+':'+endL+chokkoJourRow+')'};
      cell.numFmt = '0.0'; cell.fill = chokkoFill; cell.font = greenFont; cell.border = thinBorder;
      cell.alignment = {horizontal:'center', vertical:'middle'};
    });

    // ----- CHOKKO DU MOIS (une seule valeur fusionnee sur tout le mois) -----
    var rowCM = ws.getRow(chokkoMoisRow);
    rowCM.getCell(1).value = 'CHOKKO DU MOIS';
    rowCM.getCell(1).font = greenFont; rowCM.getCell(1).fill = chokkoFill; rowCM.getCell(1).border = thinBorder;
    if(nbDays>1) ws.mergeCells(chokkoMoisRow, 2, chokkoMoisRow, 1+nbDays);
    var lastColL = excelColLetter(1+nbDays);
    var moisCell = ws.getCell(chokkoMoisRow, 2);
    moisCell.value = {formula: 'AVERAGE(B'+chokkoJourRow+':'+lastColL+chokkoJourRow+')'};
    moisCell.numFmt = '0.0'; moisCell.fill = chokkoFill; moisCell.font = greenFont; moisCell.border = thinBorder;
    moisCell.alignment = {horizontal:'center', vertical:'middle'};

    // ----- Tableau recapitulatif MOIS / % CHOKKO (en haut a droite, comme dans le fichier source) -----
    var summaryCol = 4+nbDays+1; // une colonne de marge apres ACTIONS
    ws.getCell(1, summaryCol).value = 'MOIS';
    ws.getCell(1, summaryCol+1).value = '% CHOKKO';
    ws.getCell(1, summaryCol+2).value = '€ / PIECE';
    [0,1,2].forEach(function(off){ var c=ws.getCell(1,summaryCol+off); c.font=headerFont; c.border=thinBorder; c.fill=headerFill; });
    for(var mm=0; mm<12; mm++){
      var rr = 2+mm;
      var lbl = MONTHS_FR[mm].slice(0,3).toUpperCase();
      ws.getCell(rr, summaryCol).value = lbl;
      var avg = chokkoMonthAverage(ligne, chokkoYear, mm);
      ws.getCell(rr, summaryCol+1).value = avg!==null ? Math.round(avg*100)/100 : null;
      ws.getCell(rr, summaryCol).font = normalFont;
      ws.getCell(rr, summaryCol+1).font = normalFont;
      ws.getCell(rr, summaryCol).border = thinBorder;

    }

    ws.getColumn(summaryCol+1).width = 10;

    // ----- Graphique "Suivi des causes de non Chokko" inséré en image (voir note ci-dessous) -----
    var chartImgData = renderOffscreenChokkoPostesChart(ligne, chokkoYear, m);
    if(chartImgData){
      var imgId = wb.addImage({base64:chartImgData, extension:'png'});
      ws.addImage(imgId, {tl:{col:1, row:chokkoMoisRow+2}, ext:{width:750, height:350}});
    }
  }

  if(!anyMonth){ toast('Aucune donnée saisie pour '+ligne+' en '+chokkoYear+'.', 'error'); return; }
  var buffer = await wb.xlsx.writeBuffer();
  var blob = new Blob([buffer], {type:'application/octet-stream'});
  downloadBlob(blob, 'CHOKKO_'+ligne+'_'+chokkoYear+'.xlsx');
  logChange('CHOKKO', 'Export Excel', ligne+' - '+chokkoYear);

}

// ---------- ARCHIVES ----------
function toCSV(rows, columns){
  var lines = [columns.map(function(c){return c[1];}).join(';')];
  rows.forEach(function(r){
    lines.push(columns.map(function(c){
      var v = r[c[0]];
      if(v===null||v===undefined) v='';
      v = String(v).replace(/"/g,'""');
      if(v.indexOf(';')>=0 || v.indexOf('"')>=0 || v.indexOf('\n')>=0) v = '"'+v+'"';
      return v;
    }).join(';'));
  });
  return lines.join('\r\n');
}
function downloadText(filename, text, mime){
  mime = mime || 'text/csv;charset=utf-8';
  var blob = new Blob(['\ufeff'+text], {type:mime});
  var url = URL.createObjectURL(blob);
  var a = document.createElement('a');
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  setTimeout(function(){ URL.revokeObjectURL(url); }, 1000);
}

// Clé stable d'une zone défilante : son id, sinon sa classe + celle de son tableau + son rang parmi les zones identiques
function scrollZoneKeys(){
  var zones = view.querySelectorAll('.table-wrap, .modal-box, .ap-list');
  var seen = {}, out = [];
  Array.prototype.forEach.call(zones, function(z){
    var inner = z.querySelector('table');
    var sig = z.id ? '#'+z.id : (z.className+'|'+(inner? inner.className : ''));
    seen[sig] = (seen[sig]||0) + 1;
    out.push({el:z, key: sig+'|'+seen[sig]});
  });
  return out;
}
var lastRenderedTab = null;
function captureScrollPositions(){
  var snap = {tab:lastRenderedTab, zones:{}, winX:window.scrollX, winY:window.scrollY};
  scrollZoneKeys().forEach(function(z){
    if(z.el.scrollLeft || z.el.scrollTop) snap.zones[z.key] = {left:z.el.scrollLeft, top:z.el.scrollTop};
  });
  return snap;
}
function restoreScrollPositions(snap){
  var sameTab = snap.tab===currentTab;
  lastRenderedTab = currentTab;
  if(!sameTab) return;   // changement d'onglet : affichage normal, en haut à gauche
  scrollZoneKeys().forEach(function(z){
    var s = snap.zones[z.key];
    if(s){ z.el.scrollLeft = s.left; z.el.scrollTop = s.top; }
  });
  if(window.scrollY!==snap.winY || window.scrollX!==snap.winX) window.scrollTo(snap.winX, snap.winY);
}

// Score de conformité d'un secteur hors MCU (audits perf du mois, métrologie, actions) - source unique
function secteurGaugeScoreFor(sid){
  var curM = Number(todayStr().split('-')[1])-1;
  var curY = Number(todayStr().split('-')[0]);
  var inSect = function(x){ return (x.secteur||'MCU')===sid; };
  var perfMonth = DATA.perf.filter(function(r){ return (r.secteur||'')===sid && r.annee===curY && r.mois===curM && r.resultatPct!==null && r.resultatPct!==undefined; });
  var perfMoy = perfMonth.length ? Math.round(perfMonth.reduce(function(s,r){return s+r.resultatPct;},0)/perfMonth.length) : null;
  var parts = [], detail = [];
  if(perfMoy!==null){ parts.push(perfMoy); detail.push({label:'Audits perf', val:perfMoy}); }

    parts.push(mScore); detail.push({label:'Métrologie à jour', val:mScore});

  var actionsSect = DATA.actions.filter(inSect);

// Bannière consolidée pour les utilisateurs multi-secteurs (responsable qualité)
function secteurPropreteScore(sid, curY, curM){
  if(sid!=='MCU') return {score:null, label:'propreté'};
  var rs = DATA.resultats.filter(function(r){ return r.resultatPct!==null && r.resultatPct!==undefined; });
  var moisLabel = MONTHS_FR[curM].charAt(0).toUpperCase()+MONTHS_FR[curM].slice(1);
  var monthScores = rs.filter(function(r){ return r.mois===moisLabel && (r.annee===curY || r.annee===undefined); });
  if(monthScores.length){
    return {score:Math.round(monthScores.reduce(function(s,r){return s+r.resultatPct;},0)/monthScores.length), label:'propreté du mois'};
  }
  var sorted = rs.slice().sort(function(a,b){
    var ay=a.annee||curY, by=b.annee||curY, am=MONTHS_FR.indexOf(a.mois.toLowerCase()), bm=MONTHS_FR.indexOf(b.mois.toLowerCase());
    return (by*12+bm)-(ay*12+am);
  });
  if(sorted.length){
    var lastMois = sorted[0].mois, lastAnnee = sorted[0].annee||curY;
    var lastScores = rs.filter(function(r){ return r.mois===lastMois && (r.annee||curY)===lastAnnee; });
    return {score:Math.round(lastScores.reduce(function(s,r){return s+r.resultatPct;},0)/lastScores.length), label:'propreté - '+lastMois};
  }
  return {score:null, label:'propreté'};
}
function secteurPerfScore(sid, curY, curM){
  var perfAll = DATA.perf.filter(function(r){ return (r.secteur||'')===sid && r.resultatPct!==null && r.resultatPct!==undefined; });
  var perfM = perfAll.filter(function(r){ return r.annee===curY && r.mois===curM; });
  if(perfM.length){
    return {score:Math.round(perfM.reduce(function(s,r){return s+r.resultatPct;},0)/perfM.length), label:'perf du mois'};
  }
  if(perfAll.length){
    var sortedP = perfAll.slice().sort(function(a,b){ return (b.annee*12+b.mois)-(a.annee*12+a.mois); });
    var lastY = sortedP[0].annee, lastM = sortedP[0].mois;
    var lastP = perfAll.filter(function(r){ return r.annee===lastY && r.mois===lastM; });
    return {score:Math.round(lastP.reduce(function(s,r){return s+r.resultatPct;},0)/lastP.length), label:'perf - '+(MONTHS_FR[lastM].charAt(0).toUpperCase()+MONTHS_FR[lastM].slice(1))};
  }
  return {score:null, label:'perf'};
}
function secteurMetroScore(sid){
  var metroSect = DATA.metro.filter(function(e){ return (e.secteur||'MCU')===sid; });
  if(!metroSect.length) return {score:null, label:'métrologie'};
  var late = metroSect.filter(function(e){ return metroStatus(e).level==='danger'; }).length;
  return {score:Math.round((1-late/metroSect.length)*100), label:'métro. à jour'};
}
function secteurAllScore(sid, curY, curM){
  // Même calcul que le tableau de bord du secteur, pour qu'il n'existe qu'un seul "score de conformité"
  if(sid==='MCU'){
    var saved = currentSecteur;
    try{ currentSecteur = 'MCU'; var g = globalConformityScore(); }
    finally{ currentSecteur = saved; }
    return {score: (g && g.score!==null && g.score!==undefined) ? g.score : null, label:'score de conformité'};
  }
  return {score: secteurGaugeScoreFor(sid).score, label:'score de conformité'};
}

async function handlePlanningRecurGenerate(){
  var type = document.getElementById('pr-type').value;
  var lignes = Array.prototype.map.call(document.querySelectorAll('.pr-ligne-chk:checked'), function(c){return c.value;});
  if(!lignes.length){ toast('Sélectionnez au moins une ligne.', 'error'); return; }
  var freqSel = document.getElementById('pr-freq').value;
  var interval = freqSel==='custom' ? Math.max(1, Number(document.getElementById('pr-custom-days').value)||7) : Number(freqSel);
  var start = document.getElementById('pr-start').value || todayStr();
  var count = Math.max(1, Math.min(52, Number(document.getElementById('pr-count').value)||1));
  var responsable = resolveResponsableFromInputs('pr-responsable-select','pr-responsable-autre');
  var refVal = type==='labo' ? document.getElementById('pr-ref').value : null;

  var dates = [];
  var d = new Date(start+'T00:00:00');
  for(var i=0; i<count; i++){
    dates.push(fmtISOLocal(d));
    d.setDate(d.getDate()+interval);
  }

  var created = 0;
  dates.forEach(function(dateStr){
    var monthIdx = Number(dateStr.slice(5,7))-1;
    var moisLabel = MONTHS_FR[monthIdx].charAt(0).toUpperCase()+MONTHS_FR[monthIdx].slice(1)+' '+dateStr.slice(0,4);
    lignes.forEach(function(l){
      var entry = {id:uid('planning'), secteur:currentSecteur, ligne:l, type:type, mois:moisLabel, echeance:dateStr, realisation:null, responsable:responsable||null, resultatPct:null};
      if(type==='labo' && refVal){ var parts = refVal.split('|'); entry.ligne = parts[0]; entry.ref = parts[1]; }
      DATA.planning.push(entry);
      created++;
    });
  });
  await save('planning');
  logChange('Planning', 'Récurrence créée', created+' échéance(s) - '+(PLAN_TYPES.filter(function(t){return t[0]===type;})[0]||['',type])[1]);
  planningRecurSummary = created+' échéance(s) créée(s) du '+fmtDate(dates[0])+' au '+fmtDate(dates[dates.length-1])+'.';
  toast(created+' échéance(s) générée(s).');
  render();
}

var ateqWeekOffset = 0;
var DAY_LABELS = ['Lun','Mar','Mer','Jeu','Ven','Sam','Dim'];
function mondayOf(dateStr){
  var p = dateStr.split('-').map(Number);
  var d = new Date(p[0], p[1]-1, p[2]);
  var dow = d.getDay();
  var diff = (dow===0? -6 : 1-dow);
  d.setDate(d.getDate()+diff);
  return d;
}
function fmtISOLocal(d){
  var y=d.getFullYear(), m=String(d.getMonth()+1).padStart(2,'0'), day=String(d.getDate()).padStart(2,'0');
  return y+'-'+m+'-'+day;
}
function getWeekDates(offset){
  var mon = mondayOf(todayStr());
  mon.setDate(mon.getDate()+offset*7);
  var days=[];
  for(var i=0;i<7;i++){ var d=new Date(mon); d.setDate(mon.getDate()+i); days.push(fmtISOLocal(d)); }
  return days;
}
function fmtDateShort(iso){ var p=iso.split('-'); return p[2]+'/'+p[1]; }
function currentYYYYMM(offsetMonths){
  var p = todayStr().split('-').map(Number);
  var d = new Date(p[0], p[1]-1, 1);
  d.setMonth(d.getMonth()+offsetMonths);
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0');
}
function monthTotal(ligne, yyyymm){
  return DATA.ateq.filter(function(a){ return a.ligne===ligne && a.date.slice(0,7)===yyyymm; })
    .reduce(function(s,a){ return s+(a.nbDefauts||0); }, 0);
}
function weeklySeries(ligne, numWeeks){
  var result = [];
  for(var w=numWeeks-1; w>=0; w--){
    var days = getWeekDates(-w);
    var total=0, nb2nd=0;
    days.forEach(function(d){
      var e = DATA.ateq.find(function(a){return a.date===d && a.ligne===ligne;});
      if(e){ total += (e.nbDefauts||0); nb2nd += (e.nb2nd||0); }
    });
    result.push({label: fmtDateShort(days[0]), total:total, nb2nd:nb2nd, taux: total>0? Math.round(nb2nd/total*100) : null});
  }
  return result;
}
function ateqMonthlySummary(numMonths){
  var rows = [];
  for(var m=numMonths-1; m>=0; m--){
    var yyyymm = currentYYYYMM(-m);
    var label = MONTHS_FR[Number(yyyymm.slice(5,7))-1];
    label = label.charAt(0).toUpperCase()+label.slice(1)+' '+yyyymm.slice(0,4);
    ['MCU1','MCU2'].forEach(function(l){
      var items = DATA.ateq.filter(function(a){ return a.ligne===l && a.date.slice(0,7)===yyyymm; });
      if(!items.length) return;
      var total = items.reduce(function(s,a){return s+(a.nbDefauts||0);},0);
      var nb2nd = items.reduce(function(s,a){return s+(a.nb2nd||0);},0);
      rows.push({label:label, ligne:l, total:total, nb2nd:nb2nd, taux: total>0? Math.round(nb2nd/total*100):0, jours:items.length});
    });
  }
  return rows.reverse();
}
function svgBarChart(items, color){
  var width = 320, height = 110;
  var max = Math.max(1, Math.max.apply(null, items.map(function(it){return it.total;})));
  var bw = width/items.length;
  var bars = items.map(function(it,i){
    var h = Math.max(2, Math.round((it.total/max)*(height-26)));
    var x = i*bw+bw*0.18, y=height-20-h, w=bw*0.64;
    return '<rect x="'+x.toFixed(1)+'" y="'+y+'" width="'+w.toFixed(1)+'" height="'+h+'" fill="'+color+'" rx="2"></rect>'+
      (it.total>0? '<text x="'+(x+w/2).toFixed(1)+'" y="'+(y-3)+'" font-size="9" text-anchor="middle" fill="#1C1B18">'+it.total+'</text>':'')+
      '<text x="'+(x+w/2).toFixed(1)+'" y="'+(height-6)+'" font-size="8.5" text-anchor="middle" fill="#9C978A">'+esc(it.label)+'</text>';
  }).join('');
  return '<svg viewBox="0 0 '+width+' '+height+'" style="width:100%; height:'+height+'px;">'+bars+'</svg>';
}
function trendBadge(current, previous){
  if(!previous) return current>0? '<span class="tiny">(mois précédent : aucune donnée)</span>' : '';
  var pct = Math.round(((current-previous)/previous)*100);
  if(pct===0) return '<span class="tiny">Stable vs mois précédent</span>';
  var up = pct>0;
  return '<span class="tiny" style="color:'+(up?'var(--danger)':'var(--ok)')+'; font-weight:600;">'+(up?'▲':'▼')+' '+Math.abs(pct)+'% vs mois précédent</span>';
}

      var done = isActionDone(a);
      var dl = (!done && a.echeance) ? daysLabel(a.echeance) : null;
      var lvl = isActionLate(a)?'danger':(a.statut==='planifiee'?'warn':'ok');

      var e = a.dateCrise && a.ligne ? DATA.ateq.find(function(x){return x.date===a.dateCrise&&x.ligne===a.ligne;}) : null;
      var criseTxt = a.dateCrise ? fmtDate(a.dateCrise) : '-';
      if(e) criseTxt += ' <span class="tiny" style="color:var(--danger);">('+e.nbDefauts+'↑)</span>';
      return '<tr style="'+(isOpen?'background:var(--accent-bg);':'')+'">'+
        '<td style="font-size:12px; white-space:nowrap;">'+criseTxt+'</td>'+
        '<td>'+esc(val(a.ligne,'-'))+'</td>'+
        '<td style="cursor:pointer;" data-action="toggle-ateq-detail" data-id="'+a.id+'">'+
          '<span style="color:var(--text-faint); margin-right:5px;">'+(isOpen?'▲':'▼')+'</span>'+esc(a.description)+
        '</td>'+
        '<td>'+badge(lvl, statusLabel)+'</td>'+
        '<td class="num">'+(a.echeance?fmtDate(a.echeance):'-')+'</td>'+
        '<td>'+(dl? '<span class="delay-pill delay-'+(dl.d<0?'late':dl.d<=3?'soon':'ok')+'">'+dl.text+'</span>' : '-')+'</td>'+
        '<td>'+esc(val(a.responsable,'-'))+'</td>'+
        '<td><button class="btn small danger-outline" data-action="delete" data-module="actions" data-id="'+a.id+'">Suppr.</button></td></tr>'+
        (isOpen? '<tr><td colspan="7">'+ateqActionDetail(a)+'</td></tr>' : '');
    }).join('');
    html += '</tbody></table></div>';
  }
  html += '</div>';
  return html;
}
function ateqActionDetail(a){
  var e = a.dateCrise && a.ligne ? DATA.ateq.find(function(x){return x.date===a.dateCrise&&x.ligne===a.ligne;}) : null;
  var html = '<div style="padding:10px 14px; border-top:1px solid var(--border); font-size:12.5px;">';
  html += '<div style="display:grid; grid-template-columns:repeat(auto-fill,minmax(150px,1fr)); gap:10px; margin-bottom:8px;">';
  html += '<div><div class="tiny">Date de crise</div><b>'+(a.dateCrise?fmtDate(a.dateCrise):'-')+'</b></div>';
  if(e){
    html += '<div><div class="tiny">Défauts ce jour</div><b style="color:var(--danger);">'+e.nbDefauts+'</b></div>';

  html += '<div><div class="tiny">Responsable</div><b>'+esc(val(a.responsable,'-'))+'</b></div>';

}

async function handleSaveAteqAction(){
  var description = document.getElementById('aa-description').value.trim();
  if(!description){ toast('Merci de décrire l\'action corrective.', 'error'); return; }

    id: uid('act'), origine:'ATEQ', secteur:currentSecteur, description:description,
    ligne: document.getElementById('aa-ligne').value,

var ateqChartOffset = 0; // 0 = J-30→aujourd'hui, -1 = J-60→J-30, etc.
var chartAteqCompare=null, chartAteq2nd=null;

function ateqPeriodDates(){
  var today = new Date(todayStr()+'T00:00:00');
  var endDate = new Date(today);
  endDate.setDate(today.getDate() + ateqChartOffset*30);
  var startDate = new Date(endDate);
  startDate.setDate(endDate.getDate() - 30);
  return {start: fmtISOLocal(startDate), end: fmtISOLocal(endDate), days: 30};
}
function dailySeriesForPeriod(ligne, startISO, days){
  var result = [];
  var d = new Date(startISO+'T00:00:00');
  for(var i=0; i<days; i++){
    var dateStr = fmtISOLocal(d);
    var entry = DATA.ateq.find(function(a){ return a.date===dateStr && a.ligne===ligne; });
    result.push({
      date: dateStr,
      label: fmtDateShort(dateStr),
      total: entry ? (entry.nbDefauts||0) : (entry===undefined ? 0 : 0),
      nb2nd: entry ? (entry.nb2nd||0) : 0,
      taux: entry && entry.nbDefauts>0 ? Math.round((entry.nb2nd||0)/entry.nbDefauts*100) : null,
      hasData: !!entry
    });
    d.setDate(d.getDate()+1);
  }
  return result;
}

function renderAteqCharts(){
  if(typeof Chart==='undefined') return;
  var pd = ateqPeriodDates();
  var periodEl = document.getElementById('ateq-chart-period-label');
  if(periodEl) periodEl.textContent = fmtDate(pd.start)+' → '+fmtDate(pd.end);
  try{
    var s1 = dailySeriesForPeriod('MCU1', pd.start, pd.days);
    var s2 = dailySeriesForPeriod('MCU2', pd.start, pd.days);
    var labels = s1.map(function(s){return s.label;});
    var ateqActions = DATA.actions.filter(function(a){
      return a.origine==='ATEQ' && a.dateCrise && a.dateCrise>=pd.start && a.dateCrise<=pd.end;
    });
    window._ateqDaily = {s1:s1, s2:s2, ateqActions:ateqActions};

    // Dataset triangle : null sauf aux jours de crise → s'aligne parfaitement sur l'axe catégoriel
    function criseDataset(serie, ligne, color){
      return {
        label: 'Crise '+ligne,
        data: serie.map(function(s){
          return ateqActions.some(function(a){ return a.ligne===ligne && a.dateCrise===s.date; })
            ? Math.max(s.total, 1) : null;
        }),
        type: 'line',
        showLine: false,
        spanGaps: false,
        pointStyle: 'triangle',
        pointRadius: 11,
        pointHoverRadius: 13,
        pointBackgroundColor: color,
        pointBorderColor: color,
        pointBorderWidth: 2
      };
    }

    var ctx1 = document.getElementById('chart-ateq-compare');
    if(ctx1){
      if(chartAteqCompare){ chartAteqCompare.destroy(); chartAteqCompare=null; }
      chartAteqCompare = new Chart(ctx1, {
        type:'line',
        data:{labels:labels, datasets:[
          {label:'MCU1', data:s1.map(function(s){return s.total;}),
            borderColor:'#1F5C5C', backgroundColor:'#1F5C5C18', borderWidth:2,
            pointRadius:2, pointHoverRadius:4, fill:true, tension:0.2, order:2},
          {label:'MCU2', data:s2.map(function(s){return s.total;}),
            borderColor:'#B8730A', backgroundColor:'#B8730A18', borderWidth:2,
            pointRadius:2, pointHoverRadius:4, fill:true, tension:0.2, order:2},
          Object.assign(criseDataset(s1,'MCU1','#B23B2E'), {order:1}),
          Object.assign(criseDataset(s2,'MCU2','#E05020'), {order:1})
        ]},
        options:{responsive:true, maintainAspectRatio:false,
          interaction:{mode:'index',intersect:false},
          plugins:{
            legend:{labels:{font:{size:11}, filter:function(item){ return !item.text.startsWith('Crise'); }}},
            tooltip:{callbacks:{
              afterBody:function(items){
                if(!items.length||!window._ateqDaily) return [];
                var idx = items[0].dataIndex;
                var serie = window._ateqDaily.s1;
                if(idx<0||idx>=serie.length) return [];
                var date = serie[idx].date;
                var acts = window._ateqDaily.ateqActions.filter(function(a){ return a.dateCrise===date; });
                if(!acts.length) return [];
                return ['','▼ Action(s) corrective(s) :'].concat(acts.map(function(a){
                  return '  '+a.ligne+' : '+a.description.slice(0,55)+(a.description.length>55?'…':'');
                }));
              }
            }}
          },
          scales:{
            y:{beginAtZero:true, title:{display:true,text:'Défauts'}, grid:{color:'#0001'}},
            x:{grid:{display:false}, ticks:{maxTicksLimit:10, font:{size:10}}}
          },
          onClick:function(evt, elements){
            // Différer le render pour ne pas détruire le canvas pendant le handler Chart.js
            if(!elements.length||!window._ateqDaily) return;
            var datasetIndex = elements[0].datasetIndex;
            var idx = elements[0].index;
            var serie = window._ateqDaily.s1;
            if(idx<0||idx>=serie.length) return;
            var date = serie[idx].date;
            var acts = window._ateqDaily.ateqActions.filter(function(a){ return a.dateCrise===date; });
            if(!acts.length) return;
            var targetId = acts[0].id;
            setTimeout(function(){
              ateqDetailActionId = (ateqDetailActionId===targetId)?null:targetId;
              render();
              setTimeout(function(){
                var el=document.getElementById('ateq-action-plan-section');
                if(el) el.scrollIntoView({behavior:'smooth',block:'start'});
              },100);
            },0);
          }
        }
      });
    }
    var ctx2 = document.getElementById('chart-ateq-2nd');
    if(ctx2){
      if(chartAteq2nd){ chartAteq2nd.destroy(); chartAteq2nd=null; }
      chartAteq2nd = new Chart(ctx2, {
        type:'line',
        data:{labels:labels, datasets:[
          {label:'MCU1 - 2nd %', data:s1.map(function(s){return s.taux;}),
            borderColor:'#1F5C5C', backgroundColor:'#1F5C5C15', borderWidth:2,
            pointRadius:2, spanGaps:true, fill:true, tension:0.25},
          {label:'MCU2 - 2nd %', data:s2.map(function(s){return s.taux;}),
            borderColor:'#B8730A', backgroundColor:'#B8730A15', borderWidth:2,
            pointRadius:2, spanGaps:true, fill:true, tension:0.25},
          {label:'Seuil 20%', data:Array(pd.days).fill(20),
            borderColor:'#B23B2E88', borderWidth:1.5, borderDash:[5,4], pointRadius:0}
        ]},
        options:{responsive:true, maintainAspectRatio:false,
          interaction:{mode:'index',intersect:false},
          plugins:{legend:{labels:{font:{size:10}}}},
          scales:{
            y:{min:0, title:{display:true,text:'% 2nd passage'}, ticks:{callback:function(v){return v+'%';}}},
            x:{grid:{display:false}, ticks:{maxTicksLimit:10, font:{size:10}}}
          }
        }
      });
    }
  }catch(err){ console.error('ateq chart error', err); }
}

function computeAlerts(){
  var alerts = [];
  var n = 0;
  DATA.metro.forEach(function(e){
    var s = metroStatus(e);
    if(s.level==='neutral' || s.level==='ok') return;
    // "urgent" (expire ce mois) = warn dans les alertes, "danger" = danger
    var alertLevel = s.level==='urgent' ? 'warn' : s.level;
    alerts.push({id:'al-'+(n++), level:alertLevel, module:'Métrologie', ligne:e.ligne, echeance:e.echeance,
      title: e.designation || 'Instrument', meta: s.label,
      detail: 'N° du moyen : '+esc(e.numMoyen)+' · Lieu : '+esc(val(e.lieu,'non précisé'))});
  });
  PLAN_TYPES.forEach(function(t){
    if(t[0]==='metro') return; // déjà couvert instrument par instrument ci-dessus
    LINES.forEach(function(l){
      var info = planningCardInfo(t[0], l);
      if(info.level!=='danger' || !info.entry) return;
      var cur = info.entry, s = {level:'danger', label:'En retard'};
      {
        alerts.push({id:'al-'+(n++), level:s.level, module:'Planning', ligne:l, echeance:cur.echeance,
          title: t[1], meta: s.label,
          detail: 'Responsable : '+esc(val(cur.responsable,'non précisé'))+(cur.email? ' ('+esc(cur.email)+')':'')+' · Mois : '+esc(val(cur.mois,''))});
      }
    });
  });
  ['MCU1','MCU2'].forEach(function(l){
    var s = ateqStatusForLine(l);
    if(s.level!=='ok'){
      var last = ateqLastByLine(l);
      alerts.push({id:'al-'+(n++), level:s.level, module:'ATEQ', ligne:l, echeance:null,
        title:'Défauts ATEQ - saisie en attente', meta: s.label,
        detail: last? ('Dernière saisie enregistrée le '+fmtDate(last.date)+' ('+last.nbDefauts+' défauts).') : 'Aucune saisie enregistrée.'});
    }
  });
  DATA.actions.filter(isActionLate).forEach(function(a){
    alerts.push({id:'al-'+(n++), level:'danger', module:'Actions', ligne:a.ligne||'', echeance:a.echeance,
      title: a.description, meta:(a.responsable||'sans responsable'),
      detail: 'Origine : '+esc(val(a.origine,'-'))+' · Créée le '+fmtDate(a.dateCreation)});
  });
  return alerts;
}

var alertHorizon = 14;
function daysLabel(echeance){
  if(!echeance) return null;
  var d = daysBetween(todayStr(), echeance);
  if(d<0) return {d:d, text:'En retard de '+Math.abs(d)+' j'};
  if(d===0) return {d:d, text:"Aujourd'hui"};
  return {d:d, text:'Dans '+d+' j'};
}
var postitModalOpen = false; // false | 'new' | id du post-it en édition
var postitModalPage = 'dashboard'; // page dans laquelle le nouveau post-it doit être créé
function renderPostits(page){
  page = page || 'dashboard';
  if(!currentUser) return ''; // jamais de post-it affiché hors session (corrige le bug écran de connexion)
  var mine = DATA.postits.filter(function(p){ return (p.secteur||'MCU')===currentSecteur && (p.page||'dashboard')===page; });
  var html = '';
  if(mine.length){
    var sorted = mine.slice().sort(function(a,b){ return (a.pinned?1:0)-(b.pinned?1:0); });
    html += '<div id="postit-layer">'+sorted.map(function(p){
      var canEdit = (p.author===currentUser.displayName || currentUser.roleId===ADMIN_ROLE_ID);
      var canToggleDone = canEdit || (p.assignedTo && p.assignedTo===currentUser.displayName);
      var curColor = p.color||POSTIT_COLORS[0];
      var overdue = p.dueDate && p.dueDate<todayStr() && !p.done;
      var extraStyle = (p.pinned? 'z-index:42; box-shadow:3px 6px 16px rgba(0,0,0,0.3);':'')+(overdue? ' outline:2.5px solid var(--danger);':'');
      var pit = '<div class="postit'+(p.done?' postit-done':'')+'" data-id="'+p.id+'" style="left:'+(p.x||20)+'px; top:'+(p.y||20)+'px; background:'+esc(curColor)+'; '+extraStyle+'">';
      if(p.pinned) pit += '<span class="postit-pin-badge" title="Épinglé">📌</span>';
      pit += '<div style="white-space:pre-wrap; word-break:break-word; text-decoration:'+(p.done?'line-through':'none')+'; opacity:'+(p.done?'0.55':'1')+';">'+esc(p.text)+'</div>';
      if(p.assignedTo) pit += '<div class="tiny" style="margin-top:4px; font-weight:700; opacity:0.75;">Pour : '+esc(p.assignedTo)+'</div>';
      if(p.dueDate) pit += '<div class="tiny" style="margin-top:2px; font-weight:'+(overdue?'700':'400')+'; color:'+(overdue?'var(--danger)':'inherit')+'; opacity:'+(overdue?'1':'0.75')+';">'+(overdue?'⚠ Échéance dépassée : ':'Échéance : ')+fmtDate(p.dueDate)+'</div>';
      if(canEdit){
        pit += '<div class="postit-colors">'+
          POSTIT_COLORS.map(function(c){
            return '<button class="postit-color-dot'+(c===curColor?' active':'')+'" data-action="postit-color" data-id="'+p.id+'" data-color="'+c+'" style="background:'+c+';" title="Changer la couleur"></button>';
          }).join('')+
        '</div>';
      }
      pit += '<div class="postit-meta"><span>'+esc(p.author||'?')+'</span>';
      if(canEdit || canToggleDone){
        pit += '<span style="display:flex; gap:2px;">'+
          (canToggleDone? '<button class="postit-del" data-action="toggle-postit-done" data-id="'+p.id+'" title="'+(p.done?'Marquer à faire':'Marquer comme fait')+'">'+(p.done?'↺':'✓')+'</button>' : '')+
          (canEdit? '<button class="postit-del" data-action="toggle-postit-pin" data-id="'+p.id+'" title="'+(p.pinned?'Désépingler':'Épingler')+'">📌</button>' : '')+
          (canEdit? '<button class="postit-del" data-action="edit-postit" data-id="'+p.id+'" title="Modifier">✎</button>' : '')+
          (canEdit? '<button class="postit-del" data-action="delete-postit" data-id="'+p.id+'" title="Supprimer">✕</button>' : '')+
        '</span>';
      }
      pit += '</div></div>';
      return pit;
    }).join('')+'</div>';
  }
  if(postitModalOpen) html += renderPostitModal();
  return html;
}

async function handleSavePostitModal(existingId){
  var textEl = document.getElementById('pm-text');
  var text = textEl.value.trim();
  if(!text){ toast('Le message ne peut pas être vide.', 'error'); return; }
  var assignedTo = document.getElementById('pm-assigned').value.trim();
  var dueDate = document.getElementById('pm-duedate').value;
  var color = document.getElementById('pm-color-row').dataset.selected;

  if(existingId){
    var p = DATA.postits.find(function(x){ return x.id===existingId; });
    if(!p) return;
    p.text = text.slice(0,300);
    p.assignedTo = assignedTo? assignedTo.slice(0,60) : null;
    p.dueDate = dueDate || null;
    p.color = color;
    await save('postits');
    logChange('Tableau de bord', 'Post-it modifié', p.text.slice(0,60));
    toast('Post-it modifié.');
  } else {
    DATA.postits.push({
      id: uid('postit'), text: text.slice(0,300), color: color,
      // Sur CHOKKO, on place le post-it dans la zone libre entre le sélecteur de mois et les cartes de résultat
      x: postitModalPage==='chokko' ? 300+Math.floor(Math.random()*110) : 20+Math.floor(Math.random()*120),
      y: postitModalPage==='chokko' ? 60+Math.floor(Math.random()*10) : 8+Math.floor(Math.random()*40),
      secteur: currentSecteur, author: currentUser.displayName, createdAt: todayStr(),
      assignedTo: assignedTo? assignedTo.slice(0,60) : null,
      dueDate: dueDate || null,
      pinned: false, done: false, page: postitModalPage
    });
    await save('postits');
    toast('Post-it ajouté.');
  }
  postitModalOpen = false;
  render();
}

async function handleTogglePostitDone(id){

function renderAlertsSection(){
  var alerts = computeAlerts();
  var filtered = alerts.filter(function(a){
    return (!alertFilterLigne || a.ligne===alertFilterLigne) && (!alertFilterModule || a.module===alertFilterModule);
  });
  var late = filtered.filter(function(a){ return a.level==='danger'; }).sort(function(a,b){
    return (a.echeance&&b.echeance) ? a.echeance.localeCompare(b.echeance) : 0;
  });
  var upcoming = filtered.filter(function(a){
    if(a.level!=='warn') return false;
    if(!a.echeance) return true;
    var d = daysBetween(todayStr(), a.echeance);
    return d<=alertHorizon;
  }).sort(function(a,b){ return (a.echeance&&b.echeance) ? a.echeance.localeCompare(b.echeance) : 0; });

  var html = '<div class="alert-toolbar">';
  html += '<select id="flt-alert-ligne"><option value="">Toutes les lignes</option>'+secteurLines().map(function(l){return '<option value="'+l+'"'+(l===alertFilterLigne?' selected':'')+'>'+l+'</option>';}).join('')+'</select>';
  html += '<select id="flt-alert-module"><option value="">Tous les modules</option>'+MODULES.map(function(m){return '<option value="'+m+'"'+(m===alertFilterModule?' selected':'')+'>'+m+'</option>';}).join('')+'</select>';
  html += '<label class="tiny" style="display:flex; align-items:center; gap:6px;">Échéances à venir sous J+<input type="number" id="alert-horizon" value="'+alertHorizon+'" min="1" style="width:56px;"></label>';
  html += '</div>';

  if(!alerts.length) return html+emptyState('Aucune alerte. Tout est à jour.');

  html += '<div class="alert-cols">';
  html += alertTable('En retard', late, 'danger');
  html += alertTable('À venir', upcoming, 'warn');
  html += '</div>';
  return html;
}

function alertTable(title, items, level){
  var html = '<div class="alert-group"><div class="alert-group-title alert-group-'+level+'">'+esc(title)+' ('+items.length+')</div>';
  if(!items.length) return html+emptyState('Aucune entrée.')+'</div>';
  html += '<div class="table-wrap"><table class="alert-table alert-table-'+level+'"><thead><tr><th></th><th>Module</th><th>Ligne</th><th>Élément</th><th>Échéance</th><th>Délai</th></tr></thead><tbody>';
  items.forEach(function(a){
    var dl = daysLabel(a.echeance);
    html += '<tr class="alert-row" data-alert-id="'+a.id+'"><td><span class="chev">▸</span></td><td>'+esc(a.module)+'</td><td>'+esc(val(a.ligne,'-'))+'</td><td>'+esc(a.title)+'<div class="tiny">'+esc(a.meta)+'</div></td>'+
      '<td class="num">'+(a.echeance?fmtDate(a.echeance):'-')+'</td>'+
      '<td>'+(dl? '<span class="delay-pill delay-'+(dl.d<0?'late':dl.d<=3?'soon':'ok')+'">'+dl.text+'</span>' : '-')+'</td></tr>';
    html += '<tr class="alert-detail-row" data-alert-detail="'+a.id+'" style="display:none"><td colspan="6">'+a.detail+'</td></tr>';
  });
  html += '</tbody></table></div></div>';
  return html;
}

// ---------- MOTS DE PASSE : hachage à sens unique (jamais stockés en clair) ----------
// SHA-256 en JavaScript pur : résultat identique sur tous les navigateurs et tous les postes.
function sha256Hex(msg){
  function rotr(n,x){ return (x>>>n)|(x<<(32-n)); }
  var K = [0x428a2f98,0x71374491,0xb5c0fbcf,0xe9b5dba5,0x3956c25b,0x59f111f1,0x923f82a4,0xab1c5ed5,0xd807aa98,0x12835b01,0x243185be,0x550c7dc3,0x72be5d74,0x80deb1fe,0x9bdc06a7,0xc19bf174,0xe49b69c1,0xefbe4786,0x0fc19dc6,0x240ca1cc,0x2de92c6f,0x4a7484aa,0x5cb0a9dc,0x76f988da,0x983e5152,0xa831c66d,0xb00327c8,0xbf597fc7,0xc6e00bf3,0xd5a79147,0x06ca6351,0x14292967,0x27b70a85,0x2e1b2138,0x4d2c6dfc,0x53380d13,0x650a7354,0x766a0abb,0x81c2c92e,0x92722c85,0xa2bfe8a1,0xa81a664b,0xc24b8b70,0xc76c51a3,0xd192e819,0xd6990624,0xf40e3585,0x106aa070,0x19a4c116,0x1e376c08,0x2748774c,0x34b0bcb5,0x391c0cb3,0x4ed8aa4a,0x5b9cca4f,0x682e6ff3,0x748f82ee,0x78a5636f,0x84c87814,0x8cc70208,0x90befffa,0xa4506ceb,0xbef9a3f7,0xc67178f2];
  var bytes = unescape(encodeURIComponent(msg)), l = bytes.length, words = [], i;
  for(i=0;i<l;i++) words[i>>2] |= (bytes.charCodeAt(i)&0xff) << (24-(i%4)*8);
  words[l>>2] |= 0x80 << (24-(l%4)*8);
  words[(((l+8)>>6)+1)*16-1] = l*8;
  var H = [0x6a09e667,0xbb67ae85,0x3c6ef372,0xa54ff53a,0x510e527f,0x9b05688c,0x1f83d9ab,0x5be0cd19], W = new Array(64);
  for(var j=0;j<words.length;j+=16){
    var a=H[0],b=H[1],c=H[2],d=H[3],e=H[4],f=H[5],g=H[6],h=H[7];
    for(i=0;i<64;i++){
      if(i<16) W[i] = words[j+i]|0;
      else { var s0=rotr(7,W[i-15])^rotr(18,W[i-15])^(W[i-15]>>>3), s1=rotr(17,W[i-2])^rotr(19,W[i-2])^(W[i-2]>>>10); W[i]=(W[i-16]+s0+W[i-7]+s1)|0; }
      var t1 = (h + (rotr(6,e)^rotr(11,e)^rotr(25,e)) + ((e&f)^(~e&g)) + K[i] + W[i])|0;
      var t2 = ((rotr(2,a)^rotr(13,a)^rotr(22,a)) + ((a&b)^(a&c)^(b&c)))|0;
      h=g; g=f; f=e; e=(d+t1)|0; d=c; c=b; b=a; a=(t1+t2)|0;
    }
    H[0]=(H[0]+a)|0; H[1]=(H[1]+b)|0; H[2]=(H[2]+c)|0; H[3]=(H[3]+d)|0; H[4]=(H[4]+e)|0; H[5]=(H[5]+f)|0; H[6]=(H[6]+g)|0; H[7]=(H[7]+h)|0;
  }
  return H.map(function(x){ return ('00000000'+(x>>>0).toString(16)).slice(-8); }).join('');
}
var PWD_ITER = 5000;
function pwdDerive(pwd, salt, iter){
  var h = sha256Hex(salt+':'+pwd);
  for(var i=1;i<iter;i++) h = sha256Hex(h+salt);
  return h;
}
function makePasswordHash(pwd){
  var arr = new Uint8Array(16);
  (window.crypto||window.msCrypto).getRandomValues(arr);
  var salt = Array.prototype.map.call(arr, function(b){ return ('0'+b.toString(16)).slice(-2); }).join('');
  return 'h1$'+PWD_ITER+'$'+salt+'$'+pwdDerive(pwd, salt, PWD_ITER);
}
function verifyPassword(acc, pwd){
  if(!acc) return false;
  if(acc.passwordHash){
    var p = acc.passwordHash.split('$');
    if(p.length!==4 || p[0]!=='h1') return false;
    return pwdDerive(pwd, p[2], Number(p[1])) === p[3];
  }
  return typeof acc.password==='string' && acc.password===pwd;   // ancien compte non encore converti
}
// Convertit les anciens mots de passe en clair ; renvoie true si au moins un compte a changé
function migrateAccountPasswords(){
  var changed = false;
  DATA.accounts.forEach(function(a){
    if(typeof a.password==='string'){
      if(!a.passwordHash) a.passwordHash = makePasswordHash(a.password);
      delete a.password;
      changed = true;
    }
  });
  return changed;
}

function bootstrapAdmin(){
  var changed = false;
  if(!DATA.roles.length){
    DATA.roles.push({id:ADMIN_ROLE_ID, name:'Administrateur', tabs: ALL_TABS.map(function(t){return t[0];})});
    changed = true;
  }
  if(!DATA.accounts.length){
    DATA.accounts.push({id:uid('acc'), username:'admin', passwordHash:makePasswordHash('admin1234'), displayName:'Administrateur', roleId:ADMIN_ROLE_ID, allSecteurs:true, secteurs:[]});
    changed = true;
  }
  // Sécurité : plus aucun mot de passe en clair dans la base
  if(migrateAccountPasswords()) changed = true;
  // Migration multi-secteurs : comptes existants sans champ secteurs
  DATA.accounts.forEach(function(a){
    if(a.secteurs===undefined){
      if(a.roleId===ADMIN_ROLE_ID){ a.allSecteurs = true; a.secteurs = []; }
      else { a.allSecteurs = false; a.secteurs = ['MCU']; }
      changed = true;
    }
  });
  // Initialiser les secteurs si absents
  if(!DATA.secteurs || !DATA.secteurs.length){
    DATA.secteurs = JSON.parse(JSON.stringify(SECTEURS_DEFAULT));
    changed = true;
  }
  // Migration : ajouter l'onglet CI/CL au secteur MCU s'il n'y est pas déjà
  if(DATA.secteurs){
    var mcuSec = DATA.secteurs.find(function(s){ return s.id==='MCU'; });
    if(mcuSec && mcuSec.tabs.indexOf('cicl')<0){
      mcuSec.tabs.push('cicl');
      changed = true;
    }
    // Prison qualité : auparavant toujours affichée pour MCU ; on coche la case une seule fois pour qu'elle devienne réglable
    if(mcuSec && !mcuSec.prisonTabMigrated){
      if(mcuSec.tabs.indexOf('prison')<0) mcuSec.tabs.push('prison');
      mcuSec.prisonTabMigrated = true;
      changed = true;
    }
  }
  // Fonctionnalité de personnalisation des libellés retirée : purge des éventuels renommages existants
  if(DATA.labelOverrides && Object.keys(DATA.labelOverrides).length){
    DATA.labelOverrides = {};
    changed = true;
  }
  // Fusion des références 143X et 144P en une seule (143X-144P)
  if(DATA.cicl && DATA.cicl.some(function(r){ return r.ref==='143X' || r.ref==='144P'; })){
    DATA.cicl.forEach(function(r){
      if(r.ref==='143X' || r.ref==='144P') r.ref = '143X-144P';
    });
    changed = true;
  }
  return changed;
}

function tintColor(hex, ratio){
  if(!hex || hex.charAt(0)!=='#') return hex;
  var h = hex.slice(1);
  if(h.length===3) h = h.split('').map(function(c){return c+c;}).join('');
  var r = parseInt(h.slice(0,2),16), g = parseInt(h.slice(2,4),16), b = parseInt(h.slice(4,6),16);
  r = Math.round(r + (255-r)*ratio); g = Math.round(g + (255-g)*ratio); b = Math.round(b + (255-b)*ratio);
  return '#'+[r,g,b].map(function(v){return Math.max(0,Math.min(255,v)).toString(16).padStart(2,'0');}).join('');
}

// ---------- SYNCHRONISATION PÉRIODIQUE (Supabase) ----------
var POLL_INTERVAL_MS = 10000;
var pollTimer = null;
function isFieldDirty(el){
  if(el.disabled || el.readOnly) return false;
  if(el.tagName==='SELECT'){
    for(var i=0;i<el.options.length;i++){ if(el.options[i].selected !== el.options[i].defaultSelected) return true; }
    return false;
  }
  if(el.type==='checkbox' || el.type==='radio') return el.checked !== el.defaultChecked;
  if(el.type==='button' || el.type==='submit' || el.type==='file') return false;
  return el.value !== el.defaultValue;
}
function isUserMidEdit(){
  if(document.fullscreenElement) return true;   // présentation plein écran en cours (réunion) : ne pas reconstruire la page
  if(auditWizard || metroEditingId || planningEditingId || contamDirectFormOpen || contamCollecteFormOpen || contamAnalyseEditId || accountFormState || roleFormState || ateqActionFormOpen || particuleCampagneFormOpen || particuleDTEditId || particuleResultatEditId) return true;
  var openForms = document.querySelectorAll('form[id^="form-"]');
  for(var i=0;i<openForms.length;i++){ if(openForms[i].style.display!=='none') return true; }
  // Une fenêtre de saisie est ouverte (gestion des postes, post-it, assistant, récurrence...)
  if(document.querySelector('.modal-overlay')) return true;
  // Le curseur est dans un champ de saisie
  var a = document.activeElement;
  if(a && a!==document.body && (a.isContentEditable || /^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName)) && a.closest('#app, .modal-overlay')) return true;
  // Du texte a été tapé dans un formulaire mais pas encore enregistré
  var fields = document.querySelectorAll('#view input[id], #view textarea[id], #view select[id]');
  for(var j=0;j<fields.length;j++){ if(isFieldDirty(fields[j])) return true; }
  return false;
}
var pendingRemoteRender = false; // des mises à jour distantes attendent la fin de la saisie pour s'afficher
var lastChartRefresh = 0;
var CHART_REFRESH_MS = 60000;
var pollRunning = false;
async function pollForUpdates(){
  if(STORAGE_MODE!=='supabase' || !currentUser || pollRunning) return;
  pollRunning = true;
  try{
    var changed = await pollChangedKeys();
    if(changed) pendingRemoteRender = true;
    // L'écran n'est redessiné qu'une fois la saisie terminée : rien de ce qui est en cours de frappe n'est perdu
    if(pendingRemoteRender && !isUserMidEdit()){
      if(currentTab==='dashboard' && (Date.now()-lastChartRefresh) < CHART_REFRESH_MS) return;
      pendingRemoteRender = false;
      renderNav();
      renderUserbox();
      render();
    }
  }catch(e){ console.error('poll error', e); }
  finally{ pollRunning = false; }
}
var backupTimer = null;
function startAutoBackup(){
  if(backupTimer) clearInterval(backupTimer);
  setTimeout(autoBackupTick, 8000);                       // après le chargement, sans ralentir l'ouverture
  backupTimer = setInterval(autoBackupTick, 3600000);     // vérifie chaque heure (une seule sauvegarde par jour)
}
function startPolling(){
  stopPolling();
  pollTimer = setInterval(pollForUpdates, POLL_INTERVAL_MS);
}
function stopPolling(){
  if(pollTimer){ clearInterval(pollTimer); pollTimer = null; }
}

    }).join('');

    row += '<td>'+(inUse?'':'<button class="btn small danger-outline" data-action="delete-secteur" data-id="'+sec.id+'">Suppr.</button>')+'</td></tr>';

  }).join('');
  html += '</tbody></table></div>';

  html += '<h2 style="font-size:14px; margin:26px 0 10px;">Profils &amp; permissions</h2>';

  html += '<th colspan="'+(PROPRETE_SUBS.length+1)+'" style="text-align:center; border-bottom:2px solid var(--ok);">Propreté</th>';
  html += '<th rowspan="2"></th></tr>';
  html += '<tr><th style="font-size:10px; color:var(--ok); font-weight:700;">Onglet actif</th>'+PROPRETE_SUBS.map(function(s){return '<th style="font-size:10px; color:var(--ok);">'+esc(s[1])+'</th>';}).join('')+'</tr>';
  html += '</thead><tbody>';
  html += DATA.roles.map(function(r){
    if(r.id===ADMIN_ROLE_ID){
      var totalCols = ALL_TABS.filter(function(t){return t[0]!=='proprete';}).length + PROPRETE_SUBS.length + 1;
      return '<tr><td>'+esc(r.name)+' <span class="role-protected">(accès complet)</span></td>'+
        Array(totalCols).fill('<td style="text-align:center;">✓</td>').join('')+'<td></td></tr>';
    }
    var inUse = DATA.accounts.some(function(a){ return a.roleId===r.id; });
    var row = '<tr>';
    // Nom du profil + bouton renommer
    row += '<td style="display:flex; align-items:center; gap:6px;">'+
      (roleRenameId===r.id ?
        '<input type="text" id="rename-role-input" value="'+esc(r.name)+'" style="width:110px; font-size:12px; padding:3px 6px; border:1px solid var(--border-strong); border-radius:var(--radius-sm);">'+
        '<button class="btn small primary" data-action="save-role-rename" data-id="'+r.id+'">OK</button>'+
        '<button class="btn small" data-action="cancel-role-rename">✕</button>' :
        esc(r.name)+
        '<button class="btn small" data-action="rename-role" data-id="'+r.id+'" title="Renommer">✎</button>'
      )+'</td>';
    // Onglets (hors propreté)
    row += ALL_TABS.filter(function(t){return t[0]!=='proprete';}).map(function(t){
      var checked = r.tabs.indexOf(t[0])>=0;
      return '<td style="text-align:center;"><input type="checkbox" data-action="toggle-role-tab" data-role="'+r.id+'" data-tabkey="'+t[0]+'" '+(checked?'checked':'')+'></td>';
    }).join('');
    // Case principale : activer l'onglet Propreté
    var proprActive = r.tabs.indexOf('proprete')>=0;
    row += '<td style="text-align:center; background:var(--ok-bg);"><input type="checkbox" data-action="toggle-role-tab" data-role="'+r.id+'" data-tabkey="proprete" '+(proprActive?'checked':'')+'></td>';
    // Sous-permissions propreté
    row += PROPRETE_SUBS.map(function(s){
      // canViewResultats : true par défaut si non défini
      var def = (s[0]==='canAudit')? false : true;
      var val = (r[s[0]]===undefined)? def : !!r[s[0]];
      return '<td style="text-align:center;"><input type="checkbox" data-action="toggle-role-sub" data-role="'+r.id+'" data-sub="'+s[0]+'" '+(val?'checked':'')+'></td>';
    }).join('');
    row += '<td>'+(inUse? '' : '<button class="btn small danger-outline" data-action="delete-role" data-id="'+r.id+'">Suppr.</button>')+'</td></tr>';
    return row;
  }).join('');
  html += '</tbody></table></div></div>';


  return html;
};

async function handleSaveAccount(){
  var displayName = document.getElementById('af2-displayName').value.trim();
  var username = document.getElementById('af2-username').value.trim();
  var password = document.getElementById('af2-password').value;
  var roleId = document.getElementById('af2-roleId').value;
  if(!displayName || !username){ toast('Nom et identifiant requis.', 'error'); return; }
  var dup = DATA.accounts.find(function(a){ return a.username===username && a.id!==accountFormState.id; });
  if(dup){ toast('Cet identifiant est déjà utilisé.', 'error'); return; }
  var allSecteurs = document.getElementById('af2-allSecteurs').checked;
  var secteurs = allSecteurs ? [] : Array.prototype.map.call(document.querySelectorAll('.af2-secteur-chk:checked'), function(c){return c.value;});
  if(!allSecteurs && !secteurs.length){ toast('Sélectionnez au moins un secteur.', 'error'); return; }
  if(accountFormState.id){
    var a = DATA.accounts.find(function(x){ return x.id===accountFormState.id; });
    a.displayName = displayName; a.username = username; a.roleId = roleId;
    a.allSecteurs = allSecteurs; a.secteurs = secteurs;
    if(password){ a.passwordHash = makePasswordHash(password); delete a.password; }
    if(currentUser && currentUser.id===a.id) currentUser = a;
    await save('accounts');
    logChange('Comptes', 'Modification', displayName+' ('+username+')');
  } else {
    if(!password){ toast('Mot de passe requis.', 'error'); return; }
    DATA.accounts.push({id:uid('acc'), displayName:displayName, username:username, passwordHash:makePasswordHash(password), roleId:roleId, allSecteurs:allSecteurs, secteurs:secteurs});
    await save('accounts');
    logChange('Comptes', 'Création', displayName+' ('+username+')');
  }
  accountFormState = null;
  renderNav(); renderUserbox(); render();
}

function buildMetroExport(){
  var items = DATA.metro.filter(function(e){ return metroStatus(e).level!=='ok'; })
    .sort(function(a,b){ return (a.echeance||'').localeCompare(b.echeance||''); });
  var txt = 'Suivi métrologie - secteur MCU\nPoints à traiter au '+fmtDate(todayStr())+' :\n\n';
  if(!items.length) txt += 'Aucun instrument à signaler pour le moment.\n';
  items.forEach(function(e){
    var s = metroStatus(e);
    txt += '- ['+s.label+'] '+e.ligne+' - '+e.designation+' (n° '+e.numMoyen+', '+esc0(e.lieu)+') - échéance '+fmtDate(e.echeance)+'\n';
  });
  return txt;
}
function buildProprExport(){
  var rows = DATA.resultats.filter(function(r){ return r.resultatPct<90; })
    .sort(function(a,b){ return (b.id||'').localeCompare(a.id||''); });
  var txt = 'Suivi propreté - secteur MCU\nRésultats à surveiller au '+fmtDate(todayStr())+' :\n\n';
  if(!rows.length) txt += 'Aucun résultat sous le seuil de 90% pour le moment.\n';
  rows.forEach(function(r){ txt += '- '+r.ligne+' ('+r.mois+') : '+r.resultatPct+'%\n'; });
  return txt;
}
function esc0(s){ return s? s : 'lieu non précisé'; }

function buildWeeklyDigest(){
  var alerts = computeAlerts();
  var late = alerts.filter(function(a){ return a.level==='danger'; }).sort(function(a,b){ return (a.echeance&&b.echeance)?a.echeance.localeCompare(b.echeance):0; });
  var txt = 'Résumé qualité MCU - semaine du '+fmtDate(todayStr())+'\n\n';
  txt += late.length+' point(s) en retard :\n\n';
  if(!late.length) txt += "Aucun retard à signaler. Tout est à jour.\n";
  late.forEach(function(a){
    var dl = daysLabel(a.echeance);
    txt += '- ['+a.module+'] '+(a.ligne?a.ligne+' - ':'')+a.title+(dl?' ('+dl.text+')':'')+'\n';
  });
  return txt;
}

var chartChokkoTrend=null;
function renderChokkoTrendChart(){
  if(typeof Chart==='undefined') return;
  var ctx = document.getElementById('chart-chokko-trend');
  if(!ctx) return;
  if(chartChokkoTrend){ chartChokkoTrend.destroy(); chartChokkoTrend=null; }
  try{
    var lignes = ['MCU1','MCU2','MCU3'];
    var weeks = []; // {label, avg}
    for(var w=7; w>=0; w--){
      var d = new Date(); d.setDate(d.getDate() - w*7);
      var wk = isoWeekInfo(fmtISOLocal(d));
      var vals = [];
      lignes.forEach(function(l){
        for(var i=0;i<7;i++){
          var dd = new Date(d); dd.setDate(dd.getDate()-dd.getDay()+1+i);
          var dateStr = fmtISOLocal(dd);
          var t = chokkoDayTotals(l, dateStr);
          if(t.pct!==null) vals.push(t.pct);
        }
      });
      weeks.push({label:'S'+wk.week, avg: vals.length? vals.reduce(function(a,b){return a+b;},0)/vals.length : null});
    }
    chartChokkoTrend = new Chart(ctx, {
      type:'line',
      data:{labels:weeks.map(function(w){return w.label;}), datasets:[{label:'% Chokko', data:weeks.map(function(w){return w.avg;}), borderColor:'#1F5C5C', backgroundColor:'#1F5C5C22', fill:true, tension:0.3, spanGaps:true, pointRadius:3}]},
      options:{responsive:true, maintainAspectRatio:false, plugins:{legend:{display:false}}, scales:{y:{min:80, max:100, ticks:{callback:function(v){return v+'%';}}}}}
    });
  }catch(err){ console.error('chokko trend error', err); }
}
var chartCausesBar=null;
function renderCausesBarChart(){

  var ctx = document.getElementById('chart-causes-bar');
  if(!ctx) return;
  if(chartCausesBar){ chartCausesBar.destroy(); chartCausesBar=null; }
  try{
    var today = new Date();
    var y = today.getFullYear(), m = today.getMonth();
    var totals = {}; // posteId -> {count, label}
    ['MCU1','MCU2','MCU3'].forEach(function(l){
      chokkoPostes(l).forEach(function(p){
        var days = chokkoMonthDays(l, y, m);
        var sum = days.reduce(function(s,d){ var e=chokkoEntry(l,d.date); return s+(e?Number(e.defects[p[0]]||0):0); },0);
        if(sum>0){
          var key = l+' '+p[0];
          totals[key] = {count:sum, label:l+' - '+p[0]+' ('+p[1]+')'};
        }
      });
    });
    var sorted = Object.values(totals).sort(function(a,b){return b.count-a.count;}).slice(0,6);
    if(!sorted.length){
      ctx.parentElement.innerHTML = '<div class="empty" style="height:100%; display:flex; align-items:center; justify-content:center;">Aucun défaut ce mois-ci</div>';
      return;
    }
    chartCausesBar = new Chart(ctx, {
      type:'bar',
      data:{labels:sorted.map(function(s){return s.label;}), datasets:[{data:sorted.map(function(s){return s.count;}), backgroundColor:'#B2764A'}]},
      options:{indexAxis:'y', responsive:true, maintainAspectRatio:false, plugins:{legend:{display:false}}, scales:{x:{beginAtZero:true, title:{display:true, text:'Nombre de défauts'}}}}
    });
  }catch(err){ console.error('causes bar error', err); }
}
function renderTrendChart(){
  if(typeof Chart==='undefined') return;
  var ctx = document.getElementById('chart-trend');
  if(!ctx) return;
  if(chartTrend){ chartTrend.destroy(); chartTrend=null; }
  try{
    var months = [];
    var d = new Date();
    for(var i=11;i>=0;i--){
      var dd = new Date(d.getFullYear(), d.getMonth()-i, 1);
      months.push({label: MONTHS_FR[dd.getMonth()].slice(0,3)+' '+String(dd.getFullYear()).slice(2), monthIdx:dd.getMonth(), year:dd.getFullYear(), monthName: MONTHS_FR[dd.getMonth()].charAt(0).toUpperCase()+MONTHS_FR[dd.getMonth()].slice(1)});
    }
    var proprScores = months.map(function(m){
      var rs = DATA.resultats.filter(function(r){ return r.mois===m.monthName && (r.annee===m.year || r.annee===undefined) && r.resultatPct!==null && r.resultatPct!==undefined; });
      if(!rs.length) return null;
      return Math.round(rs.reduce(function(s,r){return s+r.resultatPct;},0)/rs.length);
    });
    var ateqDefauts = months.map(function(m){
      var as = DATA.ateq.filter(function(a){ var dt=new Date(a.date); return dt.getMonth()===m.monthIdx && dt.getFullYear()===m.year; });
      if(!as.length) return null;
      return as.reduce(function(s,a){return s+(a.nbDefauts||0);},0);
    });
    chartTrend = new Chart(ctx, {
      data:{labels:months.map(function(m){return m.label;}),
        datasets:[
          {type:'line', label:'Score propreté moyen (%)', data:proprScores, borderColor:'#1F5C5C', backgroundColor:'#1F5C5C22', borderWidth:2, pointRadius:3, yAxisID:'y', spanGaps:true},
          {type:'bar', label:'Défauts ATEQ (total mensuel)', data:ateqDefauts, backgroundColor:'#B8730A66', borderColor:'#B8730A', borderWidth:1, yAxisID:'y1'}
        ]},
      options:{responsive:true, maintainAspectRatio:false, interaction:{mode:'index',intersect:false},
        scales:{
          y:{type:'linear', position:'left', min:0, max:100, title:{display:true,text:'Score propreté (%)'}},
          y1:{type:'linear', position:'right', beginAtZero:true, grid:{drawOnChartArea:false}, title:{display:true,text:'Défauts ATEQ'}}
        }}
    });
  }catch(err){ console.error('chart error', err); }
}
