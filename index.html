// ---------- CRUD handlers ----------
async function handleDelete(mod, id){
  if(!await uiConfirm('Supprimer cette entrée ?')) return;
  var item = DATA[mod].find(function(x){ return x.id===id; });
  DATA[mod] = DATA[mod].filter(function(x){ return x.id!==id; });
  await save(mod);
  if(item) logChange(MODULE_LABELS[mod]||mod, 'Suppression', describeEntry(mod, item));
  render();
}
async function handleMarkDone(mod, id){
  if(mod==='planning'){
    var item = DATA.planning.find(function(x){ return x.id===id; });
    if(item){ item.realisation = todayStr(); await save('planning'); logChange('Planning', 'Réalisation', describeEntry('planning', item)); render(); }
  }
}
async function handleChangeStatus(id, newVal){
  var item = DATA.actions.find(function(x){ return x.id===id; });
  if(item){
    var before = item.statut;
    item.statut = newVal;
    applyActionStatusTransition(item, before, newVal);
    await save('actions');
    logChange("Plan d'actions", 'Changement de statut', item.description, before+' → '+newVal);
    render();
  }
}
function describeEntry(mod, item){
  if(mod==='metro') return item.designation+' ('+item.numMoyen+')';
  if(mod==='planning') return item.ligne+' - '+item.type;
  if(mod==='ateq') return item.ligne+' - '+fmtDate(item.date);
  if(mod==='actions') return item.description;
  if(mod==='vidange') return item.equipement;
  if(mod==='contamination') return item.ligne+' · '+item.ref;
  if(mod==='particules') return item.ligne+' · '+item.poste+' - '+item.nbParticules+' particules';
  return item.id;
}

async function handleFormSubmit(form){
  var mod = form.id.replace('form-','');
  var fd = new FormData(form);
  var entry = {id: uid(mod)};
  Array.prototype.forEach.call(form.elements, function(el){
    if(el.name && el.type!=='file') entry[el.name] = fd.get(el.name);
  });
  if(['metro','planning','actions'].indexOf(mod)>=0){ entry.secteur = currentSecteur; }
  var fileInput = form.querySelector('input[type=file]');
  if(fileInput && fileInput.files[0]){
    try{
      var isImg = fileInput.files[0].type.indexOf('image')===0;
      entry[fileInput.name] = await fileFromInput(fileInput, isImg);
    }catch(err){ uiAlert(err.message); return; }
  }
  if(mod==='ateq'){ entry.nbDefauts = parseInt(entry.nbDefauts||0,10); entry.nb2nd = parseInt(entry.nb2nd||0,10); }
  if(['actions','planning','metro'].indexOf(mod)>=0 && entry.responsable==='__autre__'){
    entry.responsable = (entry.responsableAutre||'').trim() || 'Non précisé';
  }
  delete entry.responsableAutre;
  if(mod==='resultats'){ entry.resultatPct = parseFloat(entry.resultatPct||0); entry.semaine = entry.semaine? Number(entry.semaine) : null; entry.annee = resultsYear; }
  if(mod==='planning'){ entry.resultatPct = (entry.resultatPct!==undefined && entry.resultatPct!=='') ? parseFloat(entry.resultatPct) : null; }
  // Pour type=labo : lire la ref sélectionnée et forcer la ligne correspondante
  if(mod==='planning' && entry.type==='labo'){
    var refEl = document.getElementById('planning-form-ref');
    if(refEl && refEl.value){
      var parts = refEl.value.split('|');
      entry.ligne = parts[0];
      entry.ref = parts[1];
    }
  }
  if(mod==='releves'){ entry.massePolluante = parseFloat(entry.massePolluante||0); }
  if(mod==='vidange'){ entry.intervalle = parseInt(entry.intervalle||VIDANGE_INTERVALLE,10); }
  if(mod==='actions'){ entry.dateCreation = todayStr(); }
  DATA[mod].push(entry);
  await save(mod);
  logChange(MODULE_LABELS[mod]||mod, 'Création', describeEntry(mod, entry));
  if(mod==='planning' && entry.echeance){
    planningMoisFilter = entry.echeance.slice(0,7);
    toast('Échéance ajoutée : '+entry.ligne+' - '+(PLAN_TYPES.filter(function(t){return t[0]===entry.type;})[0]||['',entry.type])[1]+' le '+fmtDate(entry.echeance)+'.');
  } else {
    toast((MODULE_LABELS[mod]||'Entrée')+' enregistrée.');
  }
  form.reset();
  form.style.display = 'none';
  render();
}

async function handleSaveAteqWeek(){
  var cells = document.querySelectorAll('.ateq-cell');
  var byKey = {};
  Array.prototype.forEach.call(cells, function(inp){
    var key = inp.dataset.date+'|'+inp.dataset.ligne;
    if(!byKey[key]) byKey[key] = {date:inp.dataset.date, ligne:inp.dataset.ligne};
    if(inp.value!=='') byKey[key][inp.dataset.field] = parseInt(inp.value,10);
  });
  Object.keys(byKey).forEach(function(key){
    var v = byKey[key];
    if(v.nbDefauts===undefined && v.nb2nd===undefined) return;
    var existing = DATA.ateq.find(function(a){ return a.date===v.date && a.ligne===v.ligne; });
    if(existing){
      if(v.nbDefauts!==undefined) existing.nbDefauts = v.nbDefauts;
      if(v.nb2nd!==undefined) existing.nb2nd = v.nb2nd;
    } else {
      DATA.ateq.push({id:uid('ateq'), date:v.date, ligne:v.ligne, nbDefauts:v.nbDefauts||0, nb2nd:v.nb2nd||0});
    }
  });
  await save('ateq');
  render();
}

app.addEventListener('change', async function(e){
  if(e.target && /^pareto-(src|ligne|period|month)$/.test(e.target.id)){
    var pk = e.target.id.slice(7);
    if(pk==='month' && !e.target.value) return;
    paretoState[pk] = e.target.value;
    render(); return;
  }
  if(e.target && e.target.id==='pareto-w-src'){ paretoWidgetSrc = e.target.value; render(); return; }
  if(e.target && e.target.id==='ad-sansverif'){
    var on = e.target.checked;
    var f = document.getElementById('ad-verif-fields'), m = document.getElementById('ad-sansverif-motif-wrap');
    if(f) f.style.display = on ? 'none' : '';
    if(m) m.style.display = on ? '' : 'none';
    return;
  }
  if(e.target.classList && e.target.classList.contains('cicl-person-apply-date')){
    ciclApplyDates[e.target.dataset.id] = e.target.value;
    return;
  }
  if(e.target.classList && e.target.classList.contains('responsable-select-autre')){
    var autreWrap = document.getElementById(e.target.dataset.wrap);
    if(autreWrap) autreWrap.style.display = (e.target.value==='__autre__') ? '' : 'none';
    return;
  }
  if(e.target.id==='actions-panel-resp'){ actionsPanelResp = e.target.value; render(); return; }
  if(e.target.id==='perf-progress-mois'){ perfProgressMonth = Number(e.target.value); render(); return; }
  if(e.target.id==='perf-progress-annee'){ perfProgressYear = Number(e.target.value)||perfProgressYear; render(); return; }
  if(e.target.id==='multisecteur-metric-select'){
    if(!DATA.uiSettings) DATA.uiSettings = {sidebarColor:null, iconStyle:'svg'};
    DATA.uiSettings.multiSecteurMetric = e.target.value;
    await save('uiSettings');
    render();
    return;
  }
  if(e.target.id==='pr-type'){
    var refWrap = document.getElementById('pr-ref-wrap');
    if(refWrap) refWrap.style.display = (e.target.value==='labo') ? '' : 'none';
    return;
  }
  if(e.target.id==='pr-freq'){
    var customWrap = document.getElementById('pr-custom-wrap');
    if(customWrap) customWrap.style.display = (e.target.value==='custom') ? '' : 'none';
    return;
  }
  if(e.target.id==='cpf-role'){
    var wrap = document.getElementById('cpf-lignes-wrap');
    if(wrap) wrap.style.display = (e.target.value==='pilote') ? 'none' : '';

function applyPlanningFilter(){
  var t = document.getElementById('flt-planning-type').value;
  var l = document.getElementById('flt-planning-ligne').value;
  var m = document.getElementById('flt-planning-mois').value;
  var today = todayStr();
  var wk = isoWeekInfo(today);
  Array.prototype.forEach.call(document.querySelectorAll('#planning-rows tr[data-row-ligne]'), function(tr){
    var show = (!t || tr.dataset.rowType===t) && (!l || tr.dataset.rowLigne===l);
    if(planningQuickFilter==='late'){
      show = show && tr.dataset.rowDone==='0' && tr.dataset.rowEcheance && tr.dataset.rowEcheance<today;
    } else if(planningQuickFilter==='week'){
      var ech = tr.dataset.rowEcheance;
      show = show && !!ech && isoWeekInfo(ech).week===wk.week && isoWeekInfo(ech).year===wk.year;
    } else {
      show = show && (!m || tr.dataset.rowMois===m);
    }
    tr.style.display = show? '' : 'none';
  });
}
function applyMetroFilter(){
  var l = document.getElementById('flt-metro-ligne').value;
  Array.prototype.forEach.call(document.querySelectorAll('#metro-rows tr[data-row-ligne]'), function(tr){
    tr.style.display = (!l || tr.dataset.rowLigne===l) ? '' : 'none';
  });
}

    e.preventDefault();
    // Entrée enchaîne sur l'autre bain tant qu'il n'est pas saisi pour la même période
    var curB = (document.getElementById('rd-bain')||{}).value, dV = (document.getElementById('rd-date')||{}).value || todayStr();
    var nextB = RELEVES_BAINS.filter(function(b){ return b!==curB && !releveFind(releveDirectFormOpen, b, releveCanonicalDate(releveDirectFormOpen, dV)); })[0] || null;
    handleSaveReleveDirect(releveDirectFormOpen, nextB); return;
  }
  if(e.key==='Escape' && releveDirectFormOpen){ releveDirectFormOpen = false; releveDirectPrefill = null; render(); return; }
  if(e.key==='Enter' && (e.ctrlKey||e.metaKey) && e.target.id==='chokko-note-text'){
    e.preventDefault();
    var saveNoteBtn = document.querySelector('[data-action="chokko-note-save"]');
    if(saveNoteBtn) saveNoteBtn.click();
    return;
  }
  if(e.key==='Enter' && e.target.id==='wiz-step-input'){
    e.preventDefault();
    var nextBtn = document.querySelector('[data-action="chokko-wizard-next"]');
    if(nextBtn) nextBtn.click();
  }
  if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].indexOf(e.key)>=0 && e.target.classList && (e.target.classList.contains('chokko-defect-cell') || e.target.classList.contains('chokko-prodtotal-cell'))){
    e.preventDefault();
    var td = e.target.closest('td');
    var tr = td && td.closest('tr');
    if(!tr) return;
    if(e.key==='ArrowLeft' || e.key==='ArrowRight'){
      var sib = e.key==='ArrowLeft' ? td.previousElementSibling : td.nextElementSibling;
      while(sib){
        var inp = sib.querySelector('input.chokko-defect-cell, input.chokko-prodtotal-cell');
        if(inp){ inp.focus(); inp.select(); return; }
        sib = e.key==='ArrowLeft' ? sib.previousElementSibling : sib.nextElementSibling;
      }
      return;
    }
    // ArrowUp / ArrowDown : meme colonne (cellIndex), ligne de saisie suivante/precedente
    var idx = Array.prototype.indexOf.call(tr.children, td);
    var rowSib = e.key==='ArrowUp' ? tr.previousElementSibling : tr.nextElementSibling;
    while(rowSib){
      var targetTd = rowSib.children[idx];
      if(targetTd){
        var inp2 = targetTd.querySelector('input.chokko-defect-cell, input.chokko-prodtotal-cell');
        if(inp2){ inp2.focus(); inp2.select(); return; }
      }
      rowSib = e.key==='ArrowUp' ? rowSib.previousElementSibling : rowSib.nextElementSibling;
    }
  }
});

// ===== Drag libre des post-its (souris + tactile) =====
(function(){
  var dragging = null, offsetX = 0, offsetY = 0;
  function startDrag(el, clientX, clientY){
    dragging = el;
    var rect = el.getBoundingClientRect();
    var parentRect = el.offsetParent ? el.offsetParent.getBoundingClientRect() : {left:0, top:0};
    offsetX = clientX - rect.left;
    offsetY = clientY - rect.top;
    el.classList.add('dragging');
  }
  function moveDrag(clientX, clientY){
    if(!dragging) return;
    var parent = dragging.offsetParent;
    var parentRect = parent ? parent.getBoundingClientRect() : {left:0, top:0};
    var x = clientX - parentRect.left - offsetX;
    var y = clientY - parentRect.top - offsetY;
    dragging.style.left = Math.max(0,x)+'px';
    dragging.style.top = Math.max(0,y)+'px';
  }
  async function endDrag(){
    if(!dragging) return;
    dragging.classList.remove('dragging');
    var id = dragging.dataset.id;
    var x = parseInt(dragging.style.left,10)||0;
    var y = parseInt(dragging.style.top,10)||0;
    var el = dragging;
    dragging = null;
    await handleMovePostit(id, x, y);
  }
  app.addEventListener('mousedown', function(e){
    if(e.target.closest('.postit-del') || e.target.closest('.postit-color-dot')) return;
    var el = e.target.closest('.postit');
    if(!el) return;
    startDrag(el, e.clientX, e.clientY);
  });
  document.addEventListener('mousemove', function(e){ if(dragging) moveDrag(e.clientX, e.clientY); });
  document.addEventListener('mouseup', function(){ if(dragging) endDrag(); });
  app.addEventListener('touchstart', function(e){
    if(e.target.closest('.postit-del') || e.target.closest('.postit-color-dot')) return;
    var el = e.target.closest('.postit');
    if(!el) return;
    var touch = e.touches[0];
    startDrag(el, touch.clientX, touch.clientY);
  }, {passive:true});
  document.addEventListener('touchmove', function(e){ if(dragging){ var touch=e.touches[0]; moveDrag(touch.clientX, touch.clientY); } }, {passive:true});
  document.addEventListener('touchend', function(){ if(dragging) endDrag(); });
})();

// ---------- Info-bulle personnalisée (remplace l'info-bulle native, non stylable) ----------
var uiTip = null, uiTipTarget = null, uiTipTimer = null;
function uiTipEl(){
  if(!uiTip){ uiTip = document.createElement('div'); uiTip.id = 'ui-tooltip'; uiTip.className = 'ui-tooltip'; document.body.appendChild(uiTip); }
  return uiTip;
}
function uiTipShow(target){
  var tip = uiTipEl();
  var title = target.getAttribute('data-tip-title') || '';
  var body = target.getAttribute('data-tip') || '';
  var hint = target.getAttribute('data-tip-hint') || '';
  tip.innerHTML = '';
  if(title){ var t = document.createElement('div'); t.className = 'ui-tooltip-title'; t.textContent = title; tip.appendChild(t); }
  if(body){ var b = document.createElement('div'); b.className = 'ui-tooltip-body'; b.textContent = body; tip.appendChild(b); }
  if(hint){ var h = document.createElement('div'); h.className = 'ui-tooltip-hint'+(body?'':' ui-tooltip-hint-only'); h.textContent = hint; tip.appendChild(h); }
  tip.classList.toggle('ui-tooltip-compact', !body);
  tip.style.left = '0px'; tip.style.top = '0px';
  tip.classList.add('visible');
  // Placement : à gauche de la case si elle est près du bord droit, sinon à droite ; jamais hors de l'écran
  var r = target.getBoundingClientRect(), tw = tip.offsetWidth, th = tip.offsetHeight, m = 10;
  var vw = document.documentElement.clientWidth, vh = document.documentElement.clientHeight;
  var left = (r.right + m + tw <= vw) ? r.right + m : r.left - m - tw;
  if(left < m) left = Math.max(m, Math.min(vw - tw - m, r.left + r.width/2 - tw/2));
  var top = r.top + r.height/2 - th/2;
  top = Math.max(m, Math.min(vh - th - m, top));
  tip.style.left = Math.round(left + window.scrollX) + 'px';
  tip.style.top = Math.round(top + window.scrollY) + 'px';
}
function uiTipHide(){ clearTimeout(uiTipTimer); uiTipTarget = null; if(uiTip) uiTip.classList.remove('visible'); }
document.addEventListener('mouseover', function(e){
  var t = e.target.closest ? e.target.closest('[data-tip], [data-tip-hint]') : null;
  if(t === uiTipTarget) return;
  uiTipHide();
  if(!t || chokkoPaintMode) return;
  uiTipTarget = t;
  uiTipTimer = setTimeout(function(){ if(uiTipTarget===t && document.body.contains(t)) uiTipShow(t); }, 220);
});
document.addEventListener('mousedown', uiTipHide, true);
window.addEventListener('scroll', function(){ if(uiTip && uiTip.classList.contains('visible')) uiTipHide(); }, true);
window.addEventListener('blur', uiTipHide);

init();

})();
