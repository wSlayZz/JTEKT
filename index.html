<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Suivi qualité - Acurion</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.0/chart.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/exceljs/4.4.0/exceljs.min.js"></script>
<style>
:root{
  --bg:#F5F4F0; --surface:#FFFFFF; --border:#E2DFD5; --border-strong:#C9C4B5;
  --text:#1C1B18; --text-muted:#6E6A60; --text-faint:#9C978A;
  --accent:#1F5C5C; --accent-dark:#143E3E; --accent-bg:#E6EFEE;
  --ok:#2E7D4F; --ok-bg:#E5F3E9; --ok-border:#BFE0CB;
  --warn:#B8730A; --warn-bg:#FBEEDC; --warn-border:#F0D6A6;
  --danger:#B23B2E; --danger-bg:#FBE7E3; --danger-border:#EFC2B8;
  --urgent:#C25A00; --urgent-bg:#FDECD6; --urgent-border:#F0C79A;
  --neutral:#6E6A60; --neutral-bg:#EFEDE7;
  --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
  --radius:10px; --radius-sm:6px;
}
*{box-sizing:border-box; margin:0; padding:0;}
body{font-family:var(--sans); background:var(--bg); color:var(--text); line-height:1.5; font-size:14px;}

/* ===== Layout sidebar ===== */
.app-shell{display:flex; min-height:100vh; align-items:stretch;}
.sidebar{width:230px; flex-shrink:0; background:var(--sb-bg, var(--accent-dark)); border-right:1px solid var(--sb-bg, var(--accent-dark)); padding:16px 10px; display:flex; flex-direction:column; gap:2px; transition:width 0.15s ease;}
.sidebar.collapsed{width:58px;}
.sidebar.collapsed .sidebar-label-text, .sidebar.collapsed .sidebar-group-title-text, .sidebar.collapsed .sidebar-group-chevron{display:none;}
.sidebar.collapsed .sidebar-group-header{justify-content:center;}
.sidebar.collapsed .sidebar-item, .sidebar.collapsed .sidebar-standalone{justify-content:center;}
.sidebar-top{display:flex; align-items:center; justify-content:space-between; margin:0 0 16px; padding:2px 4px 14px; gap:8px; border-bottom:1px solid var(--sb-border, rgba(255,255,255,0.14));}
.sidebar.collapsed .sidebar-top{flex-direction:column; gap:10px; padding:2px 0 14px;}
.sidebar-logo-full{display:block; max-height:22px; width:auto;}
.sidebar-logo-mono{display:none; height:24px; width:auto; flex-shrink:0;}
.sidebar.collapsed .sidebar-logo-full{display:none;}
.sidebar.collapsed .sidebar-logo-mono{display:block;}
#sidebar-toggle{background:var(--sb-toggle-bg, rgba(255,255,255,0.12)); border:1px solid var(--sb-toggle-border, rgba(255,255,255,0.3)); border-radius:5px; cursor:pointer; font-size:11px; color:var(--sb-fg, #fff); padding:4px 6px; flex-shrink:0;}
#sidebar-toggle:hover{background:var(--sb-hover, rgba(255,255,255,0.22));}
.sidebar.collapsed #sidebar-toggle{transform:rotate(180deg);}
#sidebar-settings-btn{background:var(--sb-toggle-bg, rgba(255,255,255,0.12)); border:1px solid var(--sb-toggle-border, rgba(255,255,255,0.3)); border-radius:5px; cursor:pointer; font-size:11px; color:var(--sb-fg, #fff); padding:4px 6px; flex-shrink:0;}
#sidebar-settings-btn:hover{background:var(--sb-hover, rgba(255,255,255,0.22));}
#sidebar-secteur select{width:100%; margin-bottom:10px; font-size:12.5px; padding:6px 8px; background:var(--sb-toggle-bg, rgba(255,255,255,0.1)); color:var(--sb-fg, #fff); border:1px solid var(--sb-toggle-border, rgba(255,255,255,0.3));}
#sidebar-secteur select option{color:var(--text);}
.sidebar.collapsed #sidebar-secteur{display:none;}
.sidebar-nav{display:flex; flex-direction:column; gap:2px; overflow-y:auto;}
.sidebar-standalone{display:flex; align-items:center; gap:9px; padding:9px 10px; border-radius:7px; font-size:13.5px; font-weight:500; color:var(--sb-fg-soft, rgba(255,255,255,0.82)); cursor:pointer; border:none; background:none; width:100%; text-align:left; font-family:var(--sans); margin-bottom:6px;}
.sidebar-standalone:hover{background:var(--sb-hover, rgba(255,255,255,0.1)); color:var(--sb-fg, #fff);}
.sidebar-standalone.active{background:var(--sb-active-bg, rgba(255,255,255,0.16)); color:var(--sb-active-fg, #fff); font-weight:700;}
.sidebar-group{margin-bottom:2px;}
.sidebar-group-header{display:flex; align-items:center; justify-content:space-between; gap:6px; padding:8px 10px; cursor:pointer; border-radius:7px; font-size:11.5px; font-weight:700; color:var(--sb-fg-faint, rgba(255,255,255,0.55)); text-transform:uppercase; letter-spacing:0.03em;}
.sidebar-group-header:hover{background:var(--sb-hover, rgba(255,255,255,0.08)); color:var(--sb-fg-soft, rgba(255,255,255,0.85));}
.sidebar-group-chevron{font-size:9px; transition:transform 0.12s;}
.sidebar-group.closed .sidebar-group-chevron{transform:rotate(-90deg);}
.sidebar-group-items{display:flex; flex-direction:column; gap:1px; overflow:hidden;}
.sidebar-group.closed .sidebar-group-items{display:none;}
.sidebar-item{display:flex; align-items:center; gap:9px; padding:8px 10px 8px 18px; border-radius:7px; font-size:13px; color:var(--sb-fg-soft2, rgba(255,255,255,0.75)); cursor:pointer; border:none; background:none; width:100%; text-align:left; font-family:var(--sans);}
.sidebar-item:hover{background:var(--sb-hover, rgba(255,255,255,0.1)); color:var(--sb-fg, #fff);}
.sidebar-item.active{background:var(--sb-active-bg, #fff); color:var(--sb-active-fg, var(--accent-dark)); font-weight:700;}
.sidebar-icon{width:16px; text-align:center; flex-shrink:0; font-size:13px;}
.app-content{flex:1; min-width:0; max-width:1600px; padding:20px 28px 60px;}
@media (max-width:820px){
  .sidebar{position:fixed; z-index:70; top:0; left:0; height:100vh; transform:translateX(-100%); transition:transform 0.2s ease; box-shadow:4px 0 16px rgba(0,0,0,0.15);}
  .sidebar.mobile-open{transform:translateX(0);}
  .sidebar.collapsed{width:230px;}
  .sidebar.collapsed .sidebar-label-text, .sidebar.collapsed .sidebar-group-title-text, .sidebar.collapsed .sidebar-group-chevron{display:inline;}
  .sidebar.collapsed .sidebar-logo-full{display:block;}
  .sidebar.collapsed .sidebar-logo-mono{display:none;}
  .sidebar.collapsed .sidebar-top{flex-direction:row;}
  #sidebar-toggle{display:none;}
  .app-content{padding:16px;}
  #mobile-menu-btn{display:inline-flex !important;}
}
#mobile-menu-btn{display:none; align-items:center; justify-content:center; background:var(--surface); border:1px solid var(--border-strong); border-radius:7px; padding:7px 10px; cursor:pointer; font-size:15px; margin-right:8px;}
#sidebar-backdrop{display:none; position:fixed; inset:0; background:rgba(0,0,0,0.3); z-index:65;}
#sidebar-backdrop.show{display:block;}

header.top{display:flex; align-items:baseline; justify-content:space-between; margin-bottom:18px; flex-wrap:wrap; gap:8px;}
header.top h1{font-size:20px; font-weight:600; letter-spacing:-0.01em;}
header.top .sub{color:var(--text-muted); font-size:13px;}
.eyebrow{font-size:11.5px; font-weight:700; letter-spacing:0.04em; text-transform:uppercase; color:var(--text);}
.card{background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); padding:16px;}
.grid{display:grid; gap:14px;}
.grid-4{grid-template-columns:repeat(4,1fr);}
.grid-3{grid-template-columns:repeat(3,1fr);}
.grid-2{grid-template-columns:repeat(2,1fr);}
.grid-1{grid-template-columns:1fr;}
.alert-cols{display:grid; grid-template-columns:1fr 1fr; gap:20px; align-items:start;}
@media (max-width:900px){.grid-4{grid-template-columns:repeat(2,1fr);} .grid-3{grid-template-columns:1fr;} .grid-2{grid-template-columns:1fr;} .alert-cols{grid-template-columns:1fr;}}
@media (max-width:560px){.grid-4{grid-template-columns:1fr;}}
.statcard{border-left:3px solid var(--border-strong); padding:12px 14px; background:var(--surface); border:1px solid var(--border); border-radius:var(--radius);}
.statcard.s-ok{border-left-color:var(--ok);}
.statcard.s-warn{border-left-color:var(--warn);}
.statcard.s-danger{border-left-color:var(--danger);}
.statcard .val{font-family:var(--mono); font-size:22px; font-weight:600; margin:4px 0 2px;}
.statcard .lbl{font-size:12.5px; color:var(--text-muted);}
.badge{display:inline-flex; align-items:center; gap:5px; font-size:11.5px; font-weight:600; padding:3px 8px; border-radius:5px; white-space:nowrap;}
.badge .dot{width:6px; height:6px; border-radius:50%; display:inline-block;}
.badge.b-ok{background:var(--ok-bg); color:var(--ok);} .badge.b-ok .dot{background:var(--ok);}
.badge.b-warn{background:var(--warn-bg); color:var(--warn);} .badge.b-warn .dot{background:var(--warn);}
.badge.b-danger{background:var(--danger-bg); color:var(--danger);} .badge.b-danger .dot{background:var(--danger);}
.badge.b-neutral{background:var(--neutral-bg); color:var(--neutral);} .badge.b-neutral .dot{background:var(--neutral);}
.badge.b-urgent{background:var(--urgent-bg); color:var(--urgent); font-weight:700;} .badge.b-urgent .dot{background:var(--urgent);}
.statcard.s-urgent{border-left-color:var(--urgent);}
table{width:100%; border-collapse:collapse; font-size:13px;}
th{text-align:left; font-size:11px; text-transform:uppercase; letter-spacing:0.03em; color:var(--text-faint); font-weight:600; padding:7px 10px; border-bottom:1px solid var(--border);}
td{padding:7px 10px; border-bottom:1px solid var(--border); vertical-align:middle; line-height:1.35;}
td.num{font-family:var(--mono);}
tr:hover td{background:#FBFAF8;}
.table-wrap{overflow-x:auto; border:1px solid var(--border); border-radius:var(--radius); background:var(--surface);}
.section{margin-bottom:28px;}
.section h2{font-size:16px; font-weight:600; margin-bottom:12px;}
.toolbar{display:flex; justify-content:space-between; align-items:center; margin-bottom:12px; gap:10px; flex-wrap:wrap;}
.toolbar .left{display:flex; gap:8px; align-items:center; flex-wrap:wrap;}
button.btn{font-family:var(--sans); cursor:pointer; border-radius:var(--radius-sm); font-size:13px; font-weight:500; padding:7px 13px; border:1px solid var(--border-strong); background:var(--surface); color:var(--text);}
button.btn:hover{background:#F2F0EA;}
button.btn.primary{background:var(--accent); border-color:var(--accent); color:#fff;}
button.btn.primary:hover{background:var(--accent-dark);}
button.btn.danger-outline{color:var(--danger); border-color:var(--danger-border);}
button.btn.small{padding:4px 9px; font-size:12px;}
select, input, textarea{font-family:var(--sans); font-size:13px; padding:7px 9px; border:1px solid var(--border-strong); border-radius:var(--radius-sm); background:#fff; color:var(--text);}
input[type=file]{padding:4px;}
label.field{display:flex; flex-direction:column; gap:4px; font-size:12.5px; color:var(--text-muted); font-weight:500;}
form.entryform{display:grid; grid-template-columns:repeat(3,1fr); gap:12px; background:#FBFAF7; border:1px solid var(--border); border-radius:var(--radius); padding:16px; margin-bottom:16px;}
form.entryform.cols2{grid-template-columns:repeat(2,1fr);}
@media (max-width:760px){form.entryform{grid-template-columns:1fr;}}
form.entryform .full{grid-column:1/-1;}
form.entryform .actions-row{grid-column:1/-1; display:flex; gap:8px; justify-content:flex-end;}
.alertlist{display:flex; flex-direction:column; gap:8px;}
.alertitem{display:flex; align-items:flex-start; gap:10px; padding:10px 12px; border-radius:var(--radius-sm); border:1px solid var(--border);}
.alertitem .txt{font-size:13px;}
.alertitem .meta{font-size:11.5px; color:var(--text-faint); margin-top:2px;}
.empty{color:var(--text-faint); font-size:13px; padding:28px 18px; text-align:center; display:flex; flex-direction:column; align-items:center; gap:10px;}
.empty-icon{width:34px; height:34px; color:var(--border-strong); flex-shrink:0;}
button.btn.btn-loading{position:relative; color:transparent !important; pointer-events:none;}
button.btn.btn-loading::after{content:''; position:absolute; width:14px; height:14px; top:50%; left:50%; margin:-7px 0 0 -7px; border:2px solid rgba(0,0,0,0.15); border-top-color:var(--accent); border-radius:50%; animation:btn-spin 0.6s linear infinite;}
button.btn.primary.btn-loading::after{border-color:rgba(255,255,255,0.35); border-top-color:#fff;}
@keyframes btn-spin{to{transform:rotate(360deg);}}
.subtabs{display:flex; gap:6px; margin-bottom:14px;}
/* Téléphone / tablette : rien ne doit dépasser de l'écran ; les tableaux larges défilent dans leur cadre */
@media (max-width:820px){
  .subtabs{flex-wrap:wrap;}
  .alert-group{overflow-x:auto; max-width:100%;}
  #view .card{max-width:100%;}
  #view .card > table, #view .section > table, #view .card > div > table{display:block; overflow-x:auto; max-width:100%;}
  #view .toolbar{flex-wrap:wrap; gap:8px;}
  #view .toolbar .left{flex-wrap:wrap;}
  .modal-box{max-width:calc(100vw - 24px) !important;}
}
.subtabs button{font-family:var(--sans); border:1px solid var(--border-strong); background:var(--surface); padding:6px 12px; border-radius:999px; font-size:12.5px; font-weight:500; cursor:pointer; color:var(--text-muted);}
.subtabs button.active{background:var(--accent); border-color:var(--accent); color:#fff;}
.thumb{width:34px; height:34px; border-radius:5px; object-fit:cover; border:1px solid var(--border); cursor:pointer;}
.exportbox{background:#FBFAF7; border:1px solid var(--border); border-radius:var(--radius); padding:14px; margin-top:12px;}
.exportbox textarea{width:100%; min-height:160px; font-family:var(--mono); font-size:12px; resize:vertical;}
.checklist-item{display:grid; grid-template-columns:1fr 90px 1fr 1fr 90px; gap:8px; padding:9px 0; border-bottom:1px solid var(--border); align-items:start; font-size:12.5px;}
.checklist-item .ci-label b{display:block; font-size:12.5px;} .checklist-item .ci-label span{color:var(--text-faint); font-size:11px;}
@media (max-width:900px){.checklist-item{grid-template-columns:1fr; gap:4px;}}
.muted{color:var(--text-muted);}
.tiny{font-size:11.5px; color:var(--text-faint);}
.linebadges{display:flex; flex-direction:column; gap:7px; margin-top:8px;}
.linebadge{display:flex; align-items:center; justify-content:space-between; gap:8px; font-size:12.5px; font-weight:600;}
.alert-toolbar{display:flex; gap:8px; margin-bottom:12px; flex-wrap:wrap; align-items:center;}
.alert-toolbar select{font-size:12.5px;}
.alert-group-title{font-size:13px; font-weight:700; text-transform:uppercase; letter-spacing:0.03em; margin:18px 0 8px; padding:4px 0; border-bottom:2px solid var(--border-strong);}
.alert-group-title:first-child{margin-top:0;}
.alert-group-danger{color:var(--danger); border-bottom-color:var(--danger);}
.alert-group-warn{color:var(--warn); border-bottom-color:var(--warn);}
.alert-table-danger{border-left:3px solid var(--danger);}
.alert-table-warn{border-left:3px solid var(--warn);}
.delay-pill{display:inline-block; padding:2px 8px; border-radius:10px; font-size:11.5px; font-weight:700; font-family:var(--mono);}
.delay-pill.delay-late{background:#D6483A; color:#fff;}
.delay-pill.delay-soon{background:#E0922A; color:#fff;}
.delay-pill.delay-ok{background:var(--neutral-bg); color:var(--text-muted);}
tr.alert-row{cursor:pointer;}
tr.alert-row td{font-size:13px;}
tr.alert-detail-row td{background:#FBFAF7; font-size:12.5px; color:var(--text-muted); padding:10px 14px;}
.chev{display:inline-block; transition:transform 0.15s; color:var(--text-faint); font-size:11px;}
tr.alert-row.expanded .chev{transform:rotate(90deg);}
.wizard-dots{display:flex; align-items:center; gap:6px; margin-bottom:18px;}
.wizard-dot{width:26px; height:26px; border-radius:50%; background:var(--neutral-bg); color:var(--text-faint); display:flex; align-items:center; justify-content:center; font-size:12px; font-weight:600; border:1px solid var(--border-strong); flex-shrink:0;}
.wizard-dot.active{background:var(--accent); color:#fff; border-color:var(--accent);}
.wizard-dot.done{background:var(--ok); color:#fff; border-color:var(--ok);}
.wizard-line{flex:1; height:1px; background:var(--border-strong); max-width:50px;}
.score-big{font-family:var(--mono); font-size:48px; font-weight:700; text-align:center;}
.annual-table td.score-cell{text-align:center; font-family:var(--mono); font-weight:600; cursor:pointer;}
.annual-table td.score-cell:hover{outline:2px solid var(--accent); outline-offset:-2px;}
.annual-table td.c-empty{text-align:center; color:var(--text-faint);}
.annual-table th:not(:first-child){text-align:center;}
.sc-ok{background:#2E9E5B; color:#fff;}
.sc-warn{background:#E0922A; color:#fff;}
.sc-danger{background:#D6483A; color:#fff;}
.sc-nc-med{background:#EC8A3C; color:#fff;}
.sc-nc-low{background:#F3D27A; color:#5A4300;}
.sc-pending{background:#ECE8E1; color:#6B655C;}
.nc-cause{font-size:9.5px; font-weight:600; line-height:1.1; opacity:.95; font-family:var(--sans, inherit);}
.nc-legend{display:flex; flex-wrap:wrap; gap:6px 16px; margin:8px 2px 0;}
.nc-legend span{display:inline-flex; align-items:center; gap:5px;}
.nc-legend i{display:inline-block; width:12px; height:12px; border-radius:3px;}
.nc-grav-note{margin:0 0 12px; padding:8px 10px; border-radius:8px; font-size:12.5px; background:var(--danger-bg); color:var(--danger);}
.nc-grav-note.nc-grav-low{background:#FBF1D3; color:#6E5300;}
.nc-grav-note.nc-grav-med{background:var(--urgent-bg); color:var(--urgent);}
.grav-pill{display:inline-block; margin-left:4px; padding:0 6px; border-radius:9px; font-size:10px; font-weight:600; vertical-align:1px;}
.grav-pill.grav-high{background:var(--danger-bg); color:var(--danger);}
.grav-pill.grav-medium{background:var(--urgent-bg); color:var(--urgent);}
.grav-pill.grav-low{background:#FBF1D3; color:#6E5300;}
.chart-box{position:relative; height:260px;}
.modal-overlay{position:fixed; inset:0; background:rgba(28,27,24,0.5); display:flex; align-items:center; justify-content:center; z-index:1000; padding:20px;}
.modal-box{background:#fff; border-radius:var(--radius); padding:22px; max-width:560px; width:100%; max-height:80vh; overflow-y:auto;}
.modal-box h3{margin-bottom:14px; font-size:16px;}
.userbox{display:flex; align-items:center; gap:10px;}
.userbox .uname{font-size:13px; font-weight:600;}
.userbox .urole{font-size:11.5px; color:var(--text-muted);}
#login-overlay{position:fixed; inset:0; z-index:100; display:flex; align-items:center; justify-content:center; background:var(--bg); padding:20px;}
#login-overlay.hidden{display:none;}
.login-card{width:100%; max-width:400px; background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); overflow:hidden; box-shadow:0 4px 24px rgba(0,0,0,0.08);}
.login-banner{background:var(--sb-login-bg, var(--accent-dark)); color:var(--sb-login-fg, #fff); display:flex; align-items:center; gap:14px; padding:26px 32px;}
.login-banner img{height:30px; width:auto; flex-shrink:0;}
.login-banner .login-banner-text{display:flex; flex-direction:column; gap:2px;}
.login-banner h2{font-size:16px; font-weight:700; line-height:1.2;}
.login-banner p{font-size:12px; opacity:0.82; line-height:1.35;}
.login-box{padding:32px;}
.login-box h1{font-size:19px; margin-bottom:4px;}
.login-box .sub{color:var(--text-muted); font-size:13px; margin-bottom:22px;}
.login-box label.field{display:flex; flex-direction:column; gap:5px; font-size:12.5px; font-weight:600; color:var(--text-muted); margin-bottom:14px;}
.login-box input, .login-box select{font-family:var(--sans); padding:9px 10px; border:1px solid var(--border-strong); border-radius:var(--radius-sm); font-size:14px;}
.login-pwd-wrap{position:relative;}
.login-pwd-wrap input{width:100%; padding-right:38px;}
.login-pwd-toggle{position:absolute; right:6px; top:50%; transform:translateY(-50%); background:none; border:none; cursor:pointer; padding:4px 6px; color:var(--text-faint); font-size:13px;}
.login-error{color:var(--danger); font-size:12.5px; margin-bottom:10px; min-height:1em;}
@media (max-width:480px){ .login-banner{padding:20px 22px;} .login-box{padding:24px;} }
.perm-table th, .perm-table td{text-align:center;}
.perm-table td:first-child, .perm-table th:first-child{text-align:left;}
.perm-table input[type=checkbox]{width:16px; height:16px; cursor:pointer;}
.role-protected{color:var(--text-faint); font-style:italic;}

@media print{
  @page{ size: A4 landscape; margin: 10mm; }
  .sidebar, #mobile-menu-btn, #sidebar-backdrop, .userbox, .dash-actions-noprint, #digest-box, header.top .sub:last-child, #sync-indicator, #toast-layer, .row-actions-noprint, .screen-only{display:none !important;}
  .print-only{display:block !important;}
  .print-page-break{page-break-before:always;}
  .app-content{max-width:none !important; padding:0 !important;}
  body{background:#fff; font-size:10.5px;}
  .card, .statcard{break-inside:avoid;}
  .chart-box{height:150px !important; overflow:hidden; margin-bottom:10px;}
  .grid-4{grid-template-columns:repeat(4,1fr) !important;}
  .alert-table thead{display:table-header-group;}
  .alert-table tr{break-inside:avoid;}

/* ===== Toasts (remplacent les alert() bloquants pour les confirmations) ===== */

/* ===== Indicateur de synchronisation ===== */

.ui-dialog-head{display:flex; align-items:center; gap:10px; margin-bottom:8px;}
.ui-dialog-icon{width:26px; height:26px; border-radius:50%; display:inline-flex; align-items:center; justify-content:center; font-size:14px; font-weight:700; background:var(--neutral-bg, #eee); color:var(--text);}
.ui-dialog-danger .ui-dialog-icon{background:var(--danger-bg); color:var(--danger);} .ui-dialog-warn .ui-dialog-icon{background:var(--urgent-bg); color:var(--urgent);} .ui-dialog-info .ui-dialog-icon{background:#E3EDF8; color:#2F6FB0;}
.ui-dialog-title{font-weight:700; font-size:15px;}
.ui-dialog-body{font-size:13.5px; line-height:1.5; white-space:pre-line; color:var(--text); max-height:55vh; overflow:auto;}
.ui-dialog-actions{display:flex; justify-content:flex-end; gap:8px; margin-top:16px;}
.ui-dialog .btn.primary.ui-dialog-ok-danger{background:var(--danger) !important; border-color:var(--danger) !important; color:#fff !important;}
.backup-mod-list{display:grid; grid-template-columns:1fr 1fr; gap:6px; max-height:46vh; overflow:auto;}
@media (max-width:640px){ .backup-mod-list{grid-template-columns:1fr;} }
.backup-mod{display:flex; gap:8px; align-items:flex-start; padding:6px 8px; border:1px solid var(--border); border-radius:8px; cursor:pointer; font-size:13px;}
.backup-mod.same{opacity:.6;}
.backup-mod input{margin-top:3px;}
.pq{display:inline-flex; align-items:center; gap:2px;}
.prison-detail table th, .prison-detail table td{padding-left:3px; padding-right:3px;}
.pq input{width:44px; text-align:center; padding-left:2px; padding-right:2px; -moz-appearance:textfield;}
.pq input::-webkit-outer-spin-button, .pq input::-webkit-inner-spin-button{-webkit-appearance:none; margin:0;}
.pq-btn{width:22px; height:28px; border-radius:6px; border:1px solid var(--border); background:var(--card, #fff); color:var(--text); font-size:16px; font-weight:700; line-height:1; cursor:pointer; padding:0; flex:none; user-select:none; touch-action:manipulation;}
.pq-btn:hover{background:var(--neutral-bg, #eee);}
.pq-btn[data-d="1"]{color:#2E7D4F;} .pq-btn[data-d="-1"]{color:#B23B2E;}
.pq-btn:active{transform:scale(.92);}
@keyframes pqflash{from{background:#E5F3E9;} to{background:transparent;}}
.pq-flash{animation:pqflash .6s ease-out;}
@media print{ .pq-btn{display:none !important;} .pq input{border:none;} }
.future-banner{display:flex; justify-content:space-between; align-items:center; gap:14px; flex-wrap:wrap; margin-bottom:16px; padding:12px 14px; border-radius:10px; background:var(--warn-bg, #FBEEDC); border:1px solid var(--warn-border, #F0D6A6); color:#5A3D00; font-size:13px;}
.future-banner-actions{display:flex; gap:8px; flex-wrap:wrap;}
.photo-viewer{position:fixed; inset:0; z-index:100000; background:rgba(20,20,20,.85); display:flex; flex-direction:column; align-items:center; justify-content:center; gap:14px; cursor:zoom-out;}
.photo-viewer img{max-width:92vw; max-height:82vh; border-radius:8px; box-shadow:0 10px 40px rgba(0,0,0,.5); background:#fff;}
img.blob-thumb{min-width:40px; min-height:30px; background:var(--neutral-bg, #eee); cursor:zoom-in; object-fit:cover;}
.bain-chip{display:inline-block; padding:2px 10px; border-radius:10px; background:var(--bain); color:#fff; font-weight:700; letter-spacing:.02em; text-transform:none;}
.releve-modal{max-width:500px; border-top:5px solid var(--bain);}
.bain-tabs{display:grid; grid-template-columns:repeat(2,1fr); gap:8px;}
.bain-tab{padding:10px 12px; border-radius:8px; border:2px solid var(--bain); background:#fff; color:var(--bain); font-weight:700; font-size:14px; cursor:pointer; font-family:inherit;}
.bain-tab.active{background:var(--bain); color:#fff;}
.bain-tab:not(.active):hover{background:color-mix(in srgb, var(--bain) 10%, #fff);}
.bain-tab-done{font-size:12px; opacity:.9;}
.btn.bain-next{border-color:var(--bain); color:var(--bain); font-weight:600;}
.btn.bain-next:hover{background:var(--bain); color:#fff;}
tr.releve-cur-week td{box-shadow:inset 0 2px 0 #1F3864, inset 0 -2px 0 #1F3864;}
tr.releve-cur-week td:first-child{font-weight:700;}
.ad-noverif{display:flex; gap:10px; align-items:flex-start; cursor:pointer; font-size:13px; line-height:1.35;}
.ad-noverif input{width:16px; height:16px; margin-top:2px; flex:none; cursor:pointer;}
/* ----- Analyses Pareto ----- */
.pareto-head{display:flex; justify-content:space-between; align-items:flex-end; gap:16px; flex-wrap:wrap;}
.pareto-total{font-size:13px; color:var(--text-faint);}
.pareto-total span{font-family:var(--mono); font-weight:700; font-size:28px; color:var(--text);}
.pareto-reading{margin:10px 0 14px; padding:10px 12px; background:var(--neutral-bg, #F4F2EE); border-radius:8px; font-size:13.5px; line-height:1.5;}
.pareto-layout{display:grid; grid-template-columns:minmax(0,3fr) minmax(0,2fr); gap:18px; align-items:start;}
.pareto-chart{height:440px !important;}
.pareto-table-wrap{max-height:440px; overflow:auto;}
.pareto-table{width:100%; border-collapse:collapse; font-size:13px;}
.pareto-table th{position:sticky; top:0; background:var(--card, #fff); text-align:left; font-size:11px; text-transform:uppercase; letter-spacing:.04em; color:var(--text-faint); padding:6px 6px; border-bottom:1px solid var(--border);}
.pareto-table td{padding:6px 6px; border-bottom:1px solid var(--border);}
.pareto-table .num{text-align:right; font-family:var(--mono); white-space:nowrap;}
.pareto-row-A td{background:rgba(178,118,74,.08);}
.pareto-a{display:inline-block; min-width:16px; padding:0 4px; border-radius:4px; background:#B2764A; color:#fff; font-size:10.5px; font-weight:700; text-align:center;}
@media (max-width:1100px){ .pareto-layout{grid-template-columns:1fr;} .pareto-table-wrap{max-height:none;} }
#pareto-card:fullscreen{background:#fff; padding:28px 36px; overflow:auto;}
#pareto-card:fullscreen .pareto-chart{height:62vh !important;}
#pareto-card:fullscreen .pareto-table-wrap{max-height:62vh;}
#pareto-card:fullscreen h2{font-size:24px !important;}
#pareto-card:fullscreen .pareto-reading{font-size:16px;}
#pareto-card:fullscreen .pareto-table{font-size:15px;}
#pareto-print-sheet{display:none;}
@media print{
  body.print-pareto-sheet > *:not(#pareto-print-sheet){display:none !important;}
  body.print-pareto-sheet #pareto-print-sheet{display:block !important; font-family:Arial, Helvetica, sans-serif; color:#000;}
  .pps-body{display:grid; grid-template-columns:62% 1fr; gap:10px; align-items:start;}
  .pps-img{width:100%; height:auto; border:1px solid #ccc;}
  .pps-table td, .pps-table th{font-size:9.5px; padding:2px 4px;}
  .pps-a td{background:#F3E7DC; -webkit-print-color-adjust:exact; print-color-adjust:exact;}
}
.ad-verif{margin-top:16px; padding:12px; border:1px solid var(--border); border-radius:var(--radius-sm, 8px); background:var(--card, #fff);}
.ad-linked{margin-top:14px; padding-top:12px; border-top:1px solid var(--border);}
.ad-linked-head{display:flex; justify-content:space-between; align-items:center; gap:10px; margin-bottom:6px;}
.ad-linked-row{display:flex; align-items:center; gap:10px; padding:6px 8px; border-radius:6px; cursor:pointer; font-size:13px;}
.ad-linked-row:hover{background:var(--neutral-bg);}
.ad-linked-row > span:nth-child(2){flex:1;}
#actions-print-sheet{display:none;}
@media print{
  body.print-actions-sheet > *:not(#actions-print-sheet){display:none !important;}
  body.print-actions-sheet #actions-print-sheet{display:block !important; font-family:Arial, Helvetica, sans-serif; color:#000;}
  .aps-head{display:flex; justify-content:space-between; align-items:center; background:#1F3864; color:#fff; padding:6px 10px; -webkit-print-color-adjust:exact; print-color-adjust:exact;}
  .aps-title{font-size:15px; font-weight:700;} .aps-date{font-size:11px; font-weight:700;}
  .aps-meta{font-size:11px; margin:6px 0 4px;}
  .aps-kpis{display:flex; flex-wrap:wrap; gap:6px 14px; font-size:11px; margin-bottom:8px; padding:5px 8px; background:#F2F2F2; -webkit-print-color-adjust:exact; print-color-adjust:exact;}
  .aps-red{color:#B23B2E;}
  .aps-table{width:100%; border-collapse:collapse; font-size:10.5px;}
  .aps-table th, .aps-table td{border:1px solid #9aa3b2; padding:3px 5px; vertical-align:top; text-align:left;}
  .aps-table th{background:#D9E1F2; -webkit-print-color-adjust:exact; print-color-adjust:exact;}
  .aps-table tr{break-inside:avoid;}
  .aps-late td:first-child{color:#B23B2E; font-weight:700;}
  .aps-sub{font-size:9.5px; color:#444; margin-top:1px;}
}
.ad-grid{display:grid; grid-template-columns:1fr 1fr; gap:12px 16px; margin-top:4px;}
.ad-grid .field{margin:0;}
@media (max-width:600px){ .ad-grid{grid-template-columns:1fr;} }
.ad-history{margin-top:10px; display:flex; flex-direction:column; gap:8px; max-height:220px; overflow:auto;}
.ad-note{border-left:3px solid var(--sb-bg, #143E3E); padding:4px 10px; background:var(--neutral-bg); border-radius:0 6px 6px 0;}
.ad-note-meta{font-size:11px; color:var(--text-faint); font-weight:600;}
.ad-note-text{font-size:13px; white-space:pre-line;}
@media print{ .ap-list{max-height:none !important; overflow:visible !important;} .ap-tools{display:none !important;} }
@media print{ .ui-tooltip{display:none !important;} }
.chokko-grid .chk-sticky{position:sticky; left:0; z-index:2; border-right:2px solid #999;}
</style>

// ---------- Gravité des dépassements (relevés pièces) ----------
// Masse polluante = critère principal → gravité élevée.
// Particules à seuil 0 (> 750 µm, conductrices > 400 µm) : une seule suffit → gravité élevée.
// Petites particules à seuil large (250–500 µm ≤ 205) : gravité faible. Entre les deux (500–750 µm, conductrices 200–400 µm) : modérée.
var CONTAM_GRAVITES = {
  high:  {rank:3, label:'Élevée',  level:'danger', cell:'sc-danger'},
  medium:{rank:2, label:'Modérée', level:'urgent', cell:'sc-nc-med'},
  low:   {rank:1, label:'Faible',  level:'warn',   cell:'sc-nc-low'}
};
function contamCritGravite(cr){
  if(cr.grav) return cr.grav;
  if(/^masse/.test(cr.id)) return 'high';
  if(Number(cr.seuil)===0) return 'high';
  if(Number(cr.seuil)>=100) return 'low';
  return 'medium';
}
// Analyse d'un relevé : critères dépassés + gravité la plus forte
function contamNcAnalysis(c){
  var crit = REF_CRITERIA[c.ref]||[], vals = c.values||{};
  var over = [];
  crit.forEach(function(cr){
    var v = vals[cr.id];
    if(v!==undefined && v!==null && v!=='' && Number(v)>cr.seuil) over.push({crit:cr, value:Number(v), grav:contamCritGravite(cr)});
  });
  over.sort(function(a,b){ return CONTAM_GRAVITES[b.grav].rank-CONTAM_GRAVITES[a.grav].rank; });
  var grav = over.length ? over[0].grav : (c.statut==='nc' ? 'high' : null);  // NC sans détail des valeurs : on reste prudent
  return {over:over, grav:grav, unknown: c.statut==='nc' && !over.length};
}

  var l = o.crit.label.replace('Particules ','').replace('Masse polluante','Masse').replace('conductrices','cond.');

}
function contamGravBadge(c){
  var a = contamNcAnalysis(c);
  if(c.statut!=='nc' || !a.grav) return badge(contamLevelForStatut(c.statut), contamStatutLabel(c.statut));
  var g = CONTAM_GRAVITES[a.grav];

}
function contamConformite(ref, values){
  var crit = REF_CRITERIA[ref]||[];

}

function supabaseGet(key){

function supabaseSet(key, value){
  return supabaseClient.from('kv_store').upsert({key:key, value: JSON.parse(value)}, {onConflict:'key'}).then(function(res){

    return {key:key, value:value, shared:true};
  });
}
function backendGetLocal(key){
  STORAGE_MODE = 'local';

  return Promise.resolve(raw!==null ? {key:key, value:raw, shared:false} : null);
}
function backendSetLocal(key, value){
  STORAGE_MODE = 'local';
  try{ localStorage.setItem(key, value); }catch(e){ /* ignore quota errors */ }
  return Promise.resolve({key:key, value:value, shared:false});
}
var LOAD_DEGRADED = false; // vrai si le chargement initial a échoué → écriture interdite
function backendGet(key){
  if(supabaseClient){
    // NE PAS basculer en local sur erreur : propager pour que loadAll passe en mode dégradé
    return supabaseGet(key);
  }
  if(window.storage && typeof window.storage.get === 'function'){
    STORAGE_MODE = 'claude';
    return window.storage.get(key, true);
  }
  return backendGetLocal(key);
}
function backendSet(key, value){
  if(LOAD_DEGRADED){
    // Chargement initial en échec : ne JAMAIS écraser les données serveur
    return Promise.reject(new Error('Écriture bloquée : les données n\'ont pas pu être chargées depuis le serveur.'));
  }
  if(supabaseClient){
    return supabaseSet(key, value); // pas de fallback silencieux : une erreur d'écriture doit être visible
  }
  if(window.storage && typeof window.storage.set === 'function'){
    STORAGE_MODE = 'claude';
    return window.storage.set(key, value, true);
  }
  return backendSetLocal(key, value);
}

// ====================================================================
// SYNCHRONISATION MULTI-UTILISATEURS
// - Fusion à l'enregistrement : on relit la version du serveur juste avant d'écrire et on fusionne
//   ligne par ligne (par identifiant). Deux personnes qui enregistrent en même temps ne s'écrasent plus.
// - Écriture conditionnelle (updated_at) : si quelqu'un a écrit entre notre lecture et notre écriture,
//   on recommence la fusion au lieu d'écraser.
// - Synchro allégée : toutes les 10 s on ne lit que les dates de modification, et on ne télécharge
//   que les modules qui ont changé.
// ====================================================================
var SERVER_BASE = {};   // module -> JSON de la dernière version connue du serveur (base de la fusion)
var SERVER_TS = {};     // module -> updated_at de cette version
var saveQueues = {};    // module -> promesse : les enregistrements d'un même module passent l'un après l'autre
var SYNC_STATS = {polls:0, metaOnly:0, fetchedKeys:0, merges:0, conflicts:0};

function syncJson(v){ return JSON.stringify(v===undefined ? null : v); }
function syncIsPlainObject(v){ return v!==null && typeof v==='object' && !Array.isArray(v); }
function syncItemKey(it){
  if(it && typeof it==='object'){
    if(it.id!==undefined && it.id!==null) return 'id:'+it.id;
    if(typeof it.week==='string' && it.lots!==undefined) return 'week:'+(it.secteur||'MCU')+':'+it.week;                 // photos hebdomadaires de la prison
    if(typeof it.date==='string' && it.score!==undefined && it.detail!==undefined) return 'date:'+it.date;  // historique du score
  }
  return 'v:'+JSON.stringify(it);
}
// Fusion à trois versions : base (dernière version commune), mine (ce poste), theirs (serveur)
function mergeValues(base, mine, theirs){
  var jm = syncJson(mine), jt = syncJson(theirs);
  if(jm===jt) return mine;
  var jb = syncJson(base);
  if(jm===jb) return theirs;        // je n'ai rien changé : je prends la version serveur
  if(jt===jb) return mine;          // personne d'autre n'a changé : ma version
  if(Array.isArray(mine) && Array.isArray(theirs)) return mergeArrays(Array.isArray(base)?base:[], mine, theirs);
  if(syncIsPlainObject(mine) && syncIsPlainObject(theirs)) return mergeObjects(syncIsPlainObject(base)?base:{}, mine, theirs);
  return mine;                      // conflit sur une même valeur simple : la dernière saisie l'emporte
}
function mergeObjects(base, mine, theirs){
  var out = {}, seen = {};
  Object.keys(mine).concat(Object.keys(theirs)).concat(Object.keys(base)).forEach(function(f){
    if(seen[f]) return; seen[f] = true;
    var inM = Object.prototype.hasOwnProperty.call(mine, f), inT = Object.prototype.hasOwnProperty.call(theirs, f), inB = Object.prototype.hasOwnProperty.call(base, f);
    if(inM && inT){ out[f] = mergeValues(inB? base[f] : undefined, mine[f], theirs[f]); return; }
    if(inM && !inT){ if(!inB || syncJson(mine[f])!==syncJson(base[f])) out[f] = mine[f]; return; }   // supprimé ailleurs sauf si je l'ai modifié
    if(!inM && inT){ if(!inB || syncJson(theirs[f])!==syncJson(base[f])) out[f] = theirs[f]; return; }
  });
  return out;
}
function mergeArrays(base, mine, theirs){
  var B = {}, M = {}, T = {};
  base.forEach(function(x){ B[syncItemKey(x)] = x; });
  mine.forEach(function(x){ M[syncItemKey(x)] = x; });
  theirs.forEach(function(x){ T[syncItemKey(x)] = x; });
  var out = [], placed = {};
  mine.forEach(function(x){
    var k = syncItemKey(x);
    if(placed[k]) return;
    var inB = k in B, inT = k in T;
    if(inT){ out.push(mergeValues(inB? B[k] : undefined, x, T[k])); placed[k] = true; return; }
    // absent du serveur : nouveau chez moi → je garde ; supprimé par un autre → je garde seulement si je l'ai modifié
    if(!inB || syncJson(x)!==syncJson(B[k])){ out.push(x); placed[k] = true; }
  });
  // Éléments présents seulement sur le serveur : ajoutés par un autre (on garde, à leur place dans l'ordre du serveur),
  // ou supprimés par moi (on retire, sauf s'ils ont été modifiés ailleurs entre-temps)
  var inserts = {}, headInserts = [], anchor = null;
  theirs.forEach(function(x){
    var k = syncItemKey(x);
    if(placed[k]){ anchor = k; return; }
    if((k in B) && syncJson(x)===syncJson(B[k])) return;
    placed[k] = true;
    if(anchor===null) headInserts.push(x); else (inserts[anchor] = inserts[anchor] || []).push(x);
  });
  if(!headInserts.length && !Object.keys(inserts).length) return out;
  var res = headInserts.slice();
  out.forEach(function(x){ res.push(x); var k = syncItemKey(x); if(inserts[k]) res.push.apply(res, inserts[k]); });
  return res;
}

// ---------- Accès Supabase avec date de modification ----------
function sbGetWithTs(name){
  return supabaseClient.from('kv_store').select('value,updated_at').eq('key', name).maybeSingle().then(function(res){
    if(res.error) throw new Error(res.error.message);
    return res.data ? {value:res.data.value, ts:res.data.updated_at} : null;
  });
}
function sbGetMany(names, withValue){
  return supabaseClient.from('kv_store').select(withValue? 'key,value,updated_at' : 'key,updated_at').in('key', names).then(function(res){
    if(res.error) throw new Error(res.error.message);
    return res.data || [];
  });
}
// Écrit seulement si la ligne n'a pas changé depuis notre lecture (sinon {conflict:true})
function sbWriteIf(name, value, expectedTs, rowExists){
  var now = new Date().toISOString();
  if(rowExists && !expectedTs){
    // Ligne existante sans date de modification (base ancienne) : écriture simple, la date est posée au passage
    return supabaseClient.from('kv_store').update({value:value, updated_at:now}).eq('key', name).select('updated_at').then(function(res){
      if(res.error) throw new Error(res.error.message);
      return {ts: res.data && res.data[0] ? res.data[0].updated_at : now};
    });
  }
  if(!expectedTs){
    return supabaseClient.from('kv_store').insert({key:name, value:value, updated_at:now}).select('updated_at').then(function(res){
      if(res.error){ if(String(res.error.code)==='23505' || /duplicate|conflict/i.test(res.error.message||'')) return {conflict:true}; throw new Error(res.error.message); }
      return {ts: res.data && res.data[0] ? res.data[0].updated_at : now};
    });
  }
  return supabaseClient.from('kv_store').update({value:value, updated_at:now}).eq('key', name).eq('updated_at', expectedTs).select('updated_at').then(function(res){
    if(res.error) throw new Error(res.error.message);
    if(!res.data || !res.data.length) return {conflict:true};
    return {ts: res.data[0].updated_at};
  });
}
async function saveMerged(k){
  var name = KEYS[k];
  for(var attempt=0; attempt<5; attempt++){
    var sent = DATA[k], sentJson = syncJson(sent);
    var cur = await sbGetWithTs(name);
    var merged = sent;
    if(cur){
      var serverJson = syncJson(cur.value);
      if(SERVER_BASE[k]!==undefined && serverJson!==SERVER_BASE[k]){
        merged = mergeValues(JSON.parse(SERVER_BASE[k]), sent, cur.value);
        SYNC_STATS.merges++;
      } else if(SERVER_BASE[k]===undefined && serverJson!==sentJson){
        merged = mergeValues(undefined, sent, cur.value);   // pas de base connue : union prudente
        SYNC_STATS.merges++;
      }
    }
    var res = await sbWriteIf(name, merged, cur ? cur.ts : null, !!cur);
    if(res.conflict){ SYNC_STATS.conflicts++; await new Promise(function(r){ setTimeout(r, 120 + Math.random()*250); }); continue; }
    var mergedJson = syncJson(merged);
    SERVER_BASE[k] = mergedJson; SERVER_TS[k] = res.ts;
    if(mergedJson!==sentJson){
      // Des modifications d'autres personnes ont été intégrées : on les reprend localement sans perdre ce qui a été saisi pendant l'envoi
      DATA[k] = syncJson(DATA[k])===sentJson ? merged : mergeValues(sent, DATA[k], merged);
      pendingRemoteRender = true;
    }
    return;
  }
  throw new Error('Trop de modifications simultanées sur « '+k+' », réessayez dans un instant.');
}
async function saveDirect(k){
  var json = syncJson(DATA[k]);
  await backendSet(KEYS[k], json);
  SERVER_BASE[k] = json;
}
function saveSerialized(k){
  var run = function(){ return (STORAGE_MODE==='supabase' && supabaseClient) ? saveMerged(k) : saveDirect(k); };
  var p = (saveQueues[k] || Promise.resolve()).then(run, run);
  saveQueues[k] = p.catch(function(){});
  return p;
}
// Chargement initial en une seule requête (au lieu d'une par module)
async function loadAllSupabase(){
  var names = Object.keys(KEYS).map(function(k){ return KEYS[k]; });
  var rows = await sbGetMany(names, true);
  var byName = {};
  rows.forEach(function(r){ byName[r.key] = r; });
  var missing = [];
  Object.keys(KEYS).forEach(function(k){
    var r = byName[KEYS[k]];
    if(r && r.value!==null && r.value!==undefined){
      DATA[k] = r.value; SERVER_BASE[k] = syncJson(r.value); SERVER_TS[k] = r.updated_at;
    } else missing.push(k);
  });
  return missing;
}
// Synchro allégée : lit seulement les dates de modification, télécharge ce qui a changé.
// Toutes les 5 minutes, relecture complète par sécurité (postes pas encore mis à jour, etc.).
async function pollChangedKeys(){
  SYNC_STATS.polls++;
  var names = Object.keys(KEYS).map(function(k){ return KEYS[k]; });
  var full = SYNC_STATS.polls % 30 === 0;
  var toFetch = [];
  if(full){ toFetch = names; }
  else {
    var meta = await sbGetMany(names, false);
    meta.forEach(function(r){
      var k = Object.keys(KEYS).filter(function(x){ return KEYS[x]===r.key; })[0];
      if(k && r.updated_at!==SERVER_TS[k]) toFetch.push(r.key);
    });
    if(!toFetch.length){ SYNC_STATS.metaOnly++; return false; }
  }
  var t0 = Date.now();
  var rows = await sbGetMany(toFetch, true);
  SYNC_STATS.fetchedKeys += rows.length;
  var changed = false;
  rows.forEach(function(r){
    var k = Object.keys(KEYS).filter(function(x){ return KEYS[x]===r.key; })[0];
    if(!k) return;
    // Ne jamais toucher un module en cours d'envoi depuis ce poste
    if(savesInFlight[k] || (lastSaveStart[k]||0) >= t0 - 1500 || (lastSaveEnd[k]||0) >= t0) return;
    var sj = syncJson(r.value);
    SERVER_TS[k] = r.updated_at;
    if(sj===SERVER_BASE[k]) return;
    var base = SERVER_BASE[k]!==undefined ? JSON.parse(SERVER_BASE[k]) : undefined;
    var before = syncJson(DATA[k]);
    DATA[k] = mergeValues(base, DATA[k], r.value);
    SERVER_BASE[k] = sj;
    if(syncJson(DATA[k])!==before) changed = true;
  });
  return changed;
}

// ====================================================================
// PHOTOS ET PIÈCES JOINTES : stockées à part (une ligne par fichier), jamais relues par la synchro.
// Les enregistrements ne gardent qu'une référence "blob:app_blob_xxx".
// ====================================================================
var BLOB_CACHE = {};
function isDataUrl(v){ return typeof v==='string' && v.indexOf('data:')===0; }
function isBlobRef(v){ return typeof v==='string' && v.indexOf('blob:app_blob_')===0; }
async function blobPut(dataUrl){
  var name = 'app_blob_'+uid('f').replace(/[^a-z0-9_-]/gi,'');
  await backendSet(name, JSON.stringify(dataUrl));
  BLOB_CACHE['blob:'+name] = dataUrl;
  return 'blob:'+name;
}
async function blobGet(ref){
  if(!isBlobRef(ref)) return isDataUrl(ref) ? ref : null;
  if(BLOB_CACHE[ref]) return BLOB_CACHE[ref];
  var r = await backendGet(ref.slice(5));
  var v = r && r.value ? JSON.parse(r.value) : null;
  if(v) BLOB_CACHE[ref] = v;
  return v;
}
// Remplace les photos intégrées (data:...) par des références, dans tout objet ou tableau
async function externalizeBlobs(obj){
  var changed = false;
  async function walk(o){
    if(Array.isArray(o)){ for(var i=0;i<o.length;i++){ if(isDataUrl(o[i]) && o[i].length>2000){ o[i] = await blobPut(o[i]); changed = true; } else if(o[i] && typeof o[i]==='object') await walk(o[i]); } return; }
    if(o && typeof o==='object'){
      for(var f in o){
        if(!Object.prototype.hasOwnProperty.call(o,f)) continue;
        if(isDataUrl(o[f]) && o[f].length>2000){ o[f] = await blobPut(o[f]); changed = true; }
        else if(o[f] && typeof o[f]==='object') await walk(o[f]);
      }
    }
  }
  await walk(obj);
  return changed;
}
var BLOB_MODULES = ['propAudits','actions','metro'];
async function migrateInlineBlobs(){
  if(LOAD_DEGRADED) return;
  for(var i=0;i<BLOB_MODULES.length;i++){
    var k = BLOB_MODULES[i];
    try{ if(await externalizeBlobs(DATA[k])) await save(k); }catch(e){ console.error('migration photos', k, e); }
  }
}
// Vignette : affiche un espace réservé puis charge le fichier à la demande
function blobThumb(ref, label){
  if(!ref) return '-';
  return '<img class="thumb blob-thumb" alt="'+esc(label||'Photo')+'" data-blob="'+esc(ref)+'" data-action="view-photo" src="data:image/gif;base64,R0lGODlhAQABAAAAACw=">';
}
function hydrateBlobThumbs(){
  Array.prototype.forEach.call(document.querySelectorAll('img[data-blob]:not([data-loaded])'), function(img){
    img.setAttribute('data-loaded','1');
    blobGet(img.dataset.blob).then(function(v){
      if(!v){ img.replaceWith(document.createTextNode('(fichier introuvable)')); return; }
      if(v.indexOf('data:image/')===0){ img.src = v; }
      else { var a = document.createElement('a'); a.href = '#'; a.textContent = '📄 Ouvrir'; a.dataset.action = 'view-photo'; a.dataset.blob = img.dataset.blob; img.replaceWith(a); }
    }).catch(function(){ img.setAttribute('data-loaded','err'); });
  });
}
// Visionneuse (les navigateurs bloquent l'ouverture directe d'une image "data:" dans un nouvel onglet)
async function openBlobViewer(ref, directSrc){
  var v = directSrc || await blobGet(ref);
  if(!v){ toast('Fichier introuvable.', 'error'); return; }
  if(v.indexOf('data:image/')!==0){
    // PDF ou autre : on l'ouvre via une URL temporaire
    try{
      var parts = v.split(','), mime = (parts[0].match(/data:([^;]+)/)||[])[1] || 'application/octet-stream';
      var bin = atob(parts[1]), arr = new Uint8Array(bin.length);
      for(var i=0;i<bin.length;i++) arr[i] = bin.charCodeAt(i);
      window.open(URL.createObjectURL(new Blob([arr], {type:mime})), '_blank');
    }catch(e){ toast('Impossible d\'ouvrir ce fichier.', 'error'); }
    return;
  }
  var ov = document.createElement('div');
  ov.className = 'photo-viewer';
  ov.innerHTML = '<img src="'+v+'" alt="Photo"><button class="btn" type="button">Fermer</button>';
  ov.addEventListener('click', function(){ ov.remove(); });
  document.body.appendChild(ov);
}

// ====================================================================
// FENÊTRES DE L'APPLICATION (remplacent alert() / confirm() du navigateur)
// uiAlert(message)            -> Promise (fermée par OK / Entrée / Échap)
// uiConfirm(message, options) -> Promise<boolean>
// Le texte garde ses retours à la ligne. Les fenêtres s'empilent au-dessus de tout le reste.
// ====================================================================
function uiDialog(message, opts){
  opts = opts || {};
  return new Promise(function(resolve){
    var prevFocus = document.activeElement;
    var ov = document.createElement('div');
    ov.className = 'ui-dialog-overlay';
    var isConfirm = opts.kind==='confirm';
    var lvl = opts.danger ? 'danger' : opts.level || (isConfirm ? 'neutral' : 'info');
    var icon = {danger:'⚠', warn:'⚠', info:'ℹ', ok:'✓', neutral:'?'}[lvl] || 'ℹ';
    ov.innerHTML = '<div class="ui-dialog ui-dialog-'+lvl+'" role="dialog" aria-modal="true">'+
      '<div class="ui-dialog-head"><span class="ui-dialog-icon">'+icon+'</span><span class="ui-dialog-title"></span></div>'+
      '<div class="ui-dialog-body"></div>'+
      '<div class="ui-dialog-actions">'+
        (isConfirm? '<button type="button" class="btn ui-dialog-cancel"></button>' : '')+
        '<button type="button" class="btn primary ui-dialog-ok'+(opts.danger?' ui-dialog-ok-danger':'')+'"></button>'+
      '</div></div>';
    ov.querySelector('.ui-dialog-title').textContent = opts.title || (isConfirm ? 'Confirmation' : (lvl==='danger'||lvl==='warn' ? 'Attention' : 'Information'));
    ov.querySelector('.ui-dialog-body').textContent = String(message==null ? '' : message);
    ov.querySelector('.ui-dialog-ok').textContent = opts.okLabel || (isConfirm ? 'Confirmer' : 'OK');
    if(isConfirm) ov.querySelector('.ui-dialog-cancel').textContent = opts.cancelLabel || 'Annuler';
    var done = false;
    function close(val){
      if(done) return; done = true;
      document.removeEventListener('keydown', onKey, true);
      ov.remove();
      try{ if(prevFocus && prevFocus.focus && document.contains(prevFocus)) prevFocus.focus({preventScroll:true}); }catch(e){}
      resolve(val);
    }
    function onKey(e){
      if(e.key==='Escape'){ e.preventDefault(); e.stopPropagation(); close(isConfirm ? false : undefined); }
      else if(e.key==='Enter'){ e.preventDefault(); e.stopPropagation(); close(isConfirm ? true : undefined); }
    }
    ov.querySelector('.ui-dialog-ok').addEventListener('click', function(){ close(isConfirm ? true : undefined); });
    if(isConfirm) ov.querySelector('.ui-dialog-cancel').addEventListener('click', function(){ close(false); });
    ov.addEventListener('mousedown', function(e){ if(e.target===ov && isConfirm) close(false); });
    document.addEventListener('keydown', onKey, true);
    document.body.appendChild(ov);
    setTimeout(function(){ var b = ov.querySelector(isConfirm && opts.danger ? '.ui-dialog-cancel' : '.ui-dialog-ok'); if(b) b.focus(); }, 0);
  });
}
function uiAlert(message, opts){
  opts = opts || {};
  var m = String(message||'');
  if(!opts.level) opts.level = /^\s*(⚠|🚨)|erreur|impossible|non conforme|NON CONFORME/i.test(m) ? 'warn' : 'info';
  return uiDialog(m.replace(/^\s*(⚠️|⚠|🚨|ℹ️)\s*/, ''), Object.assign({kind:'alert'}, opts));
}
function uiConfirm(message, opts){
  opts = opts || {};
  if(opts.danger===undefined && /supprimer|effacer|vider|définitivement|abandonner|restaurer/i.test(String(message))) opts.danger = true;
  return uiDialog(message, Object.assign({kind:'confirm'}, opts));
}

// Une copie complète des données est faite automatiquement par le premier poste connecté :
// chaque jour (7 dernières conservées, une par jour de la semaine) et chaque semaine (8 dernières).
// Stockées à part (non synchronisées), restaurables module par module par un administrateur.
// ====================================================================
var BACKUP_INDEX_KEY = 'app_backups_index_v1';
var BACKUP_LABELS = {metro:'Métrologie', planning:'Planning échéances', ateq:'Défauts ATEQ', actions:"Plan d'actions",
  resultats:'Résultats propreté', releves:'Relevés bains MCU0', checklist:'Grilles d\'audit propreté', propAudits:'Audits propreté',
  contamination:'Contamination', vidange:'Vidange', accounts:'Comptes', roles:'Profils', changelog:'Historique des modifications',
  scoreHistory:'Historique du score', particules:'Relevés particules', esd:'Formations ESD', perf:'Audits de perf', secteurs:'Secteurs',
  formations:'Formations SREM', postits:'Post-it', labelOverrides:'Libellés personnalisés', cicl:'Formations CI/CL', chokko:'Suivi CHOKKO',
  chokkoNotes:'Notes CHOKKO', ciclPersons:'Personnes CI/CL', chokkoColors:'Couleurs CHOKKO', chokkoHighlights:'Surlignages CHOKKO',
  chokkoRecentColors:'Couleurs récentes CHOKKO', chokkoPosteLabels:'Libellés postes CHOKKO', chokkoUnitCost:'Coût par pièce CHOKKO',
  chokkoPosteConfig:'Postes CHOKKO', bibliotheque:'Bibliothèque', prisonLots:'Prison qualité', prisonSnapshots:'Prison qualité (historique)',
  actionsSnapshots:'Évolution des actions', uiSettings:'Réglages d\'affichage'};
var BACKUP_NO_DEFAULT_RESTORE = ['accounts','roles','uiSettings'];
var backupIndexCache = null;
var backupRestoreState = null;   // {slot, snapshot, label}
async function backupReadIndex(){
  var r = await backendGet(BACKUP_INDEX_KEY);
  var idx = r && r.value ? JSON.parse(r.value) : null;
  if(!idx || typeof idx!=='object') idx = {};
  idx.slots = idx.slots || {};
  backupIndexCache = idx;
  return idx;
}
function backupSnapshotJson(){
  var data = {};
  Object.keys(KEYS).forEach(function(k){ data[k] = DATA[k]; });
  return JSON.stringify({version:1, createdAt:new Date().toISOString(), by: currentUser ? currentUser.displayName : '?', data:data});
}
async function backupWriteSlot(idx, slot, kind, label){
  var json = backupSnapshotJson();
  await backendSet('app_backup_'+slot, json);
  idx.slots[slot] = {kind:kind, label:label, date:todayStr(), createdAt:new Date().toISOString(), by: currentUser ? currentUser.displayName : '?', size:json.length};
}
var backupRunning = false;
async function autoBackupTick(){
  if(backupRunning || LOAD_DEGRADED || !currentUser) return;
  backupRunning = true;
  try{
    var idx = await backupReadIndex();
    var today = todayStr();
    var dslot = 'd'+new Date().getDay();
    var wk = isoWeekInfo(today), wlabel = wk.year+'-S'+String(wk.week).padStart(2,'0'), wslot = 'w'+(wk.week % 8);
    var changed = false;
    if(!idx.slots[dslot] || idx.slots[dslot].date!==today){ await backupWriteSlot(idx, dslot, 'daily', 'Quotidienne'); changed = true; }
    if(!idx.slots[wslot] || idx.slots[wslot].week!==wlabel){ await backupWriteSlot(idx, wslot, 'weekly', 'Hebdomadaire '+wlabel); idx.slots[wslot].week = wlabel; changed = true; }
    if(changed) await backendSet(BACKUP_INDEX_KEY, JSON.stringify(idx));
  }catch(e){ console.error('sauvegarde automatique', e); }
  finally{ backupRunning = false; }
}
function backupFmtSize(n){ return n>1048576 ? (n/1048576).toFixed(1)+' Mo' : Math.max(1, Math.round(n/1024))+' Ko'; }
function backupCardHtml(){
  if(!currentUser || currentUser.roleId!==ADMIN_ROLE_ID) return '';
  var h = '<div class="card" style="margin-top:18px;"><div style="display:flex; justify-content:space-between; align-items:baseline; gap:10px; flex-wrap:wrap;"><div class="eyebrow">Sauvegardes automatiques</div>'+
    '<button class="btn small" data-action="backup-refresh">Actualiser</button></div>'+
    '<p class="tiny" style="margin:8px 0 12px;">Une copie complète est faite automatiquement chaque jour (7 derniers jours conservés) et chaque semaine (8 dernières semaines). En cas d\'erreur (module vidé, suppression accidentelle), vous pouvez restaurer un ou plusieurs modules. Une copie de l\'état actuel est toujours faite juste avant une restauration.</p>';
  if(!backupIndexCache){ return h+'<div class="tiny">Chargement…</div></div>'; }
  var slots = Object.keys(backupIndexCache.slots).map(function(s){ return Object.assign({slot:s}, backupIndexCache.slots[s]); })
    .sort(function(a,b){ return (b.createdAt||'').localeCompare(a.createdAt||''); });
  if(!slots.length) return h+emptyState('Aucune sauvegarde pour le moment (la première se fait à la prochaine connexion).')+'</div>';
  h += '<div class="table-wrap"><table><thead><tr><th>Type</th><th>Date</th><th>Faite par</th><th class="num">Taille</th><th></th></tr></thead><tbody>'+
    slots.map(function(s){
      var dt = s.createdAt ? new Date(s.createdAt) : null;

// ---------- status helpers ----------
function metroStatus(e){
  if(!e.echeance) return {level:'neutral', label:'Sans échéance', expiresThisMonth:false};
  var today = todayStr();
  var curYYYYMM = today.slice(0,7);
  var eYYYYMM = e.echeance.slice(0,7);
  var d = daysBetween(today, e.echeance);
  // expiré avant ce mois → vraiment en retard
  if(eYYYYMM < curYYYYMM) return {level:'danger', label:'En retard', expiresThisMonth:false};
  // expire dans le mois en cours → urgent mais encore valide
  if(eYYYYMM === curYYYYMM) return {level:'urgent', label:'Expire ce mois', expiresThisMonth:true};
  // expire le mois prochain
  if(d<=31) return {level:'warn', label:'À prévoir', expiresThisMonth:false};
  return {level:'ok', label:'À jour', expiresThisMonth:false};
}
function globalConformityScore(){
  var enabled = (DATA.uiSettings && DATA.uiSettings.scoreModules) || {};
  function on(key){ return enabled[key]!==false; } // actif par défaut si jamais réglé
  var parts = [];
  var detail = [];
  if(on('propr')){
    var proprVals = LINES.map(latestResultByLine).filter(Boolean).map(function(r){return r.resultatPct;});
    if(proprVals.length){
      var p = proprVals.reduce(function(a,b){return a+b;},0)/proprVals.length;
      parts.push(p); detail.push({label:'Propreté', val:Math.round(p)});
    }
  }
  if(on('metro') && bySecteur(DATA.metro).length){
    var metroSect = bySecteur(DATA.metro);
    var lateCount = metroSect.filter(function(e){ return metroStatus(e).level==='danger'; }).length;
    var m = metroSect.length? (1 - lateCount/metroSect.length)*100 : 100;
    parts.push(m); detail.push({label:'Métrologie à jour', val:Math.round(m)});
  }
  if(on('contam')){
    var contamYear = DATA.contamination.filter(function(c){ return c.annee===Number(todayStr().slice(0,4)) && (c.statut==='ok'||c.statut==='nc'); });
    if(contamYear.length){
      var okCount = contamYear.filter(function(c){return c.statut==='ok';}).length;
      var c = okCount/contamYear.length*100;
      parts.push(c); detail.push({label:'Contamination conforme', val:Math.round(c)});
    }
  }
  if(on('actions')){
    var relevantActions = bySecteur(DATA.actions).filter(function(a){ return a.statut!=='abandonnee'; });
    if(relevantActions.length){
      var lateA = relevantActions.filter(isActionLate).length;
      var ac = (1-lateA/relevantActions.length)*100;
      parts.push(ac); detail.push({label:"Actions dans les temps", val:Math.round(ac)});
    }
  }
  if(on('chokko') && currentSecteur==='MCU'){
    var today0 = new Date();
    var chokkoVals = ['MCU1','MCU2','MCU3'].map(function(l){ return chokkoMonthAverage(l, today0.getFullYear(), today0.getMonth()); }).filter(function(v){ return v!==null; });
    if(chokkoVals.length){
      var ck = chokkoVals.reduce(function(a,b){return a+b;},0)/chokkoVals.length;
      parts.push(ck); detail.push({label:'CHOKKO', val:Math.floor(ck*10+1e-9)/10});
    }
  }
  if(!parts.length) return {score:null, detail:[]};
  return {score: Math.round(parts.reduce(function(a,b){return a+b;},0)/parts.length), detail:detail};
}

function metroOverall(lines){

  var late=0, urgent=0, warn=0, worst='ok', worstItem=null, worstDays=Infinity;

  });
  var lbl = worst==='danger'?'Échéance dépassée':worst==='urgent'?'Expire ce mois':worst==='warn'?'À prévoir':'À jour';
  return {level:worst, label:lbl, late:late, urgent:urgent, warn:warn, worstItem: (worst!=='ok'? worstItem : null), worstLabel: (worst!=='ok' && worstItem? daysLabel(worstItem.echeance) : null)};

// ---------- Réalisation déduite des données réellement saisies ----------
// Une échéance du planning est considérée comme réalisée dès qu'un relevé / audit / résultat existe
// pour le même mois dans le module concerné, même si personne n'a cliqué sur "Marquer réalisé".
function monthKeyOf(y, m){ return y+'-'+String(m+1).padStart(2,'0'); }
function contamMonthsFor(ligne, ref){
  var set = {};
  DATA.contamination.forEach(function(c){
    if(c.ligne!==ligne || (ref && c.ref!==ref) || c.mois===undefined || c.mois===null || !c.annee) return;
    var k = monthKeyOf(c.annee, c.mois);
    // Date exacte de collecte si elle tombe dans le mois du relevé, sinon simple repère "mi-mois"
    var exact = c.collecteDate && c.collecteDate.slice(0,7)===k ? c.collecteDate : null;
    var cur = set[k], curExact = cur && cur.slice(8)!=='15';
    if(exact){ if(!curExact || exact>cur) set[k] = exact; }
    else if(!cur) set[k] = k+'-15';
  });
  return set;
}
function planningRecordMonths(type, ligne, ref, secteur){
  // Renvoie {'AAAA-MM': date la plus récente} des données réelles pour ce type/ligne(/réf.)
  var set = {};
  function add(k, d){ if(!set[k] || d>set[k]) set[k] = d; }
  secteur = secteur || 'MCU';
  if(type==='labo'){
    if(secteur!=='MCU') return set;
    if(ref) return contamMonthsFor(ligne, ref);
    // Échéance sans référence = toute la ligne : chaque référence doit avoir son relevé du mois
    var refs = refsForLigne(ligne);
    if(!refs.length) return contamMonthsFor(ligne, null);
    var per = refs.map(function(r){ return contamMonthsFor(ligne, r); });
    Object.keys(per[0]).forEach(function(k){
      if(per.every(function(m){ return m[k]; })){
        add(k, per.map(function(m){ return m[k]; }).sort().pop());
      }
    });
  } else if(type==='perf'){
    DATA.perf.forEach(function(r){
      if((r.secteur||'MCU')!==secteur || r.ligne!==ligne || r.resultatPct===null || r.resultatPct===undefined || r.mois===undefined) return;
      var k = monthKeyOf(r.annee, r.mois); add(k, k+'-15');
    });
  } else if(type==='proprete'){
    DATA.propAudits.forEach(function(a){
      if(a.ligne!==ligne || !a.date || (a.secteur && a.secteur!==secteur)) return;
      add(a.date.slice(0,7), a.date);
    });
    DATA.resultats.forEach(function(r){
      if(r.ligne!==ligne || r.resultatPct===null || r.resultatPct===undefined) return;
      var mi = monthIndex(r.mois); if(mi<0) return;
      var y = r.annee || Number(todayStr().slice(0,4));
      var k = monthKeyOf(y, mi); add(k, k+'-15');
    });
  }
  return set;
}
function planningAutoDone(p, refOverride){
  if(!p || !p.echeance) return null;
  var sec = p.secteur||'MCU';
  if(p.type==='perf' && p.resultatPct!==undefined && p.resultatPct!==null && p.resultatPct!=='') return p.echeance;
  if(p.type==='metro'){
    // Pas de "relevé" métrologie mensuel : la tournée est considérée faite si, une fois son échéance passée,
    // aucun instrument de la ligne n'est hors validité.
    if(p.echeance>todayStr()) return null;
    var inst = DATA.metro.filter(function(e){ return (e.secteur||'MCU')===sec && e.ligne===p.ligne && e.echeance; });
    if(!inst.length) return null;
    return inst.some(function(e){ return metroStatus(e).level==='danger'; }) ? null : p.echeance;
  }
  var months = planningRecordMonths(p.type, p.ligne, refOverride || p.ref || null, sec);
  return months[p.echeance.slice(0,7)] || null;
}
function planningIsDone(p, refOverride){ return !!(p.realisation || planningAutoDone(p, refOverride)); }
function planningStatus(p){
  if(p.realisation) return {level:'ok', label:'Réalisé'};
  if(planningAutoDone(p)) return {level:'ok', label:'Réalisé', auto:true};
  if(!p.echeance) return {level:'neutral', label:'Planifié'};
  var d = daysBetween(todayStr(), p.echeance);
  if(d<0) return {level:'danger', label:'En retard'};
  if(d<=14) return {level:'warn', label:'À venir'};
  return {level:'neutral', label:'Planifié'};
}
function planningOverall(types, lines){
  var items = DATA.planning.filter(function(p){
    return (!types || types.indexOf(p.type)>=0) && (!lines || lines.indexOf(p.ligne)>=0);
  });
  if(!items.length) return {level:'neutral', label:'Aucune donnée'};
  var worst='ok';
  items.forEach(function(p){ var s=planningStatus(p).level; if(s==='danger') worst='danger'; else if(s==='warn'&&worst!=='danger') worst='warn'; });
  return {level:worst, label: worst==='danger'?'En retard':worst==='warn'?'À venir':'À jour'};
}
// Renvoie l'échéance la plus pertinente "en ce moment" pour un type+ligne donné :
// la plus en retard si non réalisée, sinon la plus proche à venir, sinon la dernière réalisée.
function planningCurrentEntry(type, ligne, ref){
  var items = bySecteur(DATA.planning).filter(function(p){
    if(p.type!==type || p.ligne!==ligne) return false;
    if(ref!==undefined && ref!==null) return (p.ref||null)===(ref||null);
    return true;
  });
  if(!items.length) return null;
  var today = todayStr();
  var overdue = items.filter(function(p){ return !planningIsDone(p, ref) && p.echeance && p.echeance<=today; })
    .sort(function(a,b){ return a.echeance.localeCompare(b.echeance); });
  if(overdue.length) return overdue[0];
  var upcoming = items.filter(function(p){ return !planningIsDone(p, ref) && p.echeance && p.echeance>today; })
    .sort(function(a,b){ return a.echeance.localeCompare(b.echeance); });
  if(upcoming.length) return upcoming[0];
  var done = items.filter(function(p){ return planningIsDone(p, ref); })
    .sort(function(a,b){ return String(b.realisation||b.echeance).localeCompare(String(a.realisation||a.echeance)); });
  if(done.length) return done[0];
  return items[0];
}
// Statut affiché sur les cartes du tableau de bord : on regarde la DERNIÈRE échéance passée
// (et non la plus ancienne), en tenant compte des relevés réellement saisis.
function lastRecordLabel(type, ligne, ref){
  var months = planningRecordMonths(type, ligne, ref||null, currentSecteur);
  var keys = Object.keys(months).sort();
  if(!keys.length) return null;
  var k = keys[keys.length-1], d = months[k];
  var mi = Number(k.slice(5,7))-1;
  var monthTxt = MONTHS_FR[mi].charAt(0).toUpperCase()+MONTHS_FR[mi].slice(1)+' '+k.slice(0,4);
  var exact = d && d.slice(0,7)===k && d.slice(8)!=='15';
  return {key:k, date:d, text: exact ? fmtDate(d) : monthTxt};
}
function planningCardInfo(type, ligne, ref){
  var today = todayStr();
  if(type==='metro'){
    var ms = metroOverall([ligne]);
    var nextM = bySecteur(DATA.planning).filter(function(p){ return p.type==='metro' && p.ligne===ligne && p.echeance && p.echeance>today; })
      .sort(function(a,b){ return a.echeance.localeCompare(b.echeance); })[0];
    var linesM = [];
    if(ms.level==='neutral') return {level:'neutral', label:'Aucune donnée', lines: nextM? ['Prochaine vérif. : '+fmtDate(nextM.echeance)] : []};
    if(ms.late) linesM.push(ms.late+' instrument'+(ms.late>1?'s':'')+' hors validité');
    else if(ms.urgent) linesM.push(ms.urgent+' expire'+(ms.urgent>1?'nt':'')+' ce mois');
    else if(ms.warn) linesM.push(ms.warn+' à prévoir le mois prochain');
    if(nextM) linesM.push('Prochaine vérif. : '+fmtDate(nextM.echeance));
    var lbl = ms.level==='danger'?'En retard':ms.level==='urgent'?'Expire ce mois':ms.level==='warn'?'À prévoir':'À jour';
    return {level: ms.level==='urgent'?'warn':ms.level, label:lbl, lines:linesM};
  }
  var items = bySecteur(DATA.planning).filter(function(p){
    if(p.type!==type || p.ligne!==ligne || !p.echeance) return false;
    if(ref) return !p.ref || p.ref===ref;
    return true;
  }).sort(function(a,b){ return a.echeance.localeCompare(b.echeance); });
  var due = items.filter(function(p){ return p.echeance<today; });   // le jour J n'est pas encore un retard
  var next = items.filter(function(p){ return p.echeance>=today && !planningIsDone(p, ref); })[0] || null;
  var last = lastRecordLabel(type, ligne, ref);
  var lines = [];
  var lastWord = type==='labo' ? 'Dernier relevé' : 'Dernier audit';
  if(due.length){
    var latest = due[due.length-1];
    var missed = due.slice(0,-1).filter(function(p){ return !planningIsDone(p, ref); }).length;
    if(planningIsDone(latest, ref)){
      if(last) lines.push(lastWord+' : '+last.text);
      if(next){ var dn = daysLabel(next.echeance); lines.push('Prochaine : '+fmtDate(next.echeance)+(dn?' · '+dn.text:'')); }
      return {level:'ok', label:'À jour', lines:lines, missed:missed};
    }
    var dl = daysLabel(latest.echeance);
    lines.push('Échéance '+fmtDate(latest.echeance)+(dl?' · '+dl.text:''));
    lines.push(last ? lastWord+' : '+last.text : (type==='labo'?'Aucun relevé saisi':'Aucun audit saisi'));
    return {level:'danger', label:'En retard', lines:lines, missed:missed, echeance:latest.echeance, entry:latest};
  }
  if(next){
    var dn2 = daysLabel(next.echeance);
    if(last) lines.push(lastWord+' : '+last.text);
    lines.push('Prochaine : '+fmtDate(next.echeance)+(dn2?' · '+dn2.text:''));
    return {level: dn2 && dn2.d<=14 ? 'warn' : 'neutral', label: dn2 && dn2.d<=14 ? 'À venir' : 'Planifié', lines:lines, missed:0};
  }
  if(last){
    // Aucune échéance planifiée : on se base sur le rythme mensuel des relevés
    var prev = new Date(); prev.setDate(1); prev.setMonth(prev.getMonth()-1);
    var prevKey = monthKeyOf(prev.getFullYear(), prev.getMonth());
    var fresh = last.key>=prevKey;
    lines.push(lastWord+' : '+last.text);
    if(!fresh) lines.push('Rien de saisi depuis');
    return {level: fresh?'ok':'danger', label: fresh?'À jour':'En retard', lines:lines, missed:0};
  }
  return {level:'neutral', label:'Aucune donnée', lines:[], missed:0};
}

// ---------- scoring audits propreté (seuils IATF : 85% attention, 50% danger) ----------
var SCORE_ATTENTION = 85, SCORE_DANGER = 50;
function scoreLevel(score){
  if(score===null||score===undefined) return 'neutral';
  return score>=SCORE_ATTENTION ? 'ok' : score>=SCORE_DANGER ? 'warn' : 'danger';
}
function scoreCellClass(score){
  var lvl = scoreLevel(score);
  return lvl==='ok'?'sc-ok':lvl==='warn'?'sc-warn':lvl==='danger'?'sc-danger':'';
}
function checklistKeyForLigne(ligne){ return ligne==='MCU3' ? 'MCU3' : 'MCU1_MCU2'; }
function computeAuditScore(itemsResult){
  var ok=0, ng=0;
  Object.keys(itemsResult).forEach(function(id){
    var r = itemsResult[id].result;
    if(r==='OK') ok++; else if(r==='NG') ng++;
  });
  var total = ok+ng;
  return {ok:ok, ng:ng, total:total, score: total? Math.round((ok/total)*100) : null};
}
function contaminationThreshold(produit){ return /^162R/.test(produit||'') ? 2 : 3; }
function ateqLastByLine(ligne){

// ---------- file handling ----------
function readImageResized(file){
  return new Promise(function(resolve, reject){
    var reader = new FileReader();
    reader.onload = function(ev){
      var img = new Image();
      img.onload = function(){
        var maxDim=900, w=img.width, h=img.height;
        if(w>h && w>maxDim){ h=Math.round(h*maxDim/w); w=maxDim; }
        else if(h>=w && h>maxDim){ w=Math.round(w*maxDim/h); h=maxDim; }
        var canvas=document.createElement('canvas');
        canvas.width=w; canvas.height=h;
        canvas.getContext('2d').drawImage(img,0,0,w,h);
        resolve(canvas.toDataURL('image/jpeg',0.62));
      };
      img.onerror = reject;
      img.src = ev.target.result;
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}
function readFilePlain(file){
  return new Promise(function(resolve, reject){
    if(file.size > 1500000){ reject(new Error('Fichier trop volumineux (max 1.5 Mo). Compressez-le avant import.')); return; }
    var reader = new FileReader();
    reader.onload = function(ev){ resolve(ev.target.result); };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}
async function fileFromInput(input, isImage){
  if(!input || !input.files || !input.files[0]) return null;
  var f = input.files[0];
  return isImage ? readImageResized(f) : readFilePlain(f);
}

var auditImportPreview = null; // {ligne, date, auditeur, service, items:{id:{result,remarque,action}}, score, ok, ng, unmatched}

function normResult(v){
  if(v===null || v===undefined) return '';
  var s = String(v).trim().toUpperCase();
  if(s==='OK') return 'OK';
  if(s==='NG'||s==='N/G'||s==='NOK'||s==='NON CONFORME') return 'NG';
  if(s==='NA'||s==='N/A') return 'NA';
  return '';
}
function excelCellToDateStr(v){
  if(v===null || v===undefined || v==='') return todayStr();
  if(v instanceof Date && !isNaN(v.getTime())) return fmtISOLocal(v);
  if(typeof v==='number'){
    // Numéro de série Excel (au cas où cellDates n'a pas converti)
    var d = new Date(Math.round((v-25569)*86400*1000));
    if(!isNaN(d.getTime())) return fmtISOLocal(d);
  }
  var s = String(v).trim();
  var m = s.match(/^(\d{1,2})[\/\-](\d{1,2})[\/\-](\d{2,4})/);
  if(m){
    var day=Number(m[1]), month=Number(m[2]), year=Number(m[3]); if(year<100) year+=2000;
    return fmtISOLocal(new Date(year, month-1, day));
  }
  m = s.match(/^(\d{4})-(\d{2})-(\d{2})/);
  if(m) return m[0].slice(0,10);
  return todayStr();
}

function handleImportAuditExcelFile(file){
  if(typeof XLSX==='undefined'){ uiAlert('La librairie de lecture Excel n\'a pas pu être chargée (connexion internet requise). Réessayez.'); return; }
  var reader = new FileReader();
  reader.onload = function(e){
    try{
      var data = new Uint8Array(e.target.result);
      var wb = XLSX.read(data, {type:'array', cellDates:true});
      var result = parseAuditWorkbook(wb);
      if(!result){ uiAlert('Fichier non reconnu. Attendu : un export du modèle "Audit propreté MCU1/MCU2" ou "Audit propreté MCU3".'); return; }
      auditImportPreview = result;
      render();
    }catch(err){
      console.error('Import audit error', err);
      uiAlert('Erreur lors de la lecture du fichier : '+err.message);
    }
  };
  reader.readAsArrayBuffer(file);
}

function parseAuditWorkbook(wb){
  var sheetNames = wb.SheetNames;
  var sheet12 = sheetNames.find(function(n){ return /mcu1.*mcu2|mcu2.*mcu1/i.test(n); });
  var sheet3 = sheetNames.find(function(n){ return /^mcu3$/i.test(n.trim()); });

  var ws, key, rowStart, rowEnd, colLigne, colResult, colRemarque, colAction, ligneFixed;
  if(sheet12){
    ws = wb.Sheets[sheet12]; key = 'MCU1_MCU2'; rowStart = 13; rowEnd = 50;
    colResult = 'F'; colRemarque = 'G'; colAction = 'H'; ligneFixed = null;
  } else if(sheet3){
    ws = wb.Sheets[sheet3]; key = 'MCU3'; rowStart = 13; rowEnd = 42;
    colResult = 'D'; colRemarque = 'E'; colAction = 'F'; ligneFixed = 'MCU3';
  } else {
    return null;
  }

  function cell(addr){ var c = ws[addr]; return c ? c.v : undefined; }

  var ligneRaw = ligneFixed || cell('C3');
  var ligne = ligneFixed;
  if(!ligne){
    var s = String(ligneRaw||'').toUpperCase();
    if(s.indexOf('1')>=0) ligne = 'MCU1';
    else if(s.indexOf('2')>=0) ligne = 'MCU2';
    else ligne = 'MCU1';
  }
  var auditeur = String(cell('C4')||'').trim();
  var service = String(cell('C5')||'').trim();
  var date = excelCellToDateStr(cell('C6'));

  var checklistItems = DATA.checklist[key]||[];
  var items = {};
  var unmatched = 0;
  for(var i=0; i<checklistItems.length; i++){
    var row = rowStart + i;
    if(row>rowEnd){ unmatched++; continue; }
    var it = checklistItems[i];
    var resultRaw = cell(colResult+row);
    var remarque = cell(colRemarque+row);
    var action = cell(colAction+row);
    items[it.id] = {
      result: normResult(resultRaw),
      remarque: remarque!==undefined && remarque!==null ? String(remarque).trim() : '',
      action: action!==undefined && action!==null ? String(action).trim() : '',
      photo: null
    };
  }

  var sc = computeAuditScore(items);
  return {
    sheetType: key, ligne: ligne, date: date, auditeur: auditeur, service: service,
    items: items, score: sc.score, ok: sc.ok, ng: sc.ng, total: sc.total, unmatched: unmatched
  };
}

async function handleSaveAudit(fromImport){
  var w = auditWizard;
  var sc = computeAuditScore(w.items);
  var key = checklistKeyForLigne(w.ligne);
  var itemsArr = (DATA.checklist[key]||[]).map(function(it){
    var st = w.items[it.id] || {result:'', remarque:'', action:'', photo:null};
    return {poste:it.poste, critere:it.critere, result:st.result, remarque:st.remarque, action:st.action, photo:st.photo||null};
  });
  var record = {id:uid('paud'), ligne:w.ligne, date:w.date, auditeur:w.auditeur, service:w.service, score:sc.score, ok:sc.ok, ng:sc.ng, items:itemsArr};
  if(fromImport) record.source = 'import';
  DATA.propAudits.push(record);
  await save('propAudits');
  var annee = Number(w.date.split('-')[0]);
  var moisLabel = MONTHS_FR[Number(w.date.split('-')[1])-1];
  moisLabel = moisLabel.charAt(0).toUpperCase()+moisLabel.slice(1);
  await recomputeResultatMois(w.ligne, moisLabel, annee);

  // pousser les NC dans le plan d'actions unifié
  var created = 0;
  Object.keys(w.items).forEach(function(critId){
    var st = w.items[critId];
    if(st.result==='NG'){
      var crit = (DATA.checklist[key]||[]).find(function(c){return c.id===critId;});
      DATA.actions.push({
        id: uid('act'), origine:'Propreté', description:(crit?crit.critere:'Non-conformité')+(crit&&crit.poste!=='Général'?' ('+crit.poste+')':'')+(st.remarque?' - '+st.remarque:''),
        ligne:w.ligne, responsable:st.responsable||'', echeance:st.echeance||null, statut:'planifiee', dateCreation:todayStr(), photo:st.photo||null
      });
      created++;
    }
  });
  if(created) await save('actions');

  auditWizard = null;
  logChange('Propreté', fromImport?'Audit importé (Excel)':'Audit réalisé', w.ligne+' - score '+(sc.score!==null?sc.score+'%':'n/a'));
  uiAlert((fromImport?'Audit importé et enregistré':'Audit enregistré')+(sc.score!==null? ' - score '+sc.score+'%.':' (aucun critère renseigné).')+' '+created+' non-conformité(s) ajoutée(s) au plan d\'actions.');
  render();
}
async function recomputeResultatMois(ligne, moisLabel, annee){
  var audits = DATA.propAudits.filter(function(a){
    if(a.ligne!==ligne || a.score===null || a.score===undefined) return false;
    var d = a.date.split('-');
    var aMois = MONTHS_FR[Number(d[1])-1]; aMois = aMois.charAt(0).toUpperCase()+aMois.slice(1);
    return aMois===moisLabel && Number(d[0])===annee;
  });
  var existing = DATA.resultats.find(function(r){ return r.ligne===ligne && r.mois===moisLabel && (r.annee===annee || r.annee===undefined); });
  if(!audits.length){
    if(existing){ DATA.resultats = DATA.resultats.filter(function(r){ return r!==existing; }); await save('resultats'); }
    return;
  }
  var avg = Math.round(audits.reduce(function(s,a){return s+a.score;},0)/audits.length);
  if(existing){ existing.resultatPct = avg; existing.annee = annee; }
  else { DATA.resultats.push({id:uid('ra'), ligne:ligne, mois:moisLabel, resultatPct:avg, annee:annee}); }
  await save('resultats');
}
async function handleDeleteAudit(id){
  var a = DATA.propAudits.find(function(x){ return x.id===id; });
  if(!a) return;
  if(!await uiConfirm('Supprimer cet audit propreté ? Le résultat du mois sera recalculé sur la base des audits restants.')) return;
  DATA.propAudits = DATA.propAudits.filter(function(x){ return x.id!==id; });
  await save('propAudits');
  var d = a.date.split('-');
  var moisLabel = MONTHS_FR[Number(d[1])-1]; moisLabel = moisLabel.charAt(0).toUpperCase()+moisLabel.slice(1);
  await recomputeResultatMois(a.ligne, moisLabel, Number(d[0]));
  logChange('Propreté', 'Suppression audit', a.ligne+' - '+fmtDate(a.date));
  openAuditDetailId = null;
  render();
}
