// ===== RESULTATS AUDITS (%) - navigation par mois + récap annuel + graphiques =====
function monthRecapValue(ligne, monthIdx, year){
  var moisLabel = MONTHS_FR[monthIdx].charAt(0).toUpperCase()+MONTHS_FR[monthIdx].slice(1);
  var vals = [];
  // Audits de la grille (score calculé, datés précisément)
  DATA.propAudits.forEach(function(a){
    if(a.ligne!==ligne || a.score===null || a.score===undefined) return;
    var d = a.date.split('-');
    if(Number(d[0])===year && Number(d[1])-1===monthIdx) vals.push(a.score);
  });
  // Résultats saisis manuellement (hebdo ou mensuels)
  var manual = DATA.resultats.filter(function(r){
    return r.ligne===ligne && r.mois===moisLabel && (r.annee===year || r.annee===undefined) && r.resultatPct!==null && r.resultatPct!==undefined;
  });
  manual.forEach(function(r){ vals.push(r.resultatPct); });
  if(!vals.length) return null;
  var n = vals.length;
  var source = (DATA.propAudits.some(function(a){var d=a.date.split('-');return a.ligne===ligne&&Number(d[0])===year&&Number(d[1])-1===monthIdx&&a.score!==null;}))
    ? 'audits' : 'historique';
  return {val: Math.round(vals.reduce(function(s,v){return s+v;},0)/n), source:source, n:n};
}
function weeksOfMonth(year, monthIdx){
  var weeks = [];
  var d = new Date(year, monthIdx, 1);
  while(d.getMonth()===monthIdx){
    var info = isoWeekInfo(fmtISOLocal(d));
    if(!weeks.some(function(w){return w.year===info.year && w.week===info.week;})) weeks.push(info);
    d.setDate(d.getDate()+1);
  }
  return weeks;
}

    var wk = isoWeekMondayDate(info.year, info.week);
    html += '<tr><td class="tiny">S'+info.week+' <span style="color:var(--text-faint);">('+fmtDateShort(wk)+')</span></td>';
    LINES.forEach(function(l){
      var auditsThisWeek = DATA.propAudits.filter(function(a){
        if(a.ligne!==l || a.score===null || a.score===undefined) return false;
        var ai = isoWeekInfo(a.date);
        return ai.year===info.year && ai.week===info.week;
      });
      // Résultats manuels de cette semaine
      var moisLabel2 = MONTHS_FR[resultsMonthView].charAt(0).toUpperCase()+MONTHS_FR[resultsMonthView].slice(1);
      var manualThisWeek = DATA.resultats.filter(function(r){
        return r.ligne===l && r.mois===moisLabel2 && r.semaine===info.week &&
          (r.annee===resultsYear || r.annee===undefined) && r.resultatPct!==null && r.resultatPct!==undefined;
      });
      var allVals = auditsThisWeek.map(function(a){return a.score;}).concat(manualThisWeek.map(function(r){return r.resultatPct;}));
      if(!allVals.length){ html += '<td class="c-empty">-</td>'; return; }
      var avgScore = Math.round(allVals.reduce(function(s,v){return s+v;},0)/allVals.length);
      var label = allVals.length>1 ? avgScore+'% ('+allVals.length+')' : avgScore+'%';
      if(auditsThisWeek.length){
        var linkId = auditsThisWeek[0].id;
        html += '<td class="score-cell '+scoreCellClass(avgScore)+'" data-action="view-audit" data-id="'+linkId+'" title="'+auditsThisWeek.length+' audit(s) + '+manualThisWeek.length+' saisie(s) manuelle(s)">'+label+'</td>';
      } else {
        // Saisie manuelle uniquement : cliquable pour SUPPRIMER
        html += '<td class="score-cell '+scoreCellClass(avgScore)+'" data-action="delete-manual-result" data-id="'+manualThisWeek[0].id+'" title="Saisie manuelle S'+info.week+' - cliquer pour supprimer">'+label+'</td>';
      }
    });
    html += '</tr>';
  });
  html += '</tbody></table></div>';
  return html;
}

function isoWeekInfo(dateStr){
  var d = new Date(dateStr+'T00:00:00');
  var dayNr = (d.getDay()+6)%7;
  d.setDate(d.getDate()-dayNr+3);
  var firstThursday = d.getTime();
  var jan4 = new Date(d.getFullYear(),0,4);
  var jan4Day = (jan4.getDay()+6)%7;
  jan4.setDate(jan4.getDate()-jan4Day+3);
  var week = 1+Math.round((firstThursday-jan4.getTime())/(7*24*3600*1000));
  return {year:d.getFullYear(), week:week};
}
function isoWeeksInYear(year){
  var p = function(y){ var d=new Date(y,0,1); var dow=d.getDay(); return dow===4 || (dow===3 && (y%4===0 && (y%100!==0||y%400===0))); };
  return p(year)? 53 : 52;
}
function isoWeekMondayDate(year, week){
  var jan4 = new Date(year,0,4);
  var jan4Day = (jan4.getDay()+6)%7;
  var monday1 = new Date(jan4.getTime()); monday1.setDate(jan4.getDate()-jan4Day);
  var target = new Date(monday1.getTime()); target.setDate(monday1.getDate()+(week-1)*7);
  return fmtISOLocal(target);
}

function retestDeadline(c){
  // Deadline = 15 du mois suivant le NC
  var m = c.mois + 1, y = c.annee;
  if(m > 11){ m = 0; y++; }
  return y + '-' + String(m+1).padStart(2,'0') + '-15';

async function handleDeleteCollecte(id){
  var c = DATA.contamination.find(function(x){ return x.id===id; });
  if(!c) return;
  if(!await uiConfirm('Supprimer cette collecte ('+c.ligne+' · '+c.ref+') ?\nL\'échéance planning associée sera remise en statut Planifié ou En retard.')) return;

  // Retrouver l'échéance planning associée et annuler sa réalisation
  // Seules les échéances cochées automatiquement par une ancienne version (collecte) sont annulées
  var echeance = bySecteur(DATA.planning).filter(function(p){ return p.type==='labo' && p.ligne===c.ligne && (p.ref||null)===(c.ref||null) && (p.autoCreated || p.collecteId) && p.realisation && c.collecteDate && p.realisation===c.collecteDate; })[0] || null;
  if(echeance && echeance.realisation){
    if(echeance.autoCreated){
      // L'échéance avait été créée par la collecte → on la supprime entièrement
      DATA.planning = DATA.planning.filter(function(p){ return p.id!==echeance.id; });
    } else {
      // L'échéance préexistait → on enlève juste la date de réalisation
      delete echeance.realisation;
    }
    await save('planning');
    logChange('Planning', 'Réalisation annulée (suppression collecte)', c.ligne+' · '+c.ref);
  }

  DATA.contamination = DATA.contamination.filter(function(x){ return x.id!==id; });
  await save('contamination');
  logChange('Contamination', 'Suppression collecte', c.ligne+' · '+c.ref+' - collecté le '+fmtDate(c.collecteDate));
  render();
}

    '<button class="btn primary" data-action="close-contam-detail">Fermer</button></div>';
  html += '</div></div>';

}

var VIDANGE_INTERVALLE = 90;
function vidangeStatus(v){
  var next = addDays(v.derniereVidange, v.intervalle||VIDANGE_INTERVALLE);
  var d = daysBetween(todayStr(), next);
  if(d<0) return {level:'danger', label:'En retard', next:next};
  if(d<=14) return {level:'warn', label:'À prévoir', next:next};
  return {level:'ok', label:'À jour', next:next};
}
function addDays(dateStr, n){
  var p = dateStr.split('-').map(Number);
  var d = new Date(p[0], p[1]-1, p[2]);
  d.setDate(d.getDate()+n);
  return fmtISOLocal(d);
}

var RELEVES_BAINS = ['Bain 1','Bain 2'];
// Couleur propre à chaque bain (onglets de saisie, en-têtes de colonnes) : on voit tout de suite sur quel bain on travaille
var BAIN_COLORS = {'Bain 1':'#2F6FB0', 'Bain 2':'#8A4FB5'};
function bainColor(b){ return BAIN_COLORS[b] || '#5A6B7B'; }
function bainHeader(b){ return '<th style="text-align:center;"><span class="bain-chip" style="--bain:'+bainColor(b)+';">'+esc(b)+'</span></th>'; }
function chlorureConcentrationRange(bain){
  return bain==='Bain 2' ? {min:1, max:3} : {min:1.5, max:3.5};
}
function chlorureStatus(r){
  if(r.concentration===null || r.concentration===undefined || r.chlorureMg===null || r.chlorureMg===undefined) return {level:'neutral', label:'-'};
  var range = chlorureConcentrationRange(r.bain);
  var okConc = r.concentration>=range.min && r.concentration<=range.max;
  var okCl = r.chlorureMg<=200;
  if(okConc && okCl) return {level:'ok', label:'Conforme'};
  return {level:'danger', label:'Non conforme'};
}
function masseStatus(r){
  if(r.masseMg===null || r.masseMg===undefined) return {level:'neutral', label:'-'};
  return r.masseMg<7.5 ? {level:'ok', label:'Conforme'} : {level:'danger', label:'Non conforme'};
}
function releveMondayOf(dateStr){
  var d = new Date(dateStr+'T00:00:00Z');
  var day = d.getUTCDay() || 7;            // lundi = 1 ... dimanche = 7
  d.setUTCDate(d.getUTCDate() - day + 1);
  return d.toISOString().slice(0,10);
}
// Lundis des semaines ISO de l'année : la semaine 1 peut commencer fin décembre de l'année précédente
// (ex. 2026 : S1 commence le lundi 29/12/2025), et l'année peut compter 53 semaines.
function mondaysOfYear(year){
  var out = [];
  var d = new Date(releveMondayOf(year+'-01-04')+'T00:00:00Z'); // le 4 janvier est toujours en semaine 1
  while(isoWeekInfo(d.toISOString().slice(0,10)).year===year){
    out.push(d.toISOString().slice(0,10));
    d.setUTCDate(d.getUTCDate()+7);
  }
  return out;
}
// Date "de rangement" d'un relevé dans le tableau : lundi de la semaine (chlorure) ou 1er du mois (masses)
function releveCanonicalDate(type, dateStr){
  if(!dateStr) return dateStr;
  return type==='chlorure' ? releveMondayOf(dateStr) : dateStr.slice(0,7)+'-01';
}
function releveFind(type, bain, date){
  return DATA.releves.find(function(x){ return x.type===type && x.bain===bain && releveCanonicalDate(type, x.date)===date && (x.secteur||'MCU')===currentSecteur; });
}
var releveYear = null;
var releveMonthView = null;      // mois affiché dans le détail chlorure (0-11)
// Lundis des semaines qui touchent le mois (comme le détail des audits : une semaine à cheval apparaît dans les deux mois)
function releveWeeksOfMonth(year, monthIdx){
  var first = year+'-'+String(monthIdx+1).padStart(2,'0')+'-01';
  var last = year+'-'+String(monthIdx+1).padStart(2,'0')+'-'+String(daysInMonth(year, monthIdx)).padStart(2,'0');
  var out = [], d = releveMondayOf(first);
  while(d<=last){ out.push(d); d = addDays(d, 7); }
  return out;
}

var releveDirectPrefill = null;   // {bain, date, ...valeurs existantes} pour pre-remplir le formulaire

function proprReleves(){
  if(releveYear===null) releveYear = Number(todayStr().split('-')[0]);

  html += '<div style="display:flex; justify-content:space-between; align-items:baseline; margin-bottom:8px;"><div class="eyebrow">Masses polluantes - Tableau de suivi '+year+' (seuil &lt; 7,5mg)</div><button class="btn small" data-action="add-releve-direct" data-type="masse">+ Saisie directe</button></div>';
  html += '<div class="table-wrap" style="margin-bottom:24px;"><table class="annual-table"><thead><tr><th>Mois</th>'+RELEVES_BAINS.map(bainHeader).join('')+'</tr></thead><tbody>';
  for(var m=0; m<12; m++){
    var monthDate = year+'-'+String(m+1).padStart(2,'0')+'-01';
    var monthKey = year+'-'+String(m+1).padStart(2,'0');

    RELEVES_BAINS.forEach(function(bain){

        return;
      }
      var s = masseStatus(r);
      var cls = s.level==='danger'?'sc-danger':s.level==='ok'?'sc-ok':'';
      html += '<td class="score-cell '+cls+'" data-action="releve-cell-edit" data-type="masse" data-id="'+r.id+'">'+r.masseMg+'mg</td>';
    });
    html += '</tr>';
  }

// Changement de bain dans la fenêtre : on charge le relevé existant de ce bain pour la même période, sinon on garde ce qui a été tapé
function releveSwitchBain(type, bain, keepTyped){
  var dEl = document.getElementById('rd-date');

async function handleSaveReleveDirect(type, nextBain){
  var bain = document.getElementById('rd-bain').value;
  var dateSaisie = document.getElementById('rd-date').value || todayStr();
  var date = releveCanonicalDate(type, dateSaisie);
  var editId = releveDirectPrefill && releveDirectPrefill.editId;
  var r = editId ? DATA.releves.find(function(x){return x.id===editId;}) : null;
  // Un seul relevé par bain et par période : on met à jour l'existant au lieu de créer un doublon invisible
  var existing = releveFind(type, bain, date);
  if(existing && existing!==r){
    if(r){ DATA.releves = DATA.releves.filter(function(x){ return x.id!==r.id; }); }
    r = existing;
  }
  if(type==='chlorure'){
    var concStr = document.getElementById('rd-concentration').value;
    var clStr = document.getElementById('rd-chlorure').value;
    if(concStr===''||clStr===''){ toast('Merci de renseigner la concentration et le chlorure.','error'); return; }
    if(!r){ r = {id:uid('releve'), type:'chlorure', secteur:currentSecteur}; DATA.releves.push(r); }
    r.bain = bain; r.date = date; r.dateReleve = dateSaisie; r.concentration = parseFloat(concStr); r.chlorureMg = parseFloat(clStr);
  } else {
    var masseStr = document.getElementById('rd-masse').value;
    if(masseStr===''){ toast('Merci de renseigner la masse polluante.','error'); return; }
    if(!r){ r = {id:uid('releve'), type:'masse', secteur:currentSecteur}; DATA.releves.push(r); }
    r.bain = bain; r.date = date; r.dateReleve = dateSaisie; r.masseMg = parseFloat(masseStr);
  }
  await save('releves');
  logChange('Propreté', 'Relevé MCU0', bain+' - '+fmtDate(date));
  toast(bain+' enregistré.');
  if(nextBain){
    var ex2 = releveFind(type, nextBain, date);
    releveDirectPrefill = ex2 ? Object.assign({editId:ex2.id}, ex2) : {bain:nextBain, date:dateSaisie};
    releveDirectFormOpen = type;
    render(); focusReleveModal();
    return;
  }
  releveDirectFormOpen = false;
  releveDirectPrefill = null;
  render();
}
async function handleDeleteReleveDirect(id){
  if(!await uiConfirm('Supprimer ce relevé ?')) return;
  DATA.releves = DATA.releves.filter(function(x){return x.id!==id;});
  await save('releves');
  releveDirectFormOpen = false;
  releveDirectPrefill = null;
  toast('Relevé supprimé.');
  render();
}

var ACTION_STATUSES = [['planifiee','Planifiée'],['realisee','Réalisée'],['verifiee','Vérifiée'],['perennisee','Pérennisée'],['non_prise_en_compte','Non prise en compte'],['abandonnee','Abandonnée']];
var actionsViewAll = false; // toggle vue globale multi-secteurs
// ---------- SUIVI DES ACTIONS (fenêtre tableau de bord + fiche action) ----------
var actionsPanelFilter = 'all';   // all | late | encours | realisee | cloturee | abandon | incomplete
var actionsPanelScope = 'secteur'; // secteur | all (comptes multi-secteurs)
var actionsPanelResp = '';
var actionDetailId = null;        // id | 'new'
var actionDraft = null;           // pré-remplissage d'une nouvelle action (ex. créée depuis la prison qualité)
var VERIF_DELAI_JOURS = 30;
function addDays(dateStr, n){ var d = new Date(dateStr+'T00:00:00'); d.setDate(d.getDate()+n); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function actionPanelCategory(a){
  if(isActionLate(a)) return 'late';
  if(a.statut==='realisee') return a.sansVerif ? 'cloturee' : 'realisee';  // action ponctuelle : close dès sa réalisation
  if(a.statut==='verifiee' || a.statut==='perennisee') return 'cloturee';
  if(a.statut==='abandonnee' || a.statut==='non_prise_en_compte') return 'abandon';
  return 'encours';
}
// n°1 : action en cours sans échéance ou sans responsable (elle ne pourrait jamais apparaître "en retard")
function isActionIncomplete(a){
  var c = actionPanelCategory(a);
  return (c==='encours' || c==='late') && (!a.echeance || !(a.responsable||'').trim());
}
// n°2 : vérification d'efficacité dépassée
function isVerifLate(a){ return a.statut==='realisee' && !a.sansVerif && a.verifPrevue && a.verifPrevue < todayStr(); }
// Règles appliquées à chaque changement de statut (fiche, onglet, partout)
function applyActionStatusTransition(a, oldStatut, newStatut){
  if(newStatut==='realisee' && oldStatut!=='realisee'){
    a.dateRealisation = todayStr();
    if(a.sansVerif) a.verifPrevue = null;
    else if(!a.verifPrevue) a.verifPrevue = addDays(todayStr(), VERIF_DELAI_JOURS);
  }
  if((newStatut==='verifiee' || newStatut==='perennisee') && !a.dateVerification) a.dateVerification = todayStr();
  if(oldStatut && oldStatut!==newStatut){
    a.suivi = a.suivi || [];
    a.suivi.push({date:todayStr(), auteur:currentUser?currentUser.displayName:'', texte:'Statut : '+actionStatusMeta(oldStatut).label+' → '+actionStatusMeta(newStatut).label});
  }
}
var ACTION_PANEL_FILTERS = [
  ['all','Toutes','neutral'], ['late','En retard','danger'], ['encours','En cours','warn'],
  ['realisee','Réalisées · à vérifier','ok'], ['cloturee','Vérifiées / pérennisées','ok'], ['abandon','Abandonnées','neutral']
];
function actionsPanelSource(){
  var multi = userSecteurs().length>1;
  if(multi && actionsPanelScope==='all'){
    var us = userSecteurs();
    return DATA.actions.filter(function(a){ return us.indexOf(a.secteur||'MCU')>=0; });
  }
  return bySecteur(DATA.actions);
}
function actionsPanelSort(a,b){
  var order = {late:0, encours:1, realisee:2, cloturee:3, abandon:4};
  var ca = order[actionPanelCategory(a)], cb = order[actionPanelCategory(b)];
  if(ca!==cb) return ca-cb;
  if(ca===2){ return (a.verifPrevue||'9999').localeCompare(b.verifPrevue||'9999'); }  // vérifications les plus urgentes d'abord
  var ea = a.echeance||'9999', eb = b.echeance||'9999';
  return ca>=3 ? eb.localeCompare(ea) : ea.localeCompare(eb);
}
// Sélection affichée (périmètre + responsable + filtre) : partagée par l'écran et l'export PDF
function actionsPanelSelection(){
  var all = actionsPanelSource();
  var base = actionsPanelResp ? all.filter(function(a){ return (a.responsable||'').trim()===actionsPanelResp; }) : all;
  var rows;
  if(actionsPanelFilter==='all') rows = base;
  else if(actionsPanelFilter==='incomplete') rows = base.filter(isActionIncomplete);
  else rows = base.filter(function(a){ return actionPanelCategory(a)===actionsPanelFilter; });
  var counts = {all:base.length, late:0, encours:0, realisee:0, cloturee:0, abandon:0, incomplete:0, verifLate:0};
  base.forEach(function(a){ counts[actionPanelCategory(a)]++; if(isActionIncomplete(a)) counts.incomplete++; if(isVerifLate(a)) counts.verifLate++; });
  var actives = base.length - counts.abandon;
  return {all:all, base:base, rows:rows.slice().sort(actionsPanelSort), counts:counts, avancement: actives ? Math.round((counts.realisee+counts.cloturee)/actives*100) : null};
}
function actionSourceLabel(a){
  if(a.source && a.source.label) return a.source.label;
  return a.origine && a.origine!=='Suivi des actions' ? a.origine : '';
}
function actionDelayHtml(a){
  var cat = actionPanelCategory(a);
  if(cat==='late' || cat==='encours'){
    var dl = daysLabel(a.echeance);
    return dl ? '<span class="delay-pill delay-'+(cat==='late'?'late':'soon')+'">'+dl.text+'</span>' : '';

  if(cat==='realisee' && a.verifPrevue){
    var d = daysBetween(todayStr(), a.verifPrevue);
    if(d<0) return '<span class="delay-pill delay-late">Vérif. en retard de '+(-d)+' j</span>';
    return '<span class="delay-pill ap-verif-pill">Vérif. '+(d===0?'aujourd\'hui':'dans '+d+' j')+'</span>';
  }
  return '';
}

function actionsStatsFor(list){
  var s = {total:list.length, open:0, late:0, realisee:0, verifLate:0, cloturee:0, abandon:0};
  list.forEach(function(a){
    var c = actionPanelCategory(a);
    if(c==='late'){ s.late++; s.open++; } else if(c==='encours') s.open++;
    else if(c==='realisee') s.realisee++; else if(c==='cloturee') s.cloturee++; else s.abandon++;
    if(isVerifLate(a)) s.verifLate++;
  });
  return s;

function actionsSnapshotTick(){
  if(!currentUser || !DATA.actionsSnapshots) return;

  var sects = {};

  Object.keys(sects).forEach(function(sid){

    if(!snap){ snap = {week:week, secteur:sid}; DATA.actionsSnapshots.push(snap); changed = true; }
    ['total','open','late','realisee','verifLate','cloturee','abandon'].forEach(function(k){ if(snap[k]!==st[k]){ snap[k] = st[k]; changed = true; } });

function renderActionsTrend(allScope){
  var sects = allScope ? userSecteurs() : [currentSecteur];
  var byWeek = {};
  (DATA.actionsSnapshots||[]).forEach(function(s){
    if(sects.indexOf(s.secteur)<0) return;
    var w = byWeek[s.week] || (byWeek[s.week] = {week:s.week, open:0, late:0});
    w.open += s.open||0; w.late += s.late||0;
  });
  var weeks = Object.keys(byWeek).sort().slice(-12).map(function(k){ return byWeek[k]; });
  if(!weeks.length) return '';
  if(weeks.length<2){
    return '<div class="ap-trend ap-trend-empty"><span class="tiny"><b>Évolution :</b> l\'historique démarre cette semaine ('+weeks[0].open+' ouvertes, '+weeks[0].late+' en retard). La courbe apparaîtra dès la semaine prochaine.</span></div>';
  }
  var W = 640, H = 110, pl = 28, pr = 10, pt = 10, pb = 20;
  var max = Math.max(1, Math.max.apply(null, weeks.map(function(w){ return Math.max(w.open, w.late); })));
  var x = function(i){ return pl + (W-pl-pr) * (weeks.length===1?0.5:i/(weeks.length-1)); };
  var y = function(v){ return pt + (H-pt-pb) * (1 - v/max); };
  var line = function(k){ return weeks.map(function(w,i){ return (i?'L':'M')+x(i).toFixed(1)+' '+y(w[k]).toFixed(1); }).join(' '); };
  var dots = function(k, cls){ return weeks.map(function(w,i){ return '<circle class="'+cls+'" cx="'+x(i).toFixed(1)+'" cy="'+y(w[k]).toFixed(1)+'" r="3"><title>'+w.week+' : '+w[k]+'</title></circle>'; }).join(''); };
  var labels = weeks.map(function(w,i){ return '<text x="'+x(i).toFixed(1)+'" y="'+(H-5)+'" text-anchor="middle">'+w.week.split('-')[1]+'</text>'; }).join('');
  return '<div class="ap-trend"><div class="ap-trend-head"><span class="tiny"><b>Évolution sur '+weeks.length+' semaines</b></span>'+
    '<span class="tiny"><i class="ap-lg ap-lg-open"></i>ouvertes <i class="ap-lg ap-lg-late"></i>en retard</span></div>'+
    '<svg viewBox="0 0 '+W+' '+H+'" class="ap-trend-svg" preserveAspectRatio="none">'+
      '<line x1="'+pl+'" y1="'+y(0)+'" x2="'+(W-pr)+'" y2="'+y(0)+'" class="ap-axis"/>'+
      '<text x="'+(pl-4)+'" y="'+(y(max)+4)+'" text-anchor="end">'+max+'</text><text x="'+(pl-4)+'" y="'+(y(0)+4)+'" text-anchor="end">0</text>'+
      '<path d="'+line('open')+'" class="ap-line-open"/><path d="'+line('late')+'" class="ap-line-late"/>'+dots('open','ap-dot-open')+dots('late','ap-dot-late')+labels+
    '</svg></div>';
}

async function handleSaveActionDetail(){
  var isNew = actionDetailId==='new';
  var desc = document.getElementById('ad-desc').value.trim();
  if(!desc){ toast('Merci de décrire l\'action.', 'error'); return; }
  var resp = resolveResponsableFromInputs('ad-resp','ad-resp-autre');
  var a;
  if(isNew){
    var dr = actionDraft || {};
    a = {id:uid('act'), secteur:dr.secteur||currentSecteur, dateCreation:todayStr(), origine: dr.source ? dr.source.typeLabel : 'Suivi des actions', suivi:[]};
    if(dr.source) a.source = dr.source;
  } else {
    a = DATA.actions.find(function(x){ return x.id===actionDetailId; });
  }
  if(!a){ actionDetailId = null; actionDraft = null; render(); return; }
  var oldStatut = isNew ? null : a.statut;
  a.description = desc;
  a.ligne = document.getElementById('ad-ligne').value || null;
  a.responsable = resp || '';
  a.echeance = document.getElementById('ad-echeance').value || null;
  a.critereEfficacite = document.getElementById('ad-critere').value.trim();
  a.verifPrevue = document.getElementById('ad-verif').value || null;
  a.resultatVerif = document.getElementById('ad-resultat').value.trim();
  var sv = !!document.getElementById('ad-sansverif').checked;
  if(!isNew && !!a.sansVerif!==sv){
    a.suivi = a.suivi || [];
    a.suivi.push({date:todayStr(), auteur:currentUser?currentUser.displayName:'', texte: sv ? 'Marquée « sans vérification d\'efficacité » (action ponctuelle)' : 'Vérification d\'efficacité réactivée'});
  }
  a.sansVerif = sv;
  a.sansVerifMotif = sv ? document.getElementById('ad-sansverif-motif').value.trim() : '';
  if(sv) a.verifPrevue = null;
  else if(a.statut==='realisee' && !a.verifPrevue) a.verifPrevue = addDays(a.dateRealisation||todayStr(), VERIF_DELAI_JOURS);
  var newStatut = document.getElementById('ad-statut').value;
  a.statut = newStatut;
  applyActionStatusTransition(a, oldStatut, newStatut);
  var note = document.getElementById('ad-note').value.trim();
  a.suivi = a.suivi || [];
  if(note) a.suivi.push({date:todayStr(), auteur:currentUser?currentUser.displayName:'', texte:note});
  if(isNew) DATA.actions.push(a);
  await save('actions');
  logChange("Plan d'actions", isNew?'Ajout':'Mise à jour', (a.secteur||'')+' · '+desc.slice(0,60));
  toast(isNew? 'Action créée.' : 'Action mise à jour.');
  actionDetailId = null; actionDraft = null;
  render();
}

function esdEcheance(p){ // date d'échéance = date formation + 1 an
  if(!p.dateFormation) return null;
  var d = new Date(p.dateFormation+'T00:00:00');
  d.setFullYear(d.getFullYear()+1);
  return fmtISOLocal(d);
}
function esdStatus(p){
  var ech = esdEcheance(p);
  if(!ech) return {level:'neutral', label:'Sans date'};
  var today = todayStr();
  var curYYYYMM = today.slice(0,7);
  var echYYYYMM = ech.slice(0,7);
  if(ech < today) return {level:'danger', label:'Expirée'};
  if(echYYYYMM === curYYYYMM) return {level:'urgent', label:'Expire ce mois'};
  var d = daysBetween(today, ech);
  if(d <= 60) return {level:'warn', label:'À renouveler'};
  return {level:'ok', label:'À jour'};
}

RENDERERS.esd = function(){
  var list = DATA.esd.slice().sort(function(a,b){ return a.nom.localeCompare(b.nom,'fr',{sensitivity:'base'}); });
  var filtered = esdSearch ? list.filter(function(p){ return p.nom.toLowerCase().includes(esdSearch.toLowerCase()); }) : list;

  var expired = list.filter(function(p){ return esdStatus(p).level==='danger'; }).length;
  var thisMonth = list.filter(function(p){ return esdStatus(p).level==='urgent'; }).length;
  var soon = list.filter(function(p){ return esdStatus(p).level==='warn'; }).length;
  var ok = list.filter(function(p){ return esdStatus(p).level==='ok'; }).length;

  var html = '<div class="section">';
  html += '<div class="grid grid-4" style="margin-bottom:8px;">'+
    '<div class="statcard s-danger"><div class="eyebrow">Expirées</div><div class="val">'+expired+'</div></div>'+
    '<div class="statcard s-urgent"><div class="eyebrow">Expire ce mois</div><div class="val">'+thisMonth+'</div></div>'+
    '<div class="statcard s-warn"><div class="eyebrow">À renouveler (&lt;60j)</div><div class="val">'+soon+'</div></div>'+
    '<div class="statcard"><div class="eyebrow">À jour</div><div class="val">'+ok+'</div></div>'+
  '</div>';
  var nextEsd = list.filter(function(p){ return esdEcheance(p) && esdStatus(p).level!=='danger'; })
    .sort(function(a,b){ return esdEcheance(a).localeCompare(esdEcheance(b)); })[0];
  if(nextEsd){
    html += '<p class="tiny" style="margin-bottom:18px;">Prochaine échéance : <b>'+esc(nextEsd.nom)+'</b> le '+fmtDate(esdEcheance(nextEsd))+'</p>';
  } else {
    html += '<div style="margin-bottom:10px;"></div>';
  }

  html += '<div class="toolbar"><div class="left">'+
    '<input type="text" id="esd-search" placeholder="Rechercher un nom…" value="'+esc(esdSearch)+'" style="width:220px;">'+
    '</div><div style="display:flex; gap:8px;"><button class="btn" data-action="esd-print" title="Exporter en PDF">🖨️ Exporter en PDF</button><button class="btn primary" data-action="new-esd">+ Ajouter une personne</button></div></div>';

  if(esdFormOpen) html += esdForm();

    '<th>Nom</th><th>Dernière formation</th><th>Échéance (1 an)</th><th>Statut</th><th class="row-actions-noprint"></th>'+
  '</tr></thead><tbody>';

  if(!filtered.length){
    html += '<tr><td colspan="5">'+emptyState('Aucune personne trouvée.')+'</td></tr>';
  } else {
    html += filtered.map(function(p){
      if(esdEditId===p.id) return esdEditRow(p);
      var s = esdStatus(p);
      var ech = esdEcheance(p);
      var dl = ech ? daysLabel(ech) : null;
      return '<tr>'+
        '<td style="font-weight:600;">'+esc(p.nom)+'</td>'+
        '<td class="num">'+(p.dateFormation?fmtDate(p.dateFormation):'-')+'</td>'+
        '<td class="num" style="'+(s.level==='danger'?'color:var(--danger);font-weight:700;':'')+'">'+
          (ech?fmtDate(ech):'-')+
          (dl&&s.level!=='ok'?' <span class="tiny">('+dl.text+')</span>':'')+
        '</td>'+
        '<td>'+badge(s.level, s.label)+'</td>'+
        '<td class="row-actions-noprint" style="display:flex; gap:5px; flex-wrap:wrap;">'+
          '<button class="btn small primary" data-action="esd-edit" data-id="'+p.id+'">Renouveler / Modifier</button>'+
          '<button class="btn small danger-outline" data-action="esd-delete" data-id="'+p.id+'">Suppr.</button>'+
        '</td></tr>';
    }).join('');
  }
  html += '</tbody></table></div></div>';
  return html;
};

async function handleSaveEsd(){

async function handleSaveEsdEdit(id){
  var p = DATA.esd.find(function(x){ return x.id===id; });

  var date = document.getElementById('esd-edit-date').value;

async function handleDeleteEsd(id){
  var p = DATA.esd.find(function(x){ return x.id===id; });
  if(!p) return;
  if(!await uiConfirm('Supprimer '+p.nom+' de la liste ESD ?')) return;
  DATA.esd = DATA.esd.filter(function(x){ return x.id!==id; });
  await save('esd');
  logChange('ESD', 'Suppression', p.nom);
  render();
}

// ============ FORMATIONS CI/CL (regleurs formes par poste, par reference) ============
// Modele : chaque enregistrement est {id, ref, poste, nom, dateFormation}.
// La ref determine automatiquement sur quelle(s) ligne(s) elle apparait (REF_CICL_LIGNES).
// 143X et 144P sont communes a MCU1 et MCU2 : comme il n'y a qu'un seul enregistrement
// par personne/poste/ref (pas de duplication par ligne), ajouter une formation sur 144P
// depuis l'onglet MCU1 la fait apparaitre automatiquement dans l'onglet MCU2, et inversement.
var REF_CICL_POSTES = {
  '141P': ['OP1015','OP1020','OP1030','OP1070','OP1080','OP1100','OP1120'],
  '143X-144P': ['OP1015','OP1030','OP1070','OP1080','OP1100','OP1120'],
  '149X': ['OP1015','OP1030','OP1070','OP1080','OP1100','OP1120'],
  '162R': ['OP1015','OP1030','OP1045','OP1059','OP1060','OP1075','OP1076','OP1080','OP1090']
};
var REF_CICL_LABELS = { '143X-144P': '143X / 144P' }; // libellé d'affichage si différent de la clé
function ciclRefLabel(ref){ return REF_CICL_LABELS[ref] || ref; }
var POSTE_BADGE_PALETTE = [
  {bg:'#E6EFEE', fg:'#1F5C5C'}, {bg:'#FBEEDC', fg:'#B8730A'}, {bg:'#FBE7E3', fg:'#B23B2E'},
  {bg:'#E5F3E9', fg:'#2E7D4F'}, {bg:'#EFE6F7', fg:'#7B4FA3'}, {bg:'#E7EEFB', fg:'#3A5FA3'},
  {bg:'#FDECD6', fg:'#C25A00'}, {bg:'#F0EAE0', fg:'#8A6642'}
];
function posteBadgeColor(posteId){
  var hash = 0;
  for(var i=0; i<posteId.length; i++){ hash = (hash*31 + posteId.charCodeAt(i)) & 0xffffffff; }
  var idx = Math.abs(hash) % POSTE_BADGE_PALETTE.length;
  return POSTE_BADGE_PALETTE[idx];
}
var REF_CICL_LIGNES = {
  '141P': ['MCU1'],
  '143X-144P': ['MCU1','MCU2'],
  '149X': ['MCU2'],
  '162R': ['MCU3']
};
var CICL_LIGNE_REFS = {
  MCU1: ['141P','143X-144P'],
  MCU2: ['143X-144P','149X'],
  MCU3: ['162R']
};
var ciclSubTab = 'recap'; // 'recap' | 'MCU1' | 'MCU2' | 'MCU3' | 'personnel'
var ciclFormOpenFor = null; // ref en cours d'ajout, ex. '141P'
var ciclEditId = null;
var ciclSearch = '';
var ciclPersonFormOpen = false;
var ciclPersonEditId = null;
var ciclApplyDates = {}; // personId -> date choisie (evite qu'un re-rendu ne l'ecrase par la date du jour)

function ciclAllRefs(){
  var seen = {}, out = [];
  ['MCU1','MCU2','MCU3'].forEach(function(l){
    CICL_LIGNE_REFS[l].forEach(function(r){ if(!seen[r]){ seen[r]=true; out.push(r); } });
  });
  return out;
}
function ciclApplicableRefs(role, lignes){
  if(role==='pilote') return ciclAllRefs();
  var seen = {}, out = [];
  (lignes||[]).forEach(function(l){
    (CICL_LIGNE_REFS[l]||[]).forEach(function(r){ if(!seen[r]){ seen[r]=true; out.push(r); } });
  });
  return out;
}
async function applyCiclTrainingForPerson(person, dateStr){
  var refs = ciclApplicableRefs(person.role, person.lignes);
  var count = 0;
  refs.forEach(function(ref){
    (REF_CICL_POSTES[ref]||[]).forEach(function(poste){
      var rec = DATA.cicl.find(function(r){ return r.ref===ref && r.poste===poste && r.nom.toLowerCase()===person.nom.toLowerCase(); });
      if(rec){ rec.dateFormation = dateStr; } else { DATA.cicl.push({id:uid('cicl'), ref:ref, poste:poste, nom:person.nom, dateFormation:dateStr}); }
      count++;
    });
  });
  await save('cicl');
  logChange('CI/CL', 'Application formation groupée', person.nom+' ('+(person.role==='pilote'?'Pilote, toutes lignes':'Régleur '+person.lignes.join('+'))+') - '+count+' poste(s) - '+fmtDate(dateStr));
  return count;
}

function ciclEcheance(p){
  if(!p.dateFormation) return null;
  var d = new Date(p.dateFormation+'T00:00:00');
  d.setFullYear(d.getFullYear()+1);
  return fmtISOLocal(d);
}
function ciclStatus(p){
  var ech = ciclEcheance(p);
  if(!ech) return {level:'neutral', label:'Sans date'};
  var today = todayStr();
  if(ech < today) return {level:'danger', label:'Expirée'};
  if(ech.slice(0,7) === today.slice(0,7)) return {level:'urgent', label:'Expire ce mois'};
  if(daysBetween(today, ech) <= 60) return {level:'warn', label:'À renouveler'};
  return {level:'ok', label:'À jour'};
}
function ciclRecordsForRef(ref){
  return DATA.cicl.filter(function(r){ return r.ref===ref; });
}
// Une reference peut etre partagee entre deux lignes (ex. 143X-144P sur MCU1+MCU2).
// Un régleur n'apparait sur cette ligne que si elle fait partie de ses lignes assignees ;
// un pilote (qualifie sur toutes les lignes) reste toujours affiche, quelle que soit la ligne.
function ciclFilterRecordsForLigne(records, ligne){
  return records.filter(function(r){
    var personRecord = DATA.ciclPersons.find(function(p){ return p.nom===r.nom; });
    if(!personRecord) return true; // pas de fiche Personnel associee : on garde par defaut
    if(personRecord.role==='pilote') return true;
    return (personRecord.lignes||[]).indexOf(ligne)>=0;
  });
}
var CICL_STATUS_ORDER = {danger:0, urgent:1, warn:2, ok:3, neutral:4};
function ciclPrintSummary(){
  var lignes = ['MCU1','MCU2','MCU3'];
  var html = '<div class="print-only">';
  lignes.forEach(function(ligne, idx){
    var refs = CICL_LIGNE_REFS[ligne];
    var allRecords = [];
    refs.forEach(function(ref){ allRecords = allRecords.concat(ciclRecordsForRef(ref)); });
    allRecords = ciclFilterRecordsForLigne(allRecords, ligne);
    var byName = {};
    allRecords.forEach(function(r){
      if(!byName[r.nom]) byName[r.nom] = [];
      byName[r.nom].push(r);
    });
    var names = Object.keys(byName).sort(function(a,b){return a.localeCompare(b,'fr',{sensitivity:'base'});});
    html += '<div'+(idx>0?' class="print-page-break"':'')+' style="padding:10px 0;">';
    html += '<h2 style="margin:0 0 10px;">Formations CI/CL - '+ligne+'</h2>';
    if(!names.length){
      html += '<p class="tiny">Aucun régleur formé sur cette ligne.</p>';
    } else {
      html += '<table style="width:100%; border-collapse:collapse;"><thead><tr>'+
        '<th style="text-align:left; border-bottom:2px solid #333; padding:5px 8px;">Nom</th>'+
        '<th style="text-align:left; border-bottom:2px solid #333; padding:5px 8px;">Rôle</th>'+
        '<th style="text-align:left; border-bottom:2px solid #333; padding:5px 8px;">Dernière formation</th>'+
        '<th style="text-align:left; border-bottom:2px solid #333; padding:5px 8px;">Échéance</th>'+
        '<th style="text-align:left; border-bottom:2px solid #333; padding:5px 8px;">Statut</th>'+
      '</tr></thead><tbody>';
      names.forEach(function(nom){
        var recs = byName[nom];
        var personRecord = DATA.ciclPersons.find(function(p){ return p.nom===nom; });
        var roleText = personRecord? (personRecord.role==='pilote'?'Pilote':'Régleur') : '-';
        // Derniere formation : la plus recente parmi ses postes sur cette ligne
        var lastDate = recs.reduce(function(acc,r){ return (r.dateFormation && (!acc || r.dateFormation>acc)) ? r.dateFormation : acc; }, null);
        // Echeance : la plus proche/urgente parmi ses postes sur cette ligne
        var worst = recs.reduce(function(acc,r){
          var lvl = ciclStatus(r).level;
          return (!acc || CICL_STATUS_ORDER[lvl]<CICL_STATUS_ORDER[ciclStatus(acc).level]) ? r : acc;
        }, null);
        var ws = worst? ciclStatus(worst) : {level:'neutral', label:'-'};
        var worstEch = worst? ciclEcheance(worst) : null;
        html += '<tr>'+
          '<td style="padding:5px 8px; border-bottom:1px solid #ddd; font-weight:600;">'+esc(nom)+'</td>'+
          '<td style="padding:5px 8px; border-bottom:1px solid #ddd;">'+esc(roleText)+'</td>'+
          '<td style="padding:5px 8px; border-bottom:1px solid #ddd;">'+(lastDate?fmtDate(lastDate):'-')+'</td>'+
          '<td style="padding:5px 8px; border-bottom:1px solid #ddd;">'+(worstEch?fmtDate(worstEch):'-')+'</td>'+
          '<td style="padding:5px 8px; border-bottom:1px solid #ddd;">'+esc(ws.label)+'</td>'+
        '</tr>';
      });
      html += '</tbody></table>';
    }
    html += '</div>';
  });
  html += '</div>';
  return html;
}

function ciclUncoveredPostes(ligne){
  var refs = CICL_LIGNE_REFS[ligne];
  var uncovered = [];
  refs.forEach(function(ref){
    REF_CICL_POSTES[ref].forEach(function(poste){
      var recs = ciclFilterRecordsForLigne(ciclRecordsForRef(ref).filter(function(r){ return r.poste===poste; }), ligne);
      var hasValid = recs.some(function(r){ return ciclStatus(r).level==='ok' || ciclStatus(r).level==='warn' || ciclStatus(r).level==='urgent'; });
      if(!hasValid) uncovered.push(ref+' / '+poste);
    });
  });
  return uncovered;
}
function ciclRecapView(){
  var html = '';
  ['MCU1','MCU2','MCU3'].forEach(function(ligne){
    var refs = CICL_LIGNE_REFS[ligne];
    var allRecords = [];
    refs.forEach(function(ref){ allRecords = allRecords.concat(ciclRecordsForRef(ref)); });
    allRecords = ciclFilterRecordsForLigne(allRecords, ligne);
    var expired = allRecords.filter(function(p){ return ciclStatus(p).level==='danger'; }).length;
    var urgent = allRecords.filter(function(p){ return ciclStatus(p).level==='urgent'; }).length;
    var warn = allRecords.filter(function(p){ return ciclStatus(p).level==='warn'; }).length;

    // Postes sans personne a jour (aucun enregistrement non expire) -> couverture a risque
    var uncovered = ciclUncoveredPostes(ligne);

    html += '<div class="section card" style="margin-bottom:16px; cursor:pointer;" data-action="cicl-goto-ligne" data-ligne="'+ligne+'">';
    html += '<div style="display:flex; justify-content:space-between; align-items:baseline; flex-wrap:wrap; gap:10px; margin-bottom:10px;">';
    html += '<div class="eyebrow">'+ligne+' <span class="tiny" style="text-transform:none; font-weight:400;">('+refs.join(', ')+')</span></div>';
    html += '<div style="display:flex; gap:16px;">'+
      '<span class="tiny">'+allRecords.length+' formation(s) enregistrée(s)</span>'+
    '</div></div>';
    html += '<div class="grid grid-4">'+
      '<div class="statcard s-danger"><div class="eyebrow">Expirées</div><div class="val">'+expired+'</div></div>'+
      '<div class="statcard s-urgent"><div class="eyebrow">Expire ce mois</div><div class="val">'+urgent+'</div></div>'+
      '<div class="statcard s-warn"><div class="eyebrow">À renouveler</div><div class="val">'+warn+'</div></div>'+
      '<div class="statcard'+(uncovered.length?' s-danger':'')+'"><div class="eyebrow">Postes non couverts</div><div class="val">'+uncovered.length+'</div></div>'+
    '</div>';
    var nextExp = allRecords.filter(function(p){ return ciclEcheance(p) && ciclStatus(p).level!=='danger'; })
      .sort(function(a,b){ return ciclEcheance(a).localeCompare(ciclEcheance(b)); })[0];
    if(nextExp){
      html += '<p class="tiny" style="margin-top:8px;">Prochaine expiration : <b>'+esc(nextExp.nom)+'</b> ('+esc(nextExp.poste)+') le '+fmtDate(ciclEcheance(nextExp))+'</p>';
    }
    if(uncovered.length){
      html += '<p class="tiny" style="margin-top:8px; color:var(--danger);">Aucun régleur à jour sur : '+uncovered.map(esc).join(', ')+'</p>';
    }

    // Personnes concernees par au moins une formation expiree : nom + nombre de postes, pas le detail poste par poste
    var expiredByPerson = {};
    allRecords.forEach(function(r){
      if(ciclStatus(r).level==='danger'){
        expiredByPerson[r.nom] = (expiredByPerson[r.nom]||0)+1;
      }
    });
    var expiredNames = Object.keys(expiredByPerson).sort(function(a,b){ return expiredByPerson[b]-expiredByPerson[a]; });
    if(expiredNames.length){
      html += '<div style="margin-top:12px; padding-top:10px; border-top:1px solid var(--danger-border);">'+
        '<div class="tiny" style="font-weight:700; color:var(--danger); margin-bottom:6px;">Formations expirées à renouveler :</div>'+
        '<div style="display:flex; flex-wrap:wrap; gap:6px;">'+
        expiredNames.map(function(nom){
          var n = expiredByPerson[nom];
          return '<span class="badge b-danger">'+esc(nom)+' - '+n+' poste'+(n>1?'s':'')+'</span>';
        }).join('')+
        '</div></div>';
    }
    html += '</div>';
  });
  html += '<p class="tiny">Cliquez sur une ligne pour voir le détail par référence et poste.</p>';
  return html;
}

function ciclLigneView(ligne){
  var refs = CICL_LIGNE_REFS[ligne];
  var html = '';
  refs.forEach(function(ref){
    var partage = REF_CICL_LIGNES[ref].length>1;
    var records = ciclFilterRecordsForLigne(ciclRecordsForRef(ref), ligne).slice().sort(function(a,b){
      if(a.poste!==b.poste) return a.poste.localeCompare(b.poste);
      var ea = ciclEcheance(a), eb = ciclEcheance(b);
      if(!ea && !eb) return a.nom.localeCompare(b.nom,'fr',{sensitivity:'base'});
      if(!ea) return 1;  // sans date -> en dernier dans le groupe
      if(!eb) return -1;
      return ea.localeCompare(eb); // dans chaque poste : le plus urgent/expire en premier
    });
    html += '<div class="section card" style="margin-bottom:18px;">';
    html += '<div style="display:flex; justify-content:space-between; align-items:baseline; flex-wrap:wrap; gap:8px; margin-bottom:10px;">';
    html += '<div class="eyebrow">Référence '+esc(ciclRefLabel(ref))+
      (partage? ' <span class="tiny" style="text-transform:none; font-weight:400; color:var(--accent);">(commune '+REF_CICL_LIGNES[ref].join(' + ')+')</span>' : '')+
      '</div>';
    html += '<button class="btn small primary" data-action="cicl-new" data-ref="'+ref+'">+ Ajouter un régleur</button>';
    html += '</div>';

    if(ciclFormOpenFor===ref) html += ciclForm(ref);

    if(!records.length){
      html += emptyState('Aucun régleur formé sur cette référence.');
    } else {
      html += '<div class="table-wrap"><table><thead><tr><th>Poste</th><th>Nom</th><th>Dernière formation</th><th>Échéance (1 an)</th><th>Statut</th><th class="row-actions-noprint"></th></tr></thead><tbody>';
      var prevPoste = null;
      html += records.map(function(p){
        if(ciclEditId===p.id){ prevPoste = p.poste; return ciclEditRow(p, ref); }
        var s = ciclStatus(p);
        var ech = ciclEcheance(p);
        var dl = ech ? daysLabel(ech) : null;
        var newGroup = p.poste!==prevPoste;
        prevPoste = p.poste;
        var posteColor = posteBadgeColor(p.poste);
        return '<tr style="'+(newGroup?'border-top:3px solid '+posteColor.fg+';':'')+'">'+
          '<td style="border-left:5px solid '+posteColor.fg+';"><span style="display:inline-block; font-family:var(--mono); font-size:14px; font-weight:800; padding:4px 10px; border-radius:5px; background:'+posteColor.fg+'; color:#fff; letter-spacing:0.02em;">'+esc(p.poste)+'</span></td>'+
          '<td style="font-weight:600;">'+esc(p.nom)+'</td>'+
          '<td class="num">'+(p.dateFormation?fmtDate(p.dateFormation):'-')+'</td>'+
          '<td class="num" style="'+(s.level==='danger'?'color:var(--danger);font-weight:700;':'')+'">'+
            (ech?fmtDate(ech):'-')+(dl&&s.level!=='ok'?' <span class="tiny">('+dl.text+')</span>':'')+
          '</td>'+
          '<td>'+badge(s.level, s.label)+'</td>'+
          '<td class="row-actions-noprint" style="display:flex; gap:5px; flex-wrap:wrap;">'+
            '<button class="btn small primary" data-action="cicl-edit" data-id="'+p.id+'">Renouveler / Modifier</button>'+
            '<button class="btn small danger-outline" data-action="cicl-delete" data-id="'+p.id+'">Suppr.</button>'+
          '</td></tr>';
      }).join('');
      html += '</tbody></table></div>';
    }
    html += '</div>';
  });
  return html;
}

var perfFormOpen = false;
var perfYear = Number(new Date().getFullYear());
RENDERERS.perf = function(){
  var lines = secteurLines();
  var years = [perfYear-1, perfYear, perfYear+1];
  var rs = bySecteur(DATA.perf).filter(function(r){ return r.annee===perfYear; });
  var scored = rs.filter(function(r){ return r.resultatPct!==null && r.resultatPct!==undefined; });
  var moy = scored.length ? Math.round(scored.reduce(function(s,r){return s+r.resultatPct;},0)/scored.length) : null;
  var danger = scored.filter(function(r){ return r.resultatPct<SCORE_DANGER; }).length;
  var attn = scored.filter(function(r){ return r.resultatPct>=SCORE_DANGER && r.resultatPct<SCORE_ATTENTION; }).length;

  var html = '<div class="section">';
  html += '<div class="toolbar"><div class="left"><label class="field" style="flex-direction:row; align-items:center; gap:8px;">Année<select id="perf-year">'+years.map(function(y){return '<option value="'+y+'"'+(y===perfYear?' selected':'')+'>'+y+'</option>';}).join('')+'</select></label></div>'+
    '<button class="btn primary" data-action="new-perf">+ Saisir un audit de perf</button></div>';

  if(perfFormOpen) html += perfForm();

  html += '<div class="grid grid-4" style="margin-bottom:18px;">'+
    '<div class="statcard"><div class="eyebrow">Score moyen '+perfYear+'</div><div class="val" style="color:var(--'+(moy===null?'text':scoreLevel(moy))+');">'+(moy!==null?moy+'%':'-')+'</div></div>'+
    '<div class="statcard s-warn"><div class="eyebrow">En attention</div><div class="val">'+attn+'</div></div>'+
    '<div class="statcard s-danger"><div class="eyebrow">En danger</div><div class="val">'+danger+'</div></div>'+
    '<div class="statcard"><div class="eyebrow">Audits '+perfYear+'</div><div class="val">'+scored.length+'</div></div>'+
  '</div>';

  // Alertes 2 derniers mois
  var curM = Number(todayStr().split('-')[1])-1;
  var prevM = curM===0? 11 : curM-1;
  var recentIdx = [prevM, curM];
  var alerts = scored.filter(function(r){ return r.resultatPct<SCORE_ATTENTION && recentIdx.indexOf(r.mois)>=0; })
    .sort(function(a,b){ return a.resultatPct-b.resultatPct; });
  if(alerts.length){
    html += '<div class="section"><div class="alertlist">'+alerts.map(function(r){
      var lvl = scoreLevel(r.resultatPct);
      var mLabel = MONTHS_FR[r.mois].charAt(0).toUpperCase()+MONTHS_FR[r.mois].slice(1);
      return '<div class="alertitem"><div>'+badge(lvl,'')+'</div><div><div class="txt">'+esc(r.ligne)+' - '+mLabel+' : '+r.resultatPct+'%</div><div class="meta">'+(lvl==='danger'?'Sous le seuil danger':'Sous le seuil attention')+'</div></div></div>';
    }).join('')+'</div></div>';
  }

  // Graphique évolution
  html += '<div class="card" style="margin-bottom:18px;"><div class="eyebrow" style="margin-bottom:8px;">Évolution par ligne - '+perfYear+'</div><div class="chart-box"><canvas id="chart-perf-evol"></canvas></div></div>';

  // Tableau annuel mois × lignes
  html += '<div class="eyebrow" style="margin-bottom:8px;">Tableau annuel - '+perfYear+'</div>';
  html += '<div class="table-wrap"><table class="annual-table"><thead><tr><th>Mois</th>'+lines.map(function(l){return '<th>'+esc(l)+'</th>';}).join('')+'</tr></thead><tbody>';
  MONTHS_FR.forEach(function(mRaw, mIdx){
    var mLabel = mRaw.charAt(0).toUpperCase()+mRaw.slice(1);
    html += '<tr><td>'+mLabel+'</td>';
    lines.forEach(function(l){
      var r = rs.find(function(x){ return x.ligne===l && x.mois===mIdx; });
      if(!r || r.resultatPct===null || r.resultatPct===undefined){ html += '<td class="c-empty">-</td>'; return; }
      html += '<td class="score-cell '+scoreCellClass(r.resultatPct)+'" data-action="perf-delete-cell" data-id="'+r.id+'" title="Cliquer pour supprimer">'+r.resultatPct+'%</td>';
    });
    html += '</tr>';
  });
  html += '</tbody></table></div>';
  html += '<p class="tiny" style="margin-top:8px;">Cliquez sur une cellule pour supprimer le résultat correspondant.</p>';
  html += '</div>';
  return html;
};

    });

    datasets.push({label:'Danger ('+SCORE_DANGER+'%)', data:Array(12).fill(SCORE_DANGER), borderColor:'#B23B2E88', borderWidth:1, borderDash:[6,3], pointRadius:0});

var formationFormOpen = false;
var formationEditId = null;
var formationSearch = '';
function formationEcheance(p){
  if(!p.dateFormation) return null;
  var d = new Date(p.dateFormation+'T00:00:00');
  d.setFullYear(d.getFullYear()+1);

// ---------- PRISON QUALITE (stock de pièces bloquées) ----------
var PRISON_QTY_COLS = [['complet','Complet'],['sansCapot','Sans capot'],['sansPcb','Sans PCB']];
var prisonLotFormOpen = false; // false | 'new' | id du lot en modification
var prisonZoneFilter = '';
function prisonLineTotal(l){ return (Number(l.complet)||0)+(Number(l.sansCapot)||0)+(Number(l.sansPcb)||0); }
function prisonLotTotal(lot){ return (lot.lignes||[]).reduce(function(s,l){ return s+prisonLineTotal(l); },0); }
function prisonWeekKey(dateStr){ var w = isoWeekInfo(dateStr); return w.year+'-S'+String(w.week).padStart(2,'0'); }
// Chaque secteur a sa propre prison qualité (les données historiques sans secteur appartiennent à MCU)
function prisonLotsSect(){ return DATA.prisonLots.filter(function(l){ return (l.secteur||'MCU')===currentSecteur; }); }
function prisonSnapsSect(){ return DATA.prisonSnapshots.filter(function(s){ return (s.secteur||'MCU')===currentSecteur; }); }
function prisonCurrentSnapshotData(){
  var lots = {};
  prisonLotsSect().forEach(function(l){ lots[l.id] = prisonLotTotal(l); });
  var total = Object.keys(lots).reduce(function(s,k){ return s+lots[k]; },0);
  return {total:total, lots:lots};
}
// Une photo du stock par semaine ISO : sert de référence pour le point hebdomadaire
function prisonUpsertSnapshot(dateStr){
  dateStr = dateStr || todayStr();
  var key = prisonWeekKey(dateStr);
  var snap = prisonCurrentSnapshotData();
  var existing = prisonSnapsSect().find(function(s){ return s.week===key; });
  if(existing){ existing.date = dateStr; existing.total = snap.total; existing.lots = snap.lots; }
  else DATA.prisonSnapshots.push({week:key, secteur:currentSecteur, date:dateStr, total:snap.total, lots:snap.lots});
  DATA.prisonSnapshots.sort(function(a,b){ return a.week.localeCompare(b.week); });
}
function prisonPreviousSnapshot(){
  var cur = prisonWeekKey(todayStr());
  var prev = prisonSnapsSect().filter(function(s){ return s.week<cur; });
  return prev.length? prev[prev.length-1] : null;
}
function prisonLastUpdate(){
  var s = prisonSnapsSect();
  return s.length? s[s.length-1].date : null;
}

async function handleSavePrisonLot(){
  var defaut = document.getElementById('pl-defaut').value.trim();
  if(!defaut){ toast('Merci de renseigner le défaut.', 'error'); return; }
  var fields = {
    defaut: defaut,
    type: document.getElementById('pl-type').value.trim(),
    analyse: document.getElementById('pl-analyse').value.trim(),
    responsable: document.getElementById('pl-responsable').value.trim(),
    stockage: document.getElementById('pl-stockage').value.trim(),
    dateEntree: document.getElementById('pl-date').value || null,
    blocageSap: document.getElementById('pl-sap').value.trim()
  };
  var isNew = prisonLotFormOpen==='new';
  if(isNew){
    DATA.prisonLots.push(Object.assign({id:uid('prison'), secteur:currentSecteur, lignes:[]}, fields));
  } else {
    var lot = DATA.prisonLots.find(function(l){ return l.id===prisonLotFormOpen; });
    if(lot) Object.assign(lot, fields);
  }
  await prisonCommit(isNew?'Nouveau défaut':'Modification', defaut);

  prisonLotFormOpen = false;
  render();

var prisonCommitTimer = null, prisonPendingSummary = [], prisonRenderPending = false, prisonSaving = false;
function prisonApplyCell(el){
  var lot = DATA.prisonLots.find(function(l){ return l.id===el.dataset.lot; });
  if(!lot) return null;
  var line = (lot.lignes||[]).find(function(x){ return x.id===el.dataset.line; });
  if(!line) return null;
  var f = el.dataset.field;
  if(f==='ref' || f==='ligne'){ line[f] = el.value.trim(); }
  else { line[f] = Math.max(0, parseInt(el.value,10)||0); }
  // la valeur affichée devient la référence : le champ n'est plus considéré "en cours de modification"
  if(el.tagName==='SELECT'){ Array.prototype.forEach.call(el.options, function(o){ o.defaultSelected = o.selected; }); }
  else el.defaultValue = el.value;
  prisonRefreshTotals(lot);
  prisonScheduleCommit(lot.defaut+' · '+(line.ref||'?'));
  return {lot:lot, line:line};
}
function prisonRefreshTotals(lot){
  var card = document.getElementById('prison-detail-'+lot.id);

  (lot.lignes||[]).forEach(function(l){ var c = card.querySelector('[data-ptot-line="'+l.id+'"]'); if(c) c.textContent = prisonLineTotal(l); });
  PRISON_QTY_COLS.forEach(function(c){
    var t = (lot.lignes||[]).reduce(function(s,l){ return s+(Number(l[c[0]])||0); },0);

// Période analysée + période précédente équivalente (pour la colonne "évolution")
function paretoRange(period, month){
  var r = paretoRangeFull(period, month);
  // Période en cours : on compare à durée égale (ex. 1er-7 octobre contre 1er-7 septembre), sinon l'évolution est trompeuse
  var today = todayStr();

function paretoRangeFull(period, month){

// Collecte des données brutes : {key: {key,label,value,ligne,meta}}
function paretoRaw(src, range, ligne){
  var acc = {};
  function add(key, label, v, extra){
    if(!v) return;
    if(!acc[key]){ acc[key] = {key:key, label:label, value:0}; if(extra) Object.keys(extra).forEach(function(k){ acc[key][k] = extra[k]; }); }
    acc[key].value += v;
  }
  var lines = ligne ? [ligne] : paretoLinesFor(src);
  if(src.id==='chokko'){
    lines.forEach(function(l){
      var names = {}; chokkoPostes(l).forEach(function(p){ names[p[0]] = p[1]; });
      DATA.chokko.forEach(function(e){
        if(e.ligne!==l || !paretoInRange(e.date, range)) return;
        Object.keys(e.defects||{}).forEach(function(pid){
          var n = Number(e.defects[pid])||0;
          add(l+'|'+pid, (ligne?'':l+' · ')+pid+(names[pid]?' - '+names[pid]:''), n, {ligne:l, poste:pid, posteNom:names[pid]||''});
        });
      });
    });
  } else if(src.id==='propre_critere' || src.id==='propre_poste'){
    DATA.propAudits.forEach(function(a){
      if(lines.indexOf(a.ligne)<0 || !paretoInRange(a.date, range)) return;
      (a.items||[]).forEach(function(it){
        if(it.result!=='NG') return;
        if(src.id==='propre_poste'){ var po = it.poste||'Général'; add(po, po, 1); }
        else { var cr = (it.critere||'Critère').trim(); add(cr, cr+(it.poste && it.poste!=='Général'?' ('+it.poste+')':''), 1); }
      });
    });
  } else if(src.id==='contam'){
    DATA.contamination.forEach(function(c){
      if(c.statut!=='nc' || lines.indexOf(c.ligne)<0 || c.mois===undefined || c.mois===null) return;
      var d = c.annee+'-'+String(c.mois+1).padStart(2,'0')+'-15';
      if(!paretoInRange(d, range)) return;
      add(c.ligne+'|'+c.ref, c.ligne+' · '+c.ref, 1, {ligne:c.ligne});
    });
  } else if(src.id==='prison_defaut' || src.id==='prison_ref'){
    prisonLotsSect().forEach(function(lot){
      (lot.lignes||[]).forEach(function(pl){
        if(ligne && pl.ligne!==ligne) return;
        var n = prisonLineTotal(pl);
        if(src.id==='prison_defaut') add(lot.id, lot.defaut+(lot.type?' ('+lot.type+')':''), n, {lotId:lot.id});
        else add(String(pl.ref||'?'), 'Réf. '+(pl.ref||'?'), n);
      });
    });
  } else {
    bySecteur(DATA.actions).forEach(function(a){
      if(ligne && a.ligne!==ligne) return;
      if(src.id==='actions_late'){ if(!isActionLate(a)) return; }
      else if(!paretoActionOpen(a)) return;
      if(src.id==='actions_origine'){
        var o = (a.source && a.source.typeLabel) || a.origine || 'Non précisée';
        if(o==='Suivi des actions') o = 'Saisie directe';

      } else {
        var r = (a.responsable||'').trim() || 'Non assigné';
        add(r, r, 1);
      }
    });
  }
  return acc;
}
// Tri décroissant, pourcentages, cumul et classe A (jusqu'à 80 % du cumul) / B
function paretoCompute(src, range, ligne){
  var raw = paretoRaw(src, range, ligne);
  var rows = Object.keys(raw).map(function(k){ return raw[k]; }).filter(function(r){ return r.value>0; })
    .sort(function(a,b){ return b.value-a.value || a.label.localeCompare(b.label,'fr'); });
  var total = rows.reduce(function(s,r){ return s+r.value; },0);
  var cum = 0;
  rows.forEach(function(r){
    var before = total ? cum/total*100 : 0;
    cum += r.value;
    r.pct = total ? r.value/total*100 : 0;
    r.cum = total ? cum/total*100 : 0;
    r.cls = before < 80 ? 'A' : 'B';   // A = causes qui, cumulées, atteignent les 80 % (la barre qui franchit le seuil incluse)
  });
  var prev = null;
  if(src.period && range && range.prev){
    var praw = paretoRaw(src, range.prev, ligne);
    prev = {total:0, byKey:{}};
    Object.keys(praw).forEach(function(k){ prev.byKey[k] = praw[k].value; prev.total += praw[k].value; });
  }
  return {rows:rows, total:total, prev:prev, nA:rows.filter(function(r){ return r.cls==='A'; }).length};
}
function paretoFmtPct(v){ return (Math.round(v*10)/10).toLocaleString('fr-FR')+' %'; }
function paretoShort(s, n){ s = String(s); return s.length>n ? s.slice(0,n-1)+'…' : s; }

  var v = rest.reduce(function(s,r){ return s+r.value; },0);
  return top.concat([{key:'__autres__', label:'Autres ('+rest.length+')', value:v, pct:res.total? v/res.total*100:0, cum:100, cls:'C'}]);
}

function paretoReading(res, src, range){
  if(!res.total) return 'Aucune donnée sur la période.';

  }).join('')+'</select>';

  }
  h += '</div><div style="display:flex; gap:8px;">'+
    '<button class="btn" data-action="pareto-fullscreen" title="Afficher en plein écran pour la réunion">⛶ Plein écran</button>'+
    '<button class="btn" data-action="pareto-print" title="Exporter en PDF (A4 paysage)">🖨 Export PDF</button></div></div>';

  h += '<div class="card" id="pareto-card">';
  h += '<div class="pareto-head"><div><div class="eyebrow">Pareto</div><h2 style="margin:2px 0 0; font-size:18px;">'+esc(paretoTitle(cur))+'</h2></div>'+

  h += '<div class="pareto-table-wrap"><table class="pareto-table"><thead><tr><th>#</th><th>Cause</th><th class="num">Nb</th><th class="num">%</th><th class="num">Cumul</th>'+

    res.rows.map(function(r, i){

      }
      var linked = paretoLinkedCount(src, r);
      return '<tr class="pareto-row-'+r.cls+'"><td class="num">'+(i+1)+'</td><td>'+(r.cls==='A'?'<span class="pareto-a" title="Fait partie des causes qui pèsent 80 %">A</span> ':'')+esc(r.label)+'</td>'+
        '<td class="num"><b>'+r.value+'</b></td><td class="num">'+paretoFmtPct(r.pct)+'</td><td class="num">'+paretoFmtPct(r.cum)+'</td>'+evo+
        '<td class="row-actions-noprint" style="white-space:nowrap;">'+(linked? '<span class="tiny" title="Actions ouvertes liées à cette cause">'+linked+' action'+(linked>1?'s':'')+'</span> ' : '')+
          '<button class="btn small" data-action="pareto-new-action" data-key="'+esc(r.key)+'" title="Créer une action sur cette cause">+ Action</button></td></tr>';
    }).join('')+
    '</tbody></table></div></div>';
  h += '<p class="tiny" style="margin-top:10px; color:var(--text-faint);">Barres foncées (A) : les causes qui, cumulées, font 80 % du total, à traiter en priorité. Survolez une barre pour le libellé complet.</p>';
  h += '</div></div>';
  return h;
};

function rptMonthLabel(key){ var mi = Number(key.slice(5,7))-1; return MONTHS_FR[mi].charAt(0).toUpperCase()+MONTHS_FR[mi].slice(1)+' '+key.slice(0,4); }
function rptPct(v, d){ return v===null || v===undefined || isNaN(v) ? '-' : (Math.round(v*Math.pow(10,d||0))/Math.pow(10,d||0)).toLocaleString('fr-FR')+' %'; }
function rptLvlColor(l){ return {ok:'#2E7D4F', warn:'#B8730A', urgent:'#C25A00', danger:'#B23B2E'}[l] || '#555'; }

// Graphique dessiné hors écran puis transformé en image (pour l'impression)
function rptChartImage(config, w, h){
  if(typeof Chart==='undefined') return '';
  var c = document.createElement('canvas'); c.width = w; c.height = h;
  c.style.cssText = 'position:fixed; left:-10000px; top:0; width:'+w+'px; height:'+h+'px;';

  var url = '';
  try{
    config.options = config.options || {};
    config.options.responsive = false; config.options.animation = false; config.options.devicePixelRatio = 2;
    var ch = new Chart(c, config);
    url = c.toDataURL('image/png');

function rptScoreForMonth(key){

  if(!vals.length) return null;

function rptHighlights(key, isMCU, lateA, verifLate){
  var out = [], y = Number(key.slice(0,4)), m = Number(key.slice(5,7))-1;
  if(isMCU){
    ['MCU1','MCU2','MCU3'].forEach(function(l){
      var a = chokkoMonthAverage(l, y, m);
      if(a!==null && a<chokkoObjectif(l)) out.push('CHOKKO '+l+' sous l\'objectif : <b>'+pct1(a)+' %</b> (objectif '+chokkoObjectif(l)+' %).');
    });
    var pres = paretoCompute(paretoSourceById('chokko'), paretoRange('mois', key), '');
    if(pres.total) out.push('Première cause de non-CHOKKO : <b>'+esc(pres.rows[0].label)+'</b> ('+pres.rows[0].value+' défauts, '+paretoFmtPct(pres.rows[0].pct)+').');
    var nc = DATA.contamination.filter(function(c){ return c.annee===y && c.mois===m && c.statut==='nc'; });
    if(nc.length) out.push(nc.length+' résultat(s) de contamination non conforme(s) : '+nc.map(function(c){ return c.ligne+' · '+c.ref+' (gravité '+CONTAM_GRAVITES[contamNcAnalysis(c).grav].label.toLowerCase()+')'; }).join(', ')+'.');
  }
  if(lateA.length) out.push('<b>'+lateA.length+'</b> action(s) en retard, dont '+lateA.filter(function(a){ return !(a.responsable||'').trim(); }).length+' sans responsable.');
  if(verifLate.length) out.push(verifLate.length+' vérification(s) d\'efficacité en retard.');
  if(!out.length) out.push('Aucun écart notable sur le mois.');
  return out;
}
function openMonthlyReportPicker(){
  var ov = document.createElement('div');
  ov.className = 'ui-dialog-overlay';
  var def = todayStr().slice(0,7);
  if(Number(todayStr().slice(8,10)) <= 7) def = paretoShiftMonth(def, -1);   // en début de mois, on propose le mois écoulé
  ov.innerHTML = '<div class="ui-dialog ui-dialog-info"><div class="ui-dialog-head"><span class="ui-dialog-icon">📄</span><span class="ui-dialog-title">Rapport mensuel - revue de direction</span></div>'+
    '<div class="ui-dialog-body" style="white-space:normal;">Synthèse du mois sur 3 à 4 pages A4 (secteur '+esc(currentSecteur)+') : score, CHOKKO et Pareto, propreté, contamination, audits de perf, actions, métrologie, prison et formations, avec un cadre pour noter les décisions.'+
    '<label class="field" style="margin-top:12px;">Mois<input type="month" id="mr-month" value="'+def+'"></label></div>'+
    '<div class="ui-dialog-actions"><button type="button" class="btn" data-k="cancel">Annuler</button><button type="button" class="btn primary" data-k="ok">Générer le PDF</button></div></div>';
  document.body.appendChild(ov);

  ov.addEventListener('mousedown', function(e){ if(e.target===ov) close(); });

function printMonthlyReport(key){
  var old = document.getElementById('monthly-report'); if(old) old.remove();
  var sheet = document.createElement('div'); sheet.id = 'monthly-report';
  try{ sheet.innerHTML = buildMonthlyReport(key); }
  catch(e){ console.error('rapport mensuel', e); uiAlert('Le rapport n\'a pas pu être généré : '+e.message); return; }
  document.body.appendChild(sheet);
  document.body.classList.add('print-monthly-report');
  logChange('Rapport', 'Rapport mensuel', 'Secteur '+currentSecteur+' - '+rptMonthLabel(key));
  var cleanup = function(){ document.body.classList.remove('print-monthly-report'); var s = document.getElementById('monthly-report'); if(s) s.remove(); window.removeEventListener('afterprint', cleanup); };
  window.addEventListener('afterprint', cleanup);
  setTimeout(cleanup, 6000);
  setTimeout(function(){ printWithPageSize('A4 portrait'); }, 80);
}

async function handleDeleteChokkoPosteRow(ligne, poste){
  var nbTouched = 0;
  DATA.chokko.forEach(function(e){
    if(e.ligne===ligne && e.defects && e.defects[poste]!==undefined){
      delete e.defects[poste];

  toast('Ligne "'+poste+'" supprimée ('+nbTouched+' valeur(s) effacée(s)).');

function chokkoPostes(ligne){
  // La configuration personnalisee (ordre, libelles, ajouts/suppressions) prime sur la config d'origine.
  // Tant que l'utilisateur n'a rien personnalise pour cette ligne, on repart de CHOKKO_CONFIG telle quelle.
  var base = (DATA.chokkoPosteConfig && DATA.chokkoPosteConfig[ligne]) || CHOKKO_CONFIG[ligne] || [];
  var baseIds = base.map(function(p){return p[0];});
  var extra = [];
  var extraLabels = (DATA.chokkoPosteLabels && DATA.chokkoPosteLabels[ligne]) || {};
  DATA.chokko.forEach(function(e){
    if(e.ligne!==ligne) return;
    Object.keys(e.defects||{}).forEach(function(pid){
      if(baseIds.indexOf(pid)<0 && extra.indexOf(pid)<0){ extra.push(pid); }
    });
  });
  extra.sort();
  return base.concat(extra.map(function(pid){ return [pid, extraLabels[pid] || '(poste historique, hors config actuelle)']; }));
}
function chokkoPosteConfigFor(ligne){
  // Retourne (et initialise si besoin) la config editable en memoire pour cette ligne, copie de l'original au premier usage
  if(!DATA.chokkoPosteConfig) DATA.chokkoPosteConfig = {};
  if(!DATA.chokkoPosteConfig[ligne]){
    DATA.chokkoPosteConfig[ligne] = (CHOKKO_CONFIG[ligne]||[]).map(function(p){ return [p[0], p[1]]; });
  }
  return DATA.chokkoPosteConfig[ligne];
}
function daysInMonth(year, monthIdx){ return new Date(year, monthIdx+1, 0).getDate(); }
function chokkoEntry(ligne, dateStr){
  return DATA.chokko.find(function(e){ return e.ligne===ligne && e.date===dateStr; });
}
function chokkoGetOrCreate(ligne, dateStr){
  var e = chokkoEntry(ligne, dateStr);
  if(!e){ e = {id:uid('chk'), ligne:ligne, secteur:'MCU', date:dateStr, defects:{}, prod:{}}; DATA.chokko.push(e); }
  return e;
}
function chokkoDayTotals(ligne, dateStr){
  var e = chokkoEntry(ligne, dateStr);
  var totalProd = 0, totalNC = 0;
  if(e){
    if(e.prodOverride!==undefined && e.prodOverride!==null){
      totalProd = Number(e.prodOverride);
    } else {
      CHOKKO_TEAMS.forEach(function(t){ totalProd += Number(e.prod[t[0]]||0); });
    }
    chokkoPostes(ligne).forEach(function(p){ totalNC += Number(e.defects[p[0]]||0); });
  }
  var pct = totalProd>0 ? ((totalProd-totalNC)/totalProd*100) : null;
  return {totalProd:totalProd, totalNC:totalNC, pct:pct};
}
function chokkoLevel(pct){
  if(pct===null || pct===undefined) return 'neutral';
  if(pct>=CHOKKO_ATTENTION) return 'ok';
  if(pct>=CHOKKO_DANGER) return 'warn';
  return 'danger';
}
function chokkoObjectif(ligne){ return ligne==='MCU3' ? 98 : 99; }
// Pourcentage affiché à 1 décimale SANS arrondi supérieur (98,973 → 98,9) : la valeur affichée ne doit jamais dépasser la vraie donnée
function pct1(v){ return (Math.floor(Number(v)*10 + 1e-9)/10).toFixed(1); }
function chokkoLevelVsObjectif(pct, ligne){
  if(pct===null || pct===undefined) return 'neutral';
  var obj = chokkoObjectif(ligne);
  if(pct>=obj) return 'ok';
  if(pct>=obj-2) return 'warn';
  return 'danger';
}
function chokkoCostObjectif(ligne){ return ligne==='MCU3' ? 0.050 : 0.035; }
function chokkoCostLevel(cost, ligne){
  if(cost===null || cost===undefined || cost==='' || isNaN(cost)) return 'neutral';
  var obj = chokkoCostObjectif(ligne);
  if(cost<=obj) return 'ok';
  if(cost<=obj*1.15) return 'warn';
  return 'danger';
}
function chokkoMonthDays(ligne, year, monthIdx){
  var nb = daysInMonth(year, monthIdx);
  var days = [];
  for(var d=1; d<=nb; d++){
    var dateStr = year+'-'+String(monthIdx+1).padStart(2,'0')+'-'+String(d).padStart(2,'0');
    days.push({day:d, date:dateStr, totals:chokkoDayTotals(ligne, dateStr)});
  }
  return days;
}
function chokkoWeekGroups(days){
  // Regroupe les jours du mois par semaine ISO (pour les cellules fusionnées "CHOKKO DE LA SEMAINE")
  var groups = [];
  var current = null;
  days.forEach(function(d, idx){
    var wk = isoWeekInfo(d.date).week;
    if(!current || current.week!==wk){
      current = {week:wk, startIdx:idx, days:[]};
      groups.push(current);
    }
    current.days.push(d);
  });
  return groups.map(function(g){
    var valid = g.days.filter(function(d){ return d.totals.pct!==null; });
    var avg = valid.length ? valid.reduce(function(s,d){return s+d.totals.pct;},0)/valid.length : null;
    return {week:g.week, startIdx:g.startIdx, span:g.days.length, avg:avg};
  });
}
function chokkoMonthAverage(ligne, year, monthIdx){
  var days = chokkoMonthDays(ligne, year, monthIdx).filter(function(d){ return d.totals.pct!==null; });
  if(!days.length) return null;
  return days.reduce(function(s,d){return s+d.totals.pct;},0)/days.length;
}

// ---------- Données datées dans le futur (ex. fichier 2025 importé comme 2026) : détection et réparation ----------
function chokkoEntryHasValues(e){
  return Object.keys(e.defects||{}).some(function(k){ return Number(e.defects[k])>0; }) ||
    Object.keys(e.prod||{}).some(function(k){ return Number(e.prod[k])>0; }) ||
    (e.prodOverride!==undefined && e.prodOverride!==null && Number(e.prodOverride)>0);
}
function futureDataReport(){
  var today = todayStr();
  var ch = DATA.chokko.filter(function(e){ return e.date>today && chokkoEntryHasValues(e); });
  var at = DATA.ateq.filter(function(a){ return a.date>today && ((a.nbDefauts||0)>0 || (a.nb2nd||0)>0); });
  var months = {};
  ch.concat(at).forEach(function(x){ var k = x.ligne+' '+x.date.slice(0,7); months[k] = true; });
  var labels = Object.keys(months).sort().map(function(k){ var p = k.split(' '); return p[0]+' '+rptMonthLabel(p[1]).toLowerCase(); });
  var emptyFuture = DATA.chokko.filter(function(e){ return e.date>today && !chokkoEntryHasValues(e); }).length +
    DATA.ateq.filter(function(a){ return a.date>today && !((a.nbDefauts||0)>0 || (a.nb2nd||0)>0); }).length;
  return {chokko:ch, ateq:at, labels:labels, emptyFuture:emptyFuture, total: ch.length+at.length};
}
function futureDataBannerHtml(){
  var r = futureDataReport();
  if(!r.total) return '';
  return '<div class="future-banner">'+
    '<div><b>⚠ '+r.total+' saisie(s) datée(s) dans le futur</b> ('+(r.chokko.length? r.chokko.length+' jour(s) CHOKKO' : '')+(r.chokko.length&&r.ateq.length?' · ':'')+(r.ateq.length? r.ateq.length+' jour(s) ATEQ' : '')+') : '+esc(r.labels.slice(0,6).join(', '))+(r.labels.length>6?'…':'')+'.'+
    '<br><span class="tiny">Il s\'agit très probablement de données de l\'année précédente importées avec la mauvaise année (le poste OP1120 alimente aussi les défauts ATEQ).</span></div>'+
    '<div class="future-banner-actions"><button class="btn small primary" data-action="future-fix" data-mode="move">Les remettre un an plus tôt</button>'+
    '<button class="btn small danger-outline" data-action="future-fix" data-mode="delete">Les supprimer</button></div>'+
  '</div>';

async function handleFutureFix(mode){
  var r = futureDataReport();
  if(!r.total && !r.emptyFuture) return;
  var msg = mode==='move'
    ? 'Déplacer '+r.total+' saisie(s) un an plus tôt (ex. 15/11/2026 → 15/11/2025) ?\n\nSi le même jour de l\'année précédente contient déjà une saisie, celle-ci est conservée et la saisie datée dans le futur est supprimée.'
    : 'Supprimer définitivement '+r.total+' saisie(s) datée(s) dans le futur ?';
  if(!await uiConfirm(msg, {okLabel: mode==='move' ? 'Déplacer' : 'Supprimer', danger: mode!=='move'})) return;
  var today = todayStr(), moved = 0, kept = 0, removed = 0;
  var minus1 = function(d){ return (Number(d.slice(0,4))-1)+d.slice(4); };
  function relocate(list, hasVals){
    var past = list.filter(function(x){ return x.date<=today; });
    var future = list.filter(function(x){ return x.date>today; });
    var index = {}; past.forEach(function(x){ index[x.ligne+'|'+x.date] = x; });
    var out = past.slice();
    future.forEach(function(x){
      if(mode!=='move' || !hasVals(x)){ removed++; return; }
      var nd = minus1(x.date), target = index[x.ligne+'|'+nd];
      if(target && hasVals(target)){ kept++; return; }            // le vrai jour existe déjà : on le garde
      if(target){ out = out.filter(function(o){ return o!==target; }); }
      x.date = nd; out.push(x); index[x.ligne+'|'+nd] = x; moved++;
    });
    return out;
  }
  DATA.chokko = relocate(DATA.chokko, chokkoEntryHasValues);
  DATA.ateq = relocate(DATA.ateq, function(a){ return (a.nbDefauts||0)>0 || (a.nb2nd||0)>0; });
  // Notes d'actions CHOKKO rattachées à un mois futur
  var curY = Number(today.slice(0,4)), curM = Number(today.slice(5,7))-1;
  DATA.chokkoNotes = DATA.chokkoNotes.filter(function(n){
    if(!(n.annee>curY || (n.annee===curY && n.mois>curM))) return true;
    if(mode!=='move') return false;
    var dup = DATA.chokkoNotes.find(function(x){ return x!==n && x.ligne===n.ligne && x.poste===n.poste && x.annee===n.annee-1 && x.mois===n.mois; });
    if(dup) return false;
    n.annee--; return true;
  });
  await save('chokko'); await save('ateq'); await save('chokkoNotes');
  logChange('CHOKKO / ATEQ', mode==='move' ? 'Correction de l\'année' : 'Suppression données futures', moved+' déplacée(s), '+kept+' doublon(s) écarté(s), '+removed+' supprimée(s)');
  toast(mode==='move' ? moved+' saisie(s) remise(s) un an plus tôt'+(kept? ', '+kept+' doublon(s) écarté(s)' : '')+'.' : removed+' saisie(s) supprimée(s).');
  render();
}
